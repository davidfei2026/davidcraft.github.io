<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maps — DavidCraft</title>

  <link rel="stylesheet" href="davidcraft.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    :root {
      --map-accent: #22a06b;
      --map-accent-hover: #188456;
      --map-danger: #dc2626;
    }

    html[data-theme="dark"] {
      --map-accent: #35c486;
      --map-accent-hover: #47d497;
      --map-danger: #f87171;
    }

    .maps-page {
      width: min(100% - 24px, 1380px);
      margin: 0 auto;
      padding: 22px 0 30px;
    }

    .maps-layout {
      display: grid;
      grid-template-columns: 380px minmax(0, 1fr);
      gap: 18px;
      min-height: calc(100vh - 125px);
    }

    .maps-panel {
      padding: 20px;
      background: var(--dc-panel);
      border: 1px solid var(--dc-border);
      border-radius: 20px;
      box-shadow: 0 14px 36px var(--dc-shadow);
    }

    .maps-sidebar {
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-height: calc(100vh - 126px);
      overflow-y: auto;
    }

    .maps-sidebar h1 {
      margin: 0;
      font-size: 31px;
    }

    .maps-sidebar p {
      color: var(--dc-muted);
    }

    .search-row,
    .create-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 9px;
    }

    .text-input,
    .collection-select {
      min-width: 0;
      min-height: 46px;
      padding: 0 13px;
      border: 1px solid var(--dc-border);
      border-radius: 12px;
      background: var(--dc-page);
      color: var(--dc-text);
    }

    .primary,
    .secondary {
      min-height: 46px;
      padding: 0 15px;
      border-radius: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .primary {
      border: 0;
      background: var(--map-accent);
      color: white;
    }

    .primary:hover {
      background: var(--map-accent-hover);
    }

    .secondary {
      border: 1px solid var(--dc-border);
      background: var(--dc-soft);
      color: var(--dc-text);
    }

    .status {
      min-height: 22px;
      margin: 8px 0 0;
      color: var(--dc-muted);
      font-size: 13px;
    }

    .status.error {
      color: var(--map-danger);
    }

    .box {
      display: grid;
      gap: 9px;
      padding: 14px;
      border: 1px solid var(--dc-border);
      border-radius: 14px;
      background: var(--dc-soft);
    }

    .section-title {
      margin: 0 0 9px;
      font-size: 13px;
      font-weight: 800;
      color: var(--dc-text) !important;
    }

    .list {
      display: grid;
      gap: 9px;
    }

    .place-row,
    .saved-row {
      width: 100%;
      min-height: 46px;
      padding: 10px 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border: 1px solid var(--dc-border);
      border-radius: 12px;
      background: var(--dc-soft);
      color: var(--dc-text);
    }

    .place-row {
      cursor: pointer;
    }

    .place-row:hover,
    .saved-row:hover {
      border-color: var(--map-accent);
    }

    .place-row strong,
    .saved-main strong {
      display: block;
    }

    .subtext {
      display: block;
      margin-top: 2px;
      color: var(--dc-muted);
      font-size: 12px;
    }

    .saved-main {
      min-width: 0;
      flex: 1;
      border: 0;
      background: transparent;
      color: inherit;
      text-align: left;
      cursor: pointer;
    }

    .saved-main strong {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .delete {
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--map-danger);
      font-size: 20px;
      cursor: pointer;
    }

    .empty {
      margin: 0;
      padding: 12px;
      border: 1px dashed var(--dc-border);
      border-radius: 12px;
      color: var(--dc-muted);
      font-size: 13px;
    }

    .map-panel {
      padding: 0;
      overflow: hidden;
      min-height: 620px;
    }

    #map {
      width: 100%;
      height: 100%;
      min-height: 620px;
      background: var(--dc-soft);
    }

    @media (max-width: 900px) {
      .maps-layout {
        grid-template-columns: 1fr;
      }

      .maps-sidebar {
        max-height: none;
        overflow: visible;
      }

      .map-panel,
      #map {
        min-height: 540px;
      }
    }

    @media (max-width: 560px) {
      .maps-page {
        width: min(100% - 14px, 1380px);
      }

      .search-row,
      .create-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body data-davidcraft-page="maps">
  <div id="davidcraft-navbar"></div>

  <main class="maps-page">
    <section class="maps-layout">
      <aside class="maps-panel maps-sidebar">
        <div>
          <h1>Maps</h1>
          <p>Search for a city, address, park, restaurant, or landmark.</p>
        </div>

        <div>
          <label for="place-search"><strong>Search for a place</strong></label>
          <div class="search-row">
            <input id="place-search" class="text-input" type="search"
              placeholder="Forest Park, St. Louis">
            <button id="search-button" class="primary" type="button">Search</button>
          </div>
          <p id="search-status" class="status" aria-live="polite">
            The map starts in St. Louis.
          </p>
        </div>

        <div class="box">
          <strong id="current-place-name">Current place: St. Louis</strong>
          <select id="collection-select" class="collection-select"></select>
          <button id="save-place-button" class="primary" type="button">
            ★ Save Current Place
          </button>
        </div>

        <div>
          <p class="section-title">Quick places</p>
          <div class="list">
            <button class="place-row" type="button"
              data-lat="38.6270" data-lon="-90.1994" data-zoom="12"
              data-name="St. Louis">
              <span><strong>St. Louis</strong><span class="subtext">Missouri</span></span>
              <span>→</span>
            </button>

            <button class="place-row" type="button"
              data-lat="38.6386" data-lon="-90.2845" data-zoom="14"
              data-name="Forest Park">
              <span><strong>Forest Park</strong><span class="subtext">St. Louis</span></span>
              <span>→</span>
            </button>

            <button class="place-row" type="button"
              data-lat="37.1903" data-lon="-91.1690" data-zoom="11"
              data-name="Ozark National Scenic Riverways">
              <span><strong>Ozark Riverways</strong><span class="subtext">Missouri</span></span>
              <span>→</span>
            </button>
          </div>
        </div>

        <div>
          <p class="section-title">Collections</p>
          <div class="create-row">
            <input id="new-collection-name" class="text-input" type="text"
              placeholder="New collection name" maxlength="40">
            <button id="create-collection-button" class="secondary" type="button">Add</button>
          </div>
          <div id="collections-container"></div>
        </div>
      </aside>

      <section class="maps-panel map-panel" aria-label="Interactive map">
        <div id="map"></div>
      </section>
    </section>
  </main>

  <footer class="dc-footer">DavidCraft Maps · v0.1</footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const COLLECTIONS_KEY = "davidcraft-map-collections";

    const searchInput = document.getElementById("place-search");
    const searchButton = document.getElementById("search-button");
    const searchStatus = document.getElementById("search-status");
    const currentPlaceName = document.getElementById("current-place-name");
    const collectionSelect = document.getElementById("collection-select");
    const savePlaceButton = document.getElementById("save-place-button");
    const newCollectionName = document.getElementById("new-collection-name");
    const createCollectionButton = document.getElementById("create-collection-button");
    const collectionsContainer = document.getElementById("collections-container");

    const map = L.map("map").setView([38.6270, -90.1994], 12);

    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap contributors"
    }).addTo(map);

    let marker = L.marker([38.6270, -90.1994])
      .addTo(map)
      .bindPopup("<strong>St. Louis</strong>")
      .openPopup();

    let currentPlace = {
      name: "St. Louis",
      lat: 38.6270,
      lon: -90.1994,
      zoom: 12
    };

    let collections = loadCollections();

    function loadCollections() {
      try {
        const saved = JSON.parse(localStorage.getItem(COLLECTIONS_KEY));
        if (saved && typeof saved === "object" && !Array.isArray(saved)) {
          return saved;
        }
      } catch (error) {
        console.error(error);
      }
      return { Favorites: [] };
    }

    function saveCollections() {
      localStorage.setItem(COLLECTIONS_KEY, JSON.stringify(collections));
    }

    function showLocation(lat, lon, name, zoom = 14) {
      const latitude = Number(lat);
      const longitude = Number(lon);

      map.setView([latitude, longitude], Number(zoom));

      if (marker) map.removeLayer(marker);

      marker = L.marker([latitude, longitude])
        .addTo(map)
        .bindPopup(`<strong>${name}</strong>`)
        .openPopup();

      currentPlace = {
        name,
        lat: latitude,
        lon: longitude,
        zoom: Number(zoom)
      };

      currentPlaceName.textContent = `Current place: ${name}`;
    }

    function renderCollections() {
      collectionsContainer.innerHTML = "";
      collectionSelect.innerHTML = "";

      Object.keys(collections).forEach((collectionName) => {
        const option = document.createElement("option");
        option.value = collectionName;
        option.textContent = collectionName;
        collectionSelect.appendChild(option);

        const section = document.createElement("section");
        section.style.marginTop = "16px";

        const title = document.createElement("p");
        title.className = "section-title";
        title.textContent = collectionName;

        const list = document.createElement("div");
        list.className = "list";

        if (!collections[collectionName].length) {
          const empty = document.createElement("p");
          empty.className = "empty";
          empty.textContent = "No saved places in this collection.";
          list.appendChild(empty);
        }

        collections[collectionName].forEach((place, index) => {
          const row = document.createElement("div");
          row.className = "saved-row";

          const open = document.createElement("button");
          open.className = "saved-main";
          open.type = "button";
          open.innerHTML =
            `<strong>${place.name}</strong>` +
            `<span class="subtext">${place.lat.toFixed(4)}, ${place.lon.toFixed(4)}</span>`;

          open.addEventListener("click", () => {
            showLocation(place.lat, place.lon, place.name, place.zoom || 14);
          });

          const remove = document.createElement("button");
          remove.className = "delete";
          remove.type = "button";
          remove.textContent = "×";

          remove.addEventListener("click", () => {
            collections[collectionName].splice(index, 1);
            saveCollections();
            renderCollections();
          });

          row.append(open, remove);
          list.appendChild(row);
        });

        section.append(title, list);
        collectionsContainer.appendChild(section);
      });
    }

    async function searchPlace() {
      const query = searchInput.value.trim();

      if (!query) {
        searchStatus.textContent = "Type a place to search.";
        searchStatus.className = "status error";
        return;
      }

      searchButton.disabled = true;
      searchButton.textContent = "Searching…";
      searchStatus.textContent = "Searching…";

      try {
        const url =
          "https://nominatim.openstreetmap.org/search" +
          `?format=jsonv2&limit=1&q=${encodeURIComponent(query)}`;

        const response = await fetch(url);
        const results = await response.json();

        if (!results.length) {
          searchStatus.textContent = "No place found.";
          searchStatus.className = "status error";
          return;
        }

        const result = results[0];
        showLocation(result.lat, result.lon, result.display_name, 14);
        searchStatus.textContent = result.display_name;
        searchStatus.className = "status";
      } catch (error) {
        searchStatus.textContent = "Search could not connect.";
        searchStatus.className = "status error";
      } finally {
        searchButton.disabled = false;
        searchButton.textContent = "Search";
      }
    }

    searchButton.addEventListener("click", searchPlace);

    searchInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        searchPlace();
      }
    });

    document.querySelectorAll(".place-row").forEach((button) => {
      button.addEventListener("click", () => {
        showLocation(
          button.dataset.lat,
          button.dataset.lon,
          button.dataset.name,
          button.dataset.zoom
        );
      });
    });

    createCollectionButton.addEventListener("click", () => {
      const name = newCollectionName.value.trim();

      if (!name || collections[name]) return;

      collections[name] = [];
      newCollectionName.value = "";
      saveCollections();
      renderCollections();
      collectionSelect.value = name;
    });

    savePlaceButton.addEventListener("click", () => {
      const collectionName = collectionSelect.value;
      if (!collectionName) return;

      const duplicate = collections[collectionName].some((place) =>
        Math.abs(place.lat - currentPlace.lat) < 0.00001 &&
        Math.abs(place.lon - currentPlace.lon) < 0.00001
      );

      if (duplicate) {
        searchStatus.textContent = "That place is already saved.";
        searchStatus.className = "status error";
        return;
      }

      collections[collectionName].push({ ...currentPlace });
      saveCollections();
      renderCollections();

      searchStatus.textContent = `Saved to ${collectionName}.`;
      searchStatus.className = "status";
    });

    renderCollections();
  </script>

  <script src="davidcraft.js"></script>
</body>
</html>
