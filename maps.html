<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maps — DavidCraft Home</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <script>
    (() => {
      const choice = localStorage.getItem("davidcraft-theme") || "system";
      const systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme =
        choice === "system" ? (systemDark ? "dark" : "light") : choice;
    })();
  </script>

  <style>
    :root {
      color-scheme: light;
      --page: #f4f7fb;
      --panel: #ffffff;
      --soft: #eef2f7;
      --text: #171923;
      --muted: #697386;
      --border: #dfe3ec;
      --accent: #22a06b;
      --accent-hover: #188456;
      --shadow: rgba(24, 32, 50, 0.12);
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --page: #0c1220;
      --panel: #171f2d;
      --soft: #202938;
      --text: #f5f7fb;
      --muted: #aab4c7;
      --border: #303a4c;
      --accent: #35c486;
      --accent-hover: #47d497;
      --shadow: rgba(0, 0, 0, 0.30);
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(circle at 10% 0%, rgba(34, 197, 94, 0.12), transparent 28rem),
        var(--page);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, input { font: inherit; }

    .topbar {
      min-height: 70px;
      padding: 14px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      background: color-mix(in srgb, var(--panel) 90%, transparent);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(14px);
    }

    .logo {
      color: var(--text);
      font-size: 21px;
      font-weight: 850;
      text-decoration: none;
    }

    .logo span { color: var(--accent); }
    .top-actions { display: flex; gap: 10px; }

    .top-link, .theme-button {
      min-height: 42px;
      padding: 0 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }

    .top-link:hover, .theme-button:hover { border-color: var(--accent); }

    main {
      width: min(100% - 24px, 1280px);
      margin: 0 auto;
      padding: 22px 0 30px;
      flex: 1;
    }

    .maps-layout {
      display: grid;
      grid-template-columns: 340px minmax(0, 1fr);
      gap: 18px;
      min-height: calc(100vh - 125px);
    }

    .panel {
      padding: 20px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 14px 36px var(--shadow);
    }

    .sidebar-panel {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .sidebar-panel h1 {
      margin: 0;
      font-size: 31px;
      letter-spacing: -0.03em;
    }

    .sidebar-panel > div > p {
      margin: 7px 0 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .search-group { display: grid; gap: 10px; }
    .search-group label, .section-title { font-size: 13px; font-weight: 800; }
    .search-row { display: grid; grid-template-columns: 1fr auto; gap: 9px; }

    .search-input {
      min-width: 0;
      min-height: 48px;
      padding: 0 13px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--page);
      color: var(--text);
      outline: none;
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(34, 160, 107, 0.15);
    }

    .search-button {
      min-height: 48px;
      padding: 0 16px;
      border: 0;
      border-radius: 12px;
      background: var(--accent);
      color: #ffffff;
      font-weight: 800;
      cursor: pointer;
    }

    .search-button:hover { background: var(--accent-hover); }
    .search-button:disabled { opacity: 0.65; cursor: not-allowed; }

    .status {
      min-height: 22px;
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .status.error { color: #dc2626; }
    .quick-list { display: grid; gap: 9px; }

    .quick-place {
      width: 100%;
      min-height: 46px;
      padding: 0 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--soft);
      color: var(--text);
      text-align: left;
      cursor: pointer;
    }

    .quick-place:hover { border-color: var(--accent); }
    .place-name { font-weight: 750; }

    .place-subtitle {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
    }

    .tip {
      margin-top: auto;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--soft);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .map-panel {
      padding: 0;
      overflow: hidden;
      min-height: 620px;
    }

    #map {
      width: 100%;
      height: 100%;
      min-height: 620px;
      background: var(--soft);
    }

    .leaflet-control-zoom a,
    .leaflet-popup-content-wrapper,
    .leaflet-popup-tip {
      background: var(--panel);
      color: var(--text);
    }

    .leaflet-control-attribution {
      background: color-mix(in srgb, var(--panel) 88%, transparent) !important;
      color: var(--muted);
    }

    .leaflet-control-attribution a { color: var(--accent); }

    footer {
      padding: 20px;
      text-align: center;
      color: var(--muted);
      border-top: 1px solid var(--border);
    }

    @media (max-width: 850px) {
      .maps-layout { grid-template-columns: 1fr; }
      .map-panel, #map { min-height: 540px; }
    }

    @media (max-width: 560px) {
      .topbar { padding-left: 14px; padding-right: 14px; }
      .top-link { display: none; }
      main { width: min(100% - 14px, 1280px); }
      .panel { border-radius: 16px; }
      .search-row { grid-template-columns: 1fr; }
      .search-button { width: 100%; }
      .map-panel, #map { min-height: 470px; }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <a class="logo" href="home.html">DavidCraft <span>Maps</span></a>

    <div class="top-actions">
      <a class="top-link" href="home.html">← DavidCraft Home</a>
      <button id="theme-button" class="theme-button" type="button">◐ Theme</button>
    </div>
  </header>

  <main>
    <section class="maps-layout">
      <aside class="panel sidebar-panel">
        <div>
          <h1>Maps</h1>
          <p>Search for a city, address, park, restaurant, or landmark.</p>
        </div>

        <div class="search-group">
          <label for="place-search">Search for a place</label>

          <div class="search-row">
            <input
              id="place-search"
              class="search-input"
              type="search"
              placeholder="Example: Forest Park, St. Louis"
              autocomplete="off"
            >

            <button id="search-button" class="search-button" type="button">
              Search
            </button>
          </div>

          <p id="search-status" class="status" aria-live="polite">
            The map starts in St. Louis.
          </p>
        </div>

        <div>
          <p class="section-title">Quick places</p>

          <div class="quick-list">
            <button class="quick-place" type="button"
              data-lat="38.6270" data-lon="-90.1994" data-zoom="12" data-name="St. Louis">
              <span>
                <span class="place-name">St. Louis</span>
                <span class="place-subtitle">Missouri</span>
              </span>
              <span>→</span>
            </button>

            <button class="quick-place" type="button"
              data-lat="38.6386" data-lon="-90.2845" data-zoom="14" data-name="Forest Park">
              <span>
                <span class="place-name">Forest Park</span>
                <span class="place-subtitle">St. Louis</span>
              </span>
              <span>→</span>
            </button>

            <button class="quick-place" type="button"
              data-lat="37.1903" data-lon="-91.1690" data-zoom="11" data-name="Ozark National Scenic Riverways">
              <span>
                <span class="place-name">Ozark Riverways</span>
                <span class="place-subtitle">Missouri</span>
              </span>
              <span>→</span>
            </button>
          </div>
        </div>

        <div class="tip">
          Tip: search for a full place name and city for the best result. You can drag, zoom, and tap the map.
        </div>
      </aside>

      <section class="panel map-panel" aria-label="Interactive map">
        <div id="map"></div>
      </section>
    </section>
  </main>

  <footer>DavidCraft Maps</footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const THEME_KEY = "davidcraft-theme";
    const themeButton = document.getElementById("theme-button");
    const searchInput = document.getElementById("place-search");
    const searchButton = document.getElementById("search-button");
    const searchStatus = document.getElementById("search-status");

    const map = L.map("map").setView([38.6270, -90.1994], 12);

    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    let activeMarker = L.marker([38.6270, -90.1994])
      .addTo(map)
      .bindPopup("<strong>St. Louis</strong><br>Welcome to DavidCraft Maps.");

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (character) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[character]);
    }

    function showLocation(lat, lon, name, zoom = 14) {
      const latitude = Number(lat);
      const longitude = Number(lon);

      map.setView([latitude, longitude], Number(zoom));

      if (activeMarker) {
        map.removeLayer(activeMarker);
      }

      activeMarker = L.marker([latitude, longitude])
        .addTo(map)
        .bindPopup(`<strong>${escapeHtml(name)}</strong>`)
        .openPopup();
    }

    async function searchPlace() {
      const query = searchInput.value.trim();

      if (!query) {
        searchStatus.textContent = "Type a place to search.";
        searchStatus.className = "status error";
        searchInput.focus();
        return;
      }

      searchButton.disabled = true;
      searchButton.textContent = "Searching…";
      searchStatus.textContent = "Searching OpenStreetMap…";
      searchStatus.className = "status";

      try {
        const endpoint =
          "https://nominatim.openstreetmap.org/search" +
          `?format=jsonv2&limit=1&q=${encodeURIComponent(query)}`;

        const response = await fetch(endpoint, {
          headers: { "Accept": "application/json" }
        });

        if (!response.ok) {
          throw new Error("Search service returned an error.");
        }

        const results = await response.json();

        if (!Array.isArray(results) || results.length === 0) {
          searchStatus.textContent = "No place was found. Try adding the city or state.";
          searchStatus.className = "status error";
          return;
        }

        const result = results[0];
        showLocation(result.lat, result.lon, result.display_name, 14);
        searchStatus.textContent = result.display_name;
        searchStatus.className = "status";
      } catch (error) {
        console.error(error);
        searchStatus.textContent = "The place search could not connect. Please try again.";
        searchStatus.className = "status error";
      } finally {
        searchButton.disabled = false;
        searchButton.textContent = "Search";
      }
    }

    searchButton.addEventListener("click", searchPlace);

    searchInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        searchPlace();
      }
    });

    document.querySelectorAll(".quick-place").forEach((button) => {
      button.addEventListener("click", () => {
        showLocation(
          button.dataset.lat,
          button.dataset.lon,
          button.dataset.name,
          button.dataset.zoom
        );

        searchStatus.textContent = button.dataset.name;
        searchStatus.className = "status";
      });
    });

    function getVisibleTheme(choice) {
      if (choice === "system") {
        return window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
      }

      return choice;
    }

    function applyTheme(choice) {
      localStorage.setItem(THEME_KEY, choice);
      document.documentElement.dataset.theme = getVisibleTheme(choice);
    }

    themeButton.addEventListener("click", () => {
      const current = localStorage.getItem(THEME_KEY) || "system";
      const next =
        current === "light"
          ? "dark"
          : current === "dark"
            ? "system"
            : "light";

      applyTheme(next);
    });

    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
      if ((localStorage.getItem(THEME_KEY) || "system") === "system") {
        applyTheme("system");
      }
    });
  </script>
</body>
</html>
