<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA Code Editor</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Inter, Arial, sans-serif;
  background: #0b0d12;
  color: #fff;
}

button, input, textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

.app {
  display: grid;
  grid-template-rows: 54px 1fr;
  height: 100vh;
}

.topbar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 14px;
  background: #11141b;
  border-bottom: 1px solid #252a35;
}

.logo {
  font-size: 18px;
  font-weight: 800;
  margin-right: 15px;
}

.logo span {
  color: #6ea8ff;
}

.topbar button {
  border: 1px solid #303642;
  background: #181c24;
  color: white;
  padding: 7px 12px;
  border-radius: 7px;
}

.topbar button:hover {
  background: #242a35;
}

.run {
  background: #2563eb !important;
  border-color: #2563eb !important;
}

.workspace {
  display: grid;
  grid-template-columns: 190px minmax(300px, 1fr) minmax(280px, 360px);
  min-height: 0;
}

.files {
  background: #10131a;
  border-right: 1px solid #252a35;
  padding: 14px 8px;
}

.files-title {
  font-size: 12px;
  font-weight: 700;
  color: #8992a3;
  padding: 0 8px 10px;
}

.file {
  width: 100%;
  text-align: left;
  background: transparent;
  border: 0;
  color: #cbd2df;
  padding: 9px 10px;
  border-radius: 6px;
}

.file:hover,
.file.active {
  background: #202632;
  color: white;
}

.editor-area {
  display: grid;
  grid-template-rows: 38px 1fr 42%;
  min-width: 0;
  min-height: 0;
}

.tabs {
  display: flex;
  align-items: center;
  background: #151922;
  border-bottom: 1px solid #252a35;
  overflow-x: auto;
}

.tab {
  padding: 10px 15px;
  border-right: 1px solid #252a35;
  color: #929bad;
  font-size: 13px;
}

.tab.active {
  color: white;
  background: #0b0d12;
}

.editor-wrap {
  position: relative;
  min-height: 0;
}

#editor {
  width: 100%;
  height: 100%;
  resize: none;
  outline: none;
  border: 0;
  padding: 18px;
  background: #0b0d12;
  color: #d7deeb;
  font-family: "SFMono-Regular", Consolas, monospace;
  font-size: 14px;
  line-height: 1.6;
  tab-size: 2;
}

.preview {
  display: grid;
  grid-template-rows: 36px 1fr;
  border-top: 1px solid #252a35;
  min-height: 0;
}

.preview-title {
  display: flex;
  align-items: center;
  padding: 0 12px;
  background: #151922;
  color: #9aa3b4;
  font-size: 12px;
}

#preview {
  width: 100%;
  height: 100%;
  border: 0;
  background: white;
}

.ai {
  display: grid;
  grid-template-rows: 45px 1fr auto;
  background: #10131a;
  border-left: 1px solid #252a35;
  min-height: 0;
}

.ai-header {
  display: flex;
  align-items: center;
  padding: 0 14px;
  border-bottom: 1px solid #252a35;
  font-weight: 700;
}

.messages {
  overflow-y: auto;
  padding: 14px;
}

.message {
  padding: 10px 12px;
  margin-bottom: 10px;
  border-radius: 9px;
  line-height: 1.5;
  white-space: pre-wrap;
  font-size: 13px;
}

.message.user {
  background: #1d4ed8;
}

.message.ai {
  background: #1b202a;
}

.ai-input {
  padding: 10px;
  border-top: 1px solid #252a35;
}

#prompt {
  width: 100%;
  min-height: 80px;
  resize: vertical;
  border: 1px solid #303642;
  border-radius: 8px;
  background: #0b0d12;
  color: white;
  padding: 10px;
  outline: none;
}

.ai-actions {
  display: flex;
  gap: 8px;
  margin-top: 8px;
}

.ai-actions button {
  flex: 1;
  border: 0;
  border-radius: 7px;
  padding: 9px;
  background: #2563eb;
  color: white;
}

.ai-actions button.secondary {
  background: #252a35;
}

.status {
  position: fixed;
  bottom: 8px;
  left: 8px;
  font-size: 11px;
  color: #737d90;
  pointer-events: none;
}

@media (max-width: 850px) {
  .workspace {
    grid-template-columns: 150px minmax(250px, 1fr);
  }

  .ai {
    display: none;
  }
}

@media (max-width: 600px) {
  .workspace {
    grid-template-columns: 1fr;
  }

  .files {
    display: none;
  }

  .editor-area {
    grid-template-rows: 38px 1fr 40%;
  }
}
</style>
</head>

<body>

<div class="app">

  <header class="topbar">
    <div class="logo">NOVA <span>Code</span></div>

    <button id="newFileBtn">＋ New File</button>
    <button id="saveBtn">Save</button>
    <button id="downloadBtn">Download</button>
    <button class="run" id="runBtn">▶ Run</button>
  </header>

  <main class="workspace">

    <aside class="files">
      <div class="files-title">FILES</div>

      <button class="file active" data-file="index.html">
        📄 index.html
      </button>

      <button class="file" data-file="style.css">
        🎨 style.css
      </button>

      <button class="file" data-file="script.js">
        ⚡ script.js
      </button>
    </aside>

    <section class="editor-area">

      <div class="tabs">
        <div class="tab active" id="currentTab">
          index.html
        </div>
      </div>

      <div class="editor-wrap">
        <textarea id="editor" spellcheck="false"></textarea>
      </div>

      <div class="preview">
        <div class="preview-title">
          LIVE PREVIEW
        </div>

        <iframe id="preview" sandbox="allow-scripts"></iframe>
      </div>

    </section>

    <aside class="ai">

      <div class="ai-header">
        🤖 NOVA AI
      </div>

      <div class="messages" id="messages">
        <div class="message ai">
          Hi! I'm your coding assistant.

          Ask me to create, explain, fix, or modify your code.
        </div>
      </div>

      <div class="ai-input">

        <textarea
          id="prompt"
          placeholder="Ask AI to build or modify something..."
        ></textarea>

        <div class="ai-actions">
          <button id="askBtn">Ask AI</button>
          <button class="secondary" id="fixBtn">Fix Code</button>
        </div>

      </div>

    </aside>

  </main>

</div>

<div class="status" id="status">
  Ready
</div>

<script src="editor.js"></script>

</body>
</html>
