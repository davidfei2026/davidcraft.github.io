<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hotel Simulator</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #e9eef5;
    }

    header {
      background: #17324d;
      color: white;
      padding: 20px;
      text-align: center;
    }

    #money {
      font-size: 20px;
      margin-top: 5px;
    }

    #guests {
      font-size: 18px;
      margin-top: 5px;
    }

    #tools {
      background: white;
      padding: 12px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #1976d2;
      color: white;
      font-weight: bold;
    }

    #game {
      display: grid;
      grid-template-columns: repeat(10, 50px);
      gap: 2px;
      padding: 15px;
      overflow: auto;
    }

    .tile {
      width: 50px;
      height: 50px;
      background: #d8d0c3;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    .room {
      background: white;
    }

    .hall {
      background: #c9bda9;
    }

    .wall {
      background: #765f48;
    }

    .door {
      background: #b88a54;
    }
  </style>
</head>

<body>

<header>
  <h1>🏨 My Hotel</h1>

  <div id="money">
    💰 $25,000
  </div>

  <div id="guests">
    👥 Guests: 0
  </div>
</header>

<div id="tools">

  <button onclick="selectTool('room')">
    🛏️ Room — $1,000
  </button>

  <button onclick="selectTool('hall')">
    🚶 Hall — $100
  </button>

  <button onclick="selectTool('wall')">
    🧱 Wall — $50
  </button>

  <button onclick="selectTool('door')">
    🚪 Door — $75
  </button>

</div>

<div id="game"></div>

<script>

let money = 25000;

let guests = 0;

let selectedTool = "room";

const costs = {
  room: 1000,
  hall: 100,
  wall: 50,
  door: 75
};

const emojis = {
  room: "🛏️",
  hall: "",
  wall: "",
  door: "🚪"
};


function selectTool(tool) {

  selectedTool = tool;

}


function createMap() {

  const game = document.getElementById("game");

  for (let i = 0; i < 80; i++) {

    const tile = document.createElement("div");

    tile.className = "tile";

    tile.onclick = function() {

      build(tile);

    };

    game.appendChild(tile);

  }

}


function build(tile) {

  const cost = costs[selectedTool];

  if (money < cost) {

    alert("You don't have enough money!");

    return;

  }

  if (tile.dataset.built === "true") {

    alert("This space is already occupied!");

    return;

  }

  money -= cost;

  tile.dataset.built = "true";

  tile.classList.add(selectedTool);

  tile.textContent = emojis[selectedTool];

  document.getElementById("money").textContent =
    "💰 $" + money.toLocaleString();


  if (selectedTool === "room") {

    setTimeout(function() {

      guests++;

      document.getElementById("guests").textContent =
        "👥 Guests: " + guests;

    }, 1000);

  }

}


createMap();

</script>

</body>
</html>
