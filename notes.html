<!doctype html><html><head><title>DavidCraft Notes</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="davidcraft.css">
<style>
*{box-sizing:border-box}.page{width:min(100% - 20px,1200px);margin:auto;padding:26px 0 50px}
.hero,.panel{background:var(--dc-panel);border:1px solid var(--dc-border);box-shadow:0 14px 34px var(--dc-shadow)}
.hero{padding:26px;border-radius:24px;margin-bottom:16px}.hero h1{margin:0;font-size:clamp(40px,7vw,68px);letter-spacing:-.05em}.hero p{color:var(--dc-muted);line-height:1.55}
.panel{border-radius:18px;padding:16px}.btn{min-height:42px;padding:0 13px;border:1px solid var(--dc-border);border-radius:10px;background:var(--dc-panel);color:var(--dc-text);font-weight:800;cursor:pointer}.primary{border:0;background:linear-gradient(135deg,#2563eb,#06b6d4);color:white}
input,textarea,select{border:1px solid var(--dc-border);border-radius:10px;background:var(--dc-page);color:var(--dc-text);padding:11px}.grid{display:grid;gap:12px}.cards{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.card{padding:15px;border:1px solid var(--dc-border);border-radius:14px;background:var(--dc-panel)}.muted{color:var(--dc-muted)}
</style></head>
<body data-davidcraft-page="notes"><div id="davidcraft-navbar"></div><main class="page">
<section class="hero"><h1>📝 Notes</h1><p>Private local notes with search, pinning, checklists, and automatic saving.</p></section>
<section class="grid" style="grid-template-columns:280px 1fr">
<div class="panel"><button class="btn primary" id="new" style="width:100%">＋ New Note</button><input id="search" placeholder="Search notes" style="width:100%;margin-top:10px"><div id="list" style="margin-top:10px"></div></div>
<div class="panel"><input id="title" placeholder="Note title" style="width:100%;font-size:20px;font-weight:800"><textarea id="body" placeholder="Start writing…" style="width:100%;height:420px;margin-top:10px;resize:vertical"></textarea><div style="display:flex;gap:8px;margin-top:10px"><button class="btn" id="pin">☆ Pin</button><button class="btn" id="check">☑ Add checklist</button><button class="btn" id="delete">🗑 Delete</button></div><p class="muted" id="saved">Saved locally</p></div>
</section></main><script>
const K="dc_notes_v1",$=x=>document.getElementById(x);let notes=JSON.parse(localStorage.getItem(K)||"[]"),active=null;
const save=()=>{localStorage.setItem(K,JSON.stringify(notes));$("saved").textContent="Saved locally · "+new Date().toLocaleTimeString();render()};
function make(){let n={id:Date.now(),title:"Untitled Note",body:"",pin:false,updated:Date.now()};notes.unshift(n);active=n.id;save();load()}
function load(){let n=notes.find(x=>x.id===active);if(!n)return;$("title").value=n.title;$("body").value=n.body;$("pin").textContent=n.pin?"★ Pinned":"☆ Pin"}
function render(){let q=$("search").value.toLowerCase();$("list").innerHTML="";notes.filter(n=>(n.title+" "+n.body).toLowerCase().includes(q)).sort((a,b)=>b.pin-a.pin||b.updated-a.updated).forEach(n=>{let b=document.createElement("button");b.className="btn";b.style="width:100%;margin:4px 0;text-align:left";b.textContent=(n.pin?"★ ":"")+n.title;b.onclick=()=>{active=n.id;load()};$("list").appendChild(b)})}
$("new").onclick=make;$("search").oninput=render;
["title","body"].forEach(i=>$(i).oninput=()=>{let n=notes.find(x=>x.id===active);if(!n)return;n.title=$("title").value;n.body=$("body").value;n.updated=Date.now();save()});
$("pin").onclick=()=>{let n=notes.find(x=>x.id===active);if(n){n.pin=!n.pin;save();load()}};
$("check").onclick=()=>{let n=notes.find(x=>x.id===active);if(n){$("body").value+=($("body").value?"\n":"")+"☐ ";n.body=$("body").value;save()}};
$("delete").onclick=()=>{if(active&&confirm("Delete this note?")){notes=notes.filter(n=>n.id!==active);active=notes[0]?.id||null;save();load()}};
if(!notes.length)make();else{active=notes[0].id;render();load()}
</script><script src="davidcraft.js"></script></body></html>
