<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#101820">
<title>Drive Rush V2</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#101820;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  display:flex;
  justify-content:center;
}

#game{
  position:relative;
  width:100%;
  height:100vh;
  overflow:hidden;
  background:#55a63d;
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  touch-action:none;
}

/* HUD */

#hud{
  position:absolute;
  z-index:5;
  top:12px;
  left:10px;
  right:10px;

  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:7px;

  pointer-events:none;
}

.hudBox{
  color:white;
  background:rgba(0,0,0,.48);
  padding:8px 10px;
  border-radius:10px;
  font-weight:bold;
  font-size:14px;
  text-shadow:0 2px 3px #000;
}

/* SPEEDOMETER */

#speedometer{
  position:absolute;
  z-index:6;

  left:50%;
  bottom:115px;

  transform:translateX(-50%);

  width:105px;
  height:105px;

  border-radius:50%;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  color:white;

  background:rgba(0,0,0,.55);
  border:4px solid rgba(255,255,255,.7);

  box-shadow:0 4px 15px rgba(0,0,0,.4);

  pointer-events:none;
}

#speedValue{
  font-size:30px;
  font-weight:900;
}

.speedLabel{
  font-size:11px;
  opacity:.8;
}

/* NITRO */

#nitroBox{
  position:absolute;
  z-index:7;

  left:50%;
  bottom:225px;

  transform:translateX(-50%);

  width:130px;

  color:white;
  text-align:center;

  pointer-events:none;
}

#nitroText{
  font-size:12px;
  font-weight:bold;
  margin-bottom:5px;
  text-shadow:0 2px 3px #000;
}

#nitroBar{
  width:100%;
  height:10px;

  background:rgba(0,0,0,.55);

  border-radius:20px;
  overflow:hidden;
}

#nitroFill{
  width:100%;
  height:100%;
  background:#26c6da;
  border-radius:20px;
}

/* SCREENS */

.screen{
  position:absolute;
  inset:0;
  z-index:20;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  text-align:center;

  padding:25px;

  color:white;
  background:rgba(0,0,0,.68);
}

.screen h1{
  margin:4px;
  font-size:clamp(42px,11vw,70px);
  text-shadow:0 4px 8px #000;
}

.screen p{
  font-size:18px;
  line-height:1.5;
  text-shadow:0 2px 4px #000;
}

.screen button{
  margin-top:18px;
  padding:16px 30px;

  border:0;
  border-radius:15px;

  background:#18a866;
  color:white;

  font-size:21px;
  font-weight:bold;

  box-shadow:0 5px 0 #087542;
}

.screen button:active{
  transform:translateY(4px);
  box-shadow:0 1px 0 #087542;
}

.hidden{
  display:none!important;
}

/* CONTROLS */

#controls{
  position:absolute;
  z-index:10;

  left:0;
  right:0;
  bottom:20px;

  display:flex;
  justify-content:space-between;

  padding:0 25px;

  pointer-events:none;
}

.controlButton{
  width:78px;
  height:78px;

  border-radius:50%;

  border:2px solid rgba(255,255,255,.5);

  background:rgba(0,0,0,.45);
  color:white;

  font-size:28px;
  font-weight:bold;

  pointer-events:auto;
  touch-action:manipulation;
}

.controlButton:active{
  transform:scale(.94);
  background:rgba(255,255,255,.3);
}

#nitroButton{
  position:absolute;
  left:50%;
  bottom:20px;

  transform:translateX(-50%);

  width:78px;
  height:78px;

  border-radius:50%;
  border:2px solid rgba(255,255,255,.6);

  background:rgba(20,130,220,.65);
  color:white;

  font-size:25px;
  font-weight:900;

  pointer-events:auto;
  touch-action:manipulation;
}

#nitroButton:active{
  transform:translateX(-50%) scale(.94);
}

.help{
  font-size:13px!important;
  opacity:.8;
}

@media(min-width:800px){
  #game{
    max-width:700px;
  }

  #controls{
    padding:0 35px;
  }
}
</style>
</head>

<body>

<div id="game">

<canvas id="canvas"></canvas>

<!-- HUD -->

<div id="hud">

  <div class="hudBox">
    🏆 <span id="score">0</span>
  </div>

  <div class="hudBox">
    ⭐ <span id="best">0</span>
  </div>

  <div class="hudBox">
    🪙 <span id="coins">0</span>
  </div>

  <div class="hudBox">
    ❤️ <span id="lives">3</span>
  </div>

</div>

<!-- SPEED -->

<div id="speedometer">
  <div id="speedValue">0</div>
  <div class="speedLabel">MPH</div>
</div>

<!-- NITRO -->

<div id="nitroBox">

  <div id="nitroText">
    🚀 NITRO
  </div>

  <div id="nitroBar">
    <div id="nitroFill"></div>
  </div>

</div>

<!-- START -->

<div id="startScreen" class="screen">

  <h1>🚗</h1>

  <h1>Drive Rush</h1>

  <p>
    Dodge traffic.<br>
    Collect coins.<br>
    Use nitro!
  </p>

  <button id="startButton">
    START GAME
  </button>

  <p class="help">
    ← → or A/D to steer<br>
    Space = Nitro
  </p>

</div>

<!-- GAME OVER -->

<div id="gameOverScreen" class="screen hidden">

  <h1>💥</h1>

  <h1>Game Over</h1>

  <p>
    Score:
    <strong id="finalScore">0</strong>
  </p>

  <p>
    Coins:
    <strong id="finalCoins">0</strong>
  </p>

  <p>
    Best:
    <strong id="finalBest">0</strong>
  </p>

  <button id="restartButton">
    PLAY AGAIN
  </button>

</div>

<!-- CONTROLS -->

<div id="controls">

  <button
    id="leftButton"
    class="controlButton">
    ◀
  </button>

  <button
    id="nitroButton">
    🚀
  </button>

  <button
    id="rightButton"
    class="controlButton">
    ▶
  </button>

</div>

</div>

<script>
"use strict";

/* =====================================================
   ELEMENTS
===================================================== */

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext("2d");

const scoreElement =
  document.getElementById("score");

const bestElement =
  document.getElementById("best");

const coinsElement =
  document.getElementById("coins");

const livesElement =
  document.getElementById("lives");

const speedElement =
  document.getElementById("speedValue");

const nitroFill =
  document.getElementById("nitroFill");

const startScreen =
  document.getElementById("startScreen");

const gameOverScreen =
  document.getElementById("gameOverScreen");

const finalScore =
  document.getElementById("finalScore");

const finalCoins =
  document.getElementById("finalCoins");

const finalBest =
  document.getElementById("finalBest");

const startButton =
  document.getElementById("startButton");

const restartButton =
  document.getElementById("restartButton");

const leftButton =
  document.getElementById("leftButton");

const rightButton =
  document.getElementById("rightButton");

const nitroButton =
  document.getElementById("nitroButton");


/* =====================================================
   GAME STATE
===================================================== */

let width = 0;
let height = 0;

let roadWidth = 0;
let laneWidth = 0;

let running = false;

let score = 0;
let coins = 0;
let lives = 3;

let best =
  Number(
    localStorage.getItem("driveRushBest") || 0
  );

let traffic = [];
let coinsOnRoad = [];
let particles = [];

let spawnTimer = 0;
let coinTimer = 0;

let roadOffset = 0;

let lastTime = 0;

let difficulty = 1;

let nitro = 100;
let nitroActive = false;

let crashFlash = 0;


/* =====================================================
   PLAYER
===================================================== */

const player = {

  lane:1,

  x:0,

  y:0,

  width:52,

  height:92,

  speed:350,

  baseSpeed:350,

  maxSpeed:650

};


/* =====================================================
   COLORS
===================================================== */

const trafficColors = [
  "#e53935",
  "#1e88e5",
  "#fdd835",
  "#8e24aa",
  "#fb8c00",
  "#00acc1"
];


/* =====================================================
   RESIZE
===================================================== */

function resize(){

  width =
    window.innerWidth;

  height =
    window.innerHeight;

  canvas.width =
    width;

  canvas.height =
    height;

  roadWidth =
    Math.min(
      width * .78,
      440
    );

  laneWidth =
    roadWidth / 3;

  player.y =
    height - 155;

  player.x =
    getLaneX(player.lane);
}


/* =====================================================
   ROAD HELPERS
===================================================== */

function roadLeft(){

  return (
    width / 2 -
    roadWidth / 2
  );

}


function getLaneX(lane){

  return (
    roadLeft() +
    laneWidth * lane +
    laneWidth / 2
  );

}


/* =====================================================
   RESET
===================================================== */

function resetGame(){

  score = 0;

  coins = 0;

  lives = 3;

  difficulty = 1;

  traffic = [];

  coinsOnRoad = [];

  particles = [];

  spawnTimer = 0;

  coinTimer = 0;

  roadOffset = 0;

  crashFlash = 0;

  nitro = 100;

  nitroActive = false;

  player.lane = 1;

  player.speed =
    player.baseSpeed;

  player.x =
    getLaneX(1);

  updateHUD();

}


/* =====================================================
   START
===================================================== */

function startGame(){

  resetGame();

  running = true;

  startScreen
    .classList
    .add("hidden");

  gameOverScreen
    .classList
    .add("hidden");

  lastTime =
    performance.now();

  requestAnimationFrame(loop);

}


/* =====================================================
   GAME OVER
===================================================== */

function gameOver(){

  running = false;

  nitroActive = false;

  const final =
    Math.floor(score);

  if(final > best){

    best = final;

    localStorage.setItem(
      "driveRushBest",
      best
    );

  }

  finalScore.textContent =
    final;

  finalCoins.textContent =
    coins;

  finalBest.textContent =
    best;

  updateHUD();

  gameOverScreen
    .classList
    .remove("hidden");

}


/* =====================================================
   HUD
===================================================== */

function updateHUD(){

  scoreElement.textContent =
    Math.floor(score);

  bestElement.textContent =
    best;

  coinsElement.textContent =
    coins;

  livesElement.textContent =
    lives;

  speedElement.textContent =
    Math.floor(
      player.speed / 8
    );

  nitroFill.style.width =
    nitro + "%";

}


/* =====================================================
   MOVEMENT
===================================================== */

function moveLeft(){

  if(!running) return;

  if(player.lane > 0){

    player.lane--;

    player.x =
      getLaneX(
        player.lane
      );

  }

}


function moveRight(){

  if(!running) return;

  if(player.lane < 2){

    player.lane++;

    player.x =
      getLaneX(
        player.lane
      );

  }

}


/* =====================================================
   NITRO
===================================================== */

function startNitro(){

  if(!running) return;

  if(nitro <= 0) return;

  nitroActive = true;

}


function stopNitro(){

  nitroActive = false;

}


/* =====================================================
   SPAWN TRAFFIC
===================================================== */

function spawnTraffic(){

  let lane =
    Math.floor(
      Math.random() * 3
    );

  let attempts = 0;

  while(
    traffic.some(
      car =>
        car.lane === lane &&
        car.y < 170
    ) &&
    attempts < 6
  ){

    lane =
      Math.floor(
        Math.random() * 3
      );

    attempts++;

  }

  const color =
    trafficColors[
      Math.floor(
        Math.random() *
        trafficColors.length
      )
    ];

  traffic.push({

    lane:lane,

    x:getLaneX(lane),

    y:-120,

    width:50,

    height:88,

    speed:
      230 +
      Math.random() * 120 +
      difficulty * 30,

    color:color

  });

}


/* =====================================================
   SPAWN COIN
===================================================== */

function spawnCoin(){

  const lane =
    Math.floor(
      Math.random() * 3
    );

  coinsOnRoad.push({

    lane:lane,

    x:getLaneX(lane),

    y:-35,

    radius:12,

    speed:300

  });

}


/* =====================================================
   COLLISION
===================================================== */

function collision(a,b){

  return (

    Math.abs(
      a.x - b.x
    ) <
    (a.width + b.width) * .42

    &&

    Math.abs(
      a.y - b.y
    ) <
    (a.height + b.height) * .42

  );

}


/* =====================================================
   CRASH
===================================================== */

function crash(car){

  lives--;

  crashFlash =
    .25;

  createExplosion(
    player.x,
    player.y
  );

  traffic =
    traffic.filter(
      c => c !== car
    );

  player.speed =
    150;

  nitroActive =
    false;

  updateHUD();

  if(lives <= 0){

    gameOver();

  }

}


/* =====================================================
   EXPLOSION
===================================================== */

function createExplosion(
  x,
  y
){

  for(
    let i=0;
    i<25;
    i++
  ){

    particles.push({

      x:x,

      y:y,

      vx:
        (Math.random()-.5) *
        450,

      vy:
        (Math.random()-.5) *
        450,

      life:
        .4 +
        Math.random() *
        .7

    });

  }

}


/* =====================================================
   UPDATE
===================================================== */

function update(delta){

  difficulty =
    1 +
    Math.min(
      5,
      score / 250
    );


  /* NITRO */

  if(
    nitroActive &&
    nitro > 0
  ){

    nitro -=
      32 * delta;

    player.speed +=
      900 * delta;

    player.speed =
      Math.min(
        player.speed,
        player.maxSpeed
      );

  }else{

    nitroActive = false;

    if(nitro < 100){

      nitro +=
        7 * delta;

    }

    player.speed +=
      (
        player.baseSpeed -
        player.speed
      ) *
      2 *
      delta;

  }


  /* SCORE */

  score +=
    delta *
    12 *
    difficulty;


  /* ROAD */

  roadOffset +=
    player.speed *
    delta;


  if(
    roadOffset > 80
  ){

    roadOffset -=80;

  }


  /* TRAFFIC SPAWN */

  spawnTimer -=
    delta;


  const spawnSpeed =
    Math.max(
      .35,
      .9 -
      difficulty * .07
    );


  if(
    spawnTimer <= 0
  ){

    spawnTraffic();

    spawnTimer =
      spawnSpeed +
      Math.random() * .3;

  }


  /* COIN SPAWN */

  coinTimer -=
    delta;


  if(
    coinTimer <= 0
  ){

    spawnCoin();

    coinTimer =
      .7 +
      Math.random() * .8;

  }


  /* TRAFFIC MOVEMENT */

  for(
    const car of traffic
  ){

    car.y +=
      car.speed *
      delta;

  }


  traffic =
    traffic.filter(
      car =>
        car.y <
        height + 150
    );


  /* COINS MOVEMENT */

  for(
    const coin of coinsOnRoad
  ){

    coin.y +=
      (
        coin.speed +
        player.speed * .25
      ) *
      delta;

  }


  coinsOnRoad =
    coinsOnRoad.filter(
      coin =>
        coin.y <
        height + 50
    );


  /* TRAFFIC COLLISIONS */

  for(
    const car of traffic
  ){

    if(
      collision(
        player,
        car
      )
    ){

      crash(car);

      break;

    }

  }


  /* COIN COLLECTION */

  for(
    let i =
      coinsOnRoad.length - 1;
    i >= 0;
    i--
  ){

    const coin =
      coinsOnRoad[i];

    const dx =
      Math.abs(
        player.x -
        coin.x
      );

    const dy =
      Math.abs(
        player.y -
        coin.y
      );

    if(
      dx < 35 &&
      dy < 60
    ){

      coins++;

      score += 25;

      nitro =
        Math.min(
          100,
          nitro + 5
        );

      createCoinParticles(
        coin.x,
        coin.y
      );

      coinsOnRoad.splice(
        i,
        1
      );

    }

  }


  /* PARTICLES */

  for(
    let i =
      particles.length - 1;
    i >= 0;
    i--
  ){

    const p =
      particles[i];

    p.x +=
      p.vx * delta;

    p.y +=
      p.vy * delta;

    p.vy +=
      500 * delta;

    p.life -=
      delta;

    if(
      p.life <= 0
    ){

      particles.splice(
        i,
        1
      );

    }

  }


  crashFlash =
    Math.max(
      0,
      crashFlash -
      delta
    );


  updateHUD();

}


/* =====================================================
   COIN PARTICLES
===================================================== */

function createCoinParticles(
  x,
  y
){

  for(
    let i=0;
    i<8;
    i++
  ){

    particles.push({

      x:x,

      y:y,

      vx:
        (Math.random()-.5) *
        180,

      vy:
        (Math.random()-.5) *
        180,

      life:.45

    });

  }

}


/* =====================================================
   DRAW ROAD
===================================================== */

function drawRoad(){

  /* GRASS */

  ctx.fillStyle =
    "#58a943";

  ctx.fillRect(
    0,
    0,
    width,
    height
  );


  /* ROAD */

  ctx.fillStyle =
    "#3f3f3f";

  ctx.fillRect(
    roadLeft(),
    0,
    roadWidth,
    height
  );


  /* EDGES */

  ctx.fillStyle =
    "#eeeeee";

  ctx.fillRect(
    roadLeft(),
    0,
    6,
    height
  );

  ctx.fillRect(
    roadLeft() +
    roadWidth -
    6,
    0,
    6,
    height
  );


  /* LANE LINES */

  ctx.strokeStyle =
    "#ffffff";

  ctx.lineWidth = 5;

  ctx.setLineDash([
    35,
    35
  ]);

  ctx.lineDashOffset =
    roadOffset;


  for(
    let lane=1;
    lane<3;
    lane++
  ){

    const x =
      roadLeft() +
      laneWidth *
      lane;

    ctx.beginPath();

    ctx.moveTo(
      x,
      0
    );

    ctx.lineTo(
      x,
      height
    );

    ctx.stroke();

  }


  ctx.setLineDash([]);


  /* ROAD MARKERS */

  for(
    let y=-30;
    y<height+60;
    y+=65
  ){

    const yy =
      (
        y +
        roadOffset * .7
      )
      %
      (height+65);

    ctx.fillStyle =
      "#f6d34a";

    ctx.fillRect(
      roadLeft()-12,
      yy,
      7,
      23
    );

    ctx.fillRect(
      roadLeft()+
      roadWidth+
      5,
      yy,
      7,
      23
    );

  }

}


/* =====================================================
   DRAW CAR
===================================================== */

function roundedRect(
  x,
  y,
  w,
  h,
  r
){

  ctx.beginPath();

  ctx.roundRect(
    x,
    y,
    w,
    h,
    r
  );

}


function drawCar(
  car,
  color,
  isPlayer
){

  const x =
    car.x;

  const y =
    car.y;

  const w =
    car.width;

  const h =
    car.height;


  ctx.save();

  ctx.translate(
    x,
    y
  );


  /* SHADOW */

  ctx.fillStyle =
    "rgba(0,0,0,.3)";

  ctx.beginPath();

  ctx.ellipse(
    0,
    h*.48,
    w*.58,
    h*.12,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* WHEELS */

  ctx.fillStyle =
    "#111";

  ctx.fillRect(
    -w*.58,
    -h*.32,
    10,
    27
  );

  ctx.fillRect(
    w*.39,
    -h*.32,
    10,
    27
  );

  ctx.fillRect(
    -w*.58,
    h*.17,
    10,
    27
  );

  ctx.fillRect(
    w*.39,
    h*.17,
    10,
    27
  );


  /* BODY */

  ctx.fillStyle =
    color;

  roundedRect(
    -w/2,
    -h/2,
    w,
    h,
    10
  );

  ctx.fill();


  /* WINDOWS */

  ctx.fillStyle =
    "#a9dfea";

  roundedRect(
    -w*.32,
    -h*.32,
    w*.64,
    h*.27,
    6
  );

  ctx.fill();


  ctx.fillStyle =
    "#79bac8";

  roundedRect(
    -w*.28,
    0,
    w*.56,
    h*.22,
    5
  );

  ctx.fill();


  /* LIGHTS */

  ctx.fillStyle =
    isPlayer
      ? "#fff3a1"
      : "#ff4444";

  ctx.fillRect(
    -w*.35,
    -h*.46,
    10,
    6
  );

  ctx.fillRect(
    w*.16,
    -h*.46,
    10,
    6
  );


  /* PLAYER STRIPE */

  if(isPlayer){

    ctx.fillStyle =
      "rgba(255,255,255,.35)";

    ctx.fillRect(
      -5,
      -h/2,
      10,
      h
    );

  }


  /* NITRO FLAMES */

  if(
    isPlayer &&
    nitroActive
  ){

    ctx.fillStyle =
      "#26c6da";

    ctx.beginPath();

    ctx.moveTo(
      -15,
      h/2
    );

    ctx.lineTo(
      -5,
      h/2+35+
      Math.random()*15
    );

    ctx.lineTo(
      0,
      h/2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.moveTo(
      5,
      h/2
    );

    ctx.lineTo(
      15,
      h/2+35+
      Math.random()*15
    );

    ctx.lineTo(
      20,
      h/2
    );

    ctx.fill();

  }


  ctx.restore();

}


/* =====================================================
   DRAW COIN
===================================================== */

function drawCoin(
  coin
){

  ctx.save();

  ctx.translate(
    coin.x,
    coin.y
  );


  const spin =
    Math.abs(
      Math.cos(
        performance.now() /
        180
      )
    );


  ctx.scale(
    .35 +
    spin*.65,
    1
  );


  ctx.fillStyle =
    "#ffd700";

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    coin.radius,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.strokeStyle =
    "#fff2a0";

  ctx.lineWidth = 3;

  ctx.stroke();


  ctx.fillStyle =
    "#a87900";

  ctx.font =
    "bold 14px Arial";

  ctx.textAlign =
    "center";

  ctx.textBaseline =
    "middle";

  ctx.fillText(
    "$",
    0,
    1
  );


  ctx.restore();

}


/* =====================================================
   PARTICLES
===================================================== */

function drawParticles(){

  for(
    const p of particles
  ){

    ctx.globalAlpha =
      Math.max(
        0,
        p.life
      );

    ctx.fillStyle =
      "#ffd54f";

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      4,
      0,
      Math.PI*2
    );

    ctx.fill();

  }

  ctx.globalAlpha = 1;

}


/* =====================================================
   DRAW
===================================================== */

function draw(){

  drawRoad();


  for(
    const car of traffic
  ){

    drawCar(
      car,
      car.color,
      false
    );

  }


  for(
    const coin of coinsOnRoad
  ){

    drawCoin(
      coin
    );

  }


  drawCar(
    player,
    "#16a085",
    true
  );


  drawParticles();


  if(
    crashFlash > 0
  ){

    ctx.fillStyle =
      `rgba(255,255,255,${
        crashFlash * 2
      })`;

    ctx.fillRect(
      0,
      0,
      width,
      height
    );

  }

}


/* =====================================================
   GAME LOOP
===================================================== */

function loop(time){

  if(!running){

    draw();

    return;

  }


  const delta =
    Math.min(
      .033,
      (time-lastTime)/1000
    );


  lastTime =
    time;


  update(delta);

  draw();


  requestAnimationFrame(
    loop
  );

}


/* =====================================================
   KEYBOARD
===================================================== */

window.addEventListener(
  "keydown",
  event => {

    const key =
      event.key.toLowerCase();


    if(
      event.key === "ArrowLeft" ||
      key === "a"
    ){

      event.preventDefault();

      if(!event.repeat){

        moveLeft();

      }

    }


    if(
      event.key === "ArrowRight" ||
      key === "d"
    ){

      event.preventDefault();

      if(!event.repeat){

        moveRight();

      }

    }


    if(
      event.code === "Space"
    ){

      event.preventDefault();

      startNitro();

    }

  }
);


window.addEventListener(
  "keyup",
  event => {

    if(
      event.code === "Space"
    ){

      stopNitro();

    }

  }
);


/* =====================================================
   TOUCH
===================================================== */

leftButton.addEventListener(
  "pointerdown",
  event => {

    event.preventDefault();

    moveLeft();

  }
);


rightButton.addEventListener(
  "pointerdown",
  event => {

    event.preventDefault();

    moveRight();

  }
);


nitroButton.addEventListener(
  "pointerdown",
  event => {

    event.preventDefault();

    startNitro();

  }
);


nitroButton.addEventListener(
  "pointerup",
  stopNitro
);

nitroButton.addEventListener(
  "pointercancel",
  stopNitro
);

nitroButton.addEventListener(
  "pointerleave",
  stopNitro
);


/* =====================================================
   GAME BUTTONS
===================================================== */

startButton.addEventListener(
  "click",
  startGame
);


restartButton.addEventListener(
  "click",
  startGame
);


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
  "resize",
  resize
);


/* =====================================================
   INITIALIZE
===================================================== */

resize();

updateHUD();

draw();

</script>
