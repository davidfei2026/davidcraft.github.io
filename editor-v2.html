<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>NOVA Code</title>

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.8/codemirror.min.css">

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.8/theme/material-darker.min.css">

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.8/addon/fold/foldgutter.min.css">

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #0d1117;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

button,
input,
textarea {
  font: inherit;
}

button {
  -webkit-appearance: none;
  appearance: none;
  touch-action: manipulation;
}

.app {
  height: 100dvh;
  display: grid;
  grid-template-rows: 52px 1fr 28px;
}

/* TOP */

.topbar {
  display: flex;
  align-items: center;
  gap: 7px;
  padding:
    6px
    max(8px, env(safe-area-inset-right))
    6px
    max(8px, env(safe-area-inset-left));

  background: #11161d;
  border-bottom: 1px solid #2a3039;
  overflow-x: auto;
  white-space: nowrap;
}

.logo {
  font-size: 17px;
  font-weight: 800;
  padding: 0 8px;
}

.logo span {
  color: #4f9cff;
}

.tool {
  min-height: 38px;
  padding: 0 11px;
  border-radius: 7px;
  border: 1px solid #303744;
  background: #1a2029;
  color: #e9edf4;
  font-weight: 600;
}

.tool:active {
  transform: scale(.97);
}

.tool.primary {
  background: #2563eb;
  border-color: #2563eb;
}

/* MAIN */

.main {
  min-height: 0;
  display: grid;
  grid-template-columns: 210px minmax(0,1fr) 330px;
}

/* EXPLORER */

.explorer {
  min-width: 0;
  min-height: 0;
  overflow-y: auto;
  background: #0f141a;
  border-right: 1px solid #2a3039;
}

.panel-title {
  padding: 13px 13px 9px;
  color: #8c97a8;
  font-size: 11px;
  letter-spacing: .08em;
  font-weight: 800;
}

.explorer-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  padding: 0 8px 10px;
}

.small-btn {
  min-height: 34px;
  border-radius: 6px;
  border: 1px solid #303744;
  background: #181e26;
  color: #dbe2ec;
}

.file {
  width: calc(100% - 10px);
  margin: 2px 5px;
  min-height: 38px;
  padding: 0 9px;
  text-align: left;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: #b8c1ce;
}

.file.active {
  background: #202733;
  color: #fff;
}

/* CENTER */

.center {
  min-width: 0;
  min-height: 0;
  display: grid;
  grid-template-rows: 38px minmax(0,1fr) 185px;
}

/* TABS */

.tabs {
  display: flex;
  align-items: stretch;
  overflow-x: auto;
  background: #141922;
  border-bottom: 1px solid #2a3039;
}

.tab {
  display: flex;
  align-items: center;
  gap: 7px;
  flex: 0 0 auto;
  padding: 0 11px;
  min-width: 120px;
  border-right: 1px solid #2a3039;
  color: #9ba6b7;
  background: #151a22;
}

.tab.active {
  color: #fff;
  background: #0d1117;
}

.tab-close {
  margin-left: auto;
  color: #788292;
}

/* EDITOR */

.editor {
  min-height: 0;
  overflow: hidden;
}

.CodeMirror {
  height: 100%;
  font-size: 14px;
  font-family:
    ui-monospace,
    SFMono-Regular,
    Menlo,
    Monaco,
    Consolas,
    monospace;
}

.CodeMirror-scroll {
  -webkit-overflow-scrolling: touch;
}

.CodeMirror-foldgutter {
  width: 14px;
}

/* BOTTOM */

.bottom {
  min-height: 0;
  display: grid;
  grid-template-rows: 36px 1fr;
  border-top: 1px solid #2a3039;
  background: #0f141a;
}

.bottom-tabs {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 0 10px;
  border-bottom: 1px solid #2a3039;
}

.bottom-tab {
  height: 28px;
  padding: 0 10px;
  border: 0;
  border-radius: 5px;
  background: transparent;
  color: #8994a5;
}

.bottom-tab.active {
  background: #202733;
  color: #fff;
}

.bottom-content {
  min-height: 0;
  overflow: auto;
  padding: 10px;
  font: 12px/1.5 ui-monospace, monospace;
  white-space: pre-wrap;
}

.console-line {
  padding: 2px 0;
}

.console-line.error {
  color: #ff7777;
}

/* AI */

.ai {
  min-width: 0;
  min-height: 0;
  display: grid;
  grid-template-rows: 44px minmax(0,1fr) auto;
  background: #10151c;
  border-left: 1px solid #2a3039;
}

.ai-header {
  display: flex;
  align-items: center;
  padding: 0 13px;
  border-bottom: 1px solid #2a3039;
  font-weight: 800;
}

.messages {
  min-height: 0;
  overflow-y: auto;
  padding: 10px;
}

.msg {
  margin-bottom: 9px;
  padding: 9px 10px;
  border-radius: 8px;
  font-size: 13px;
  line-height: 1.45;
  white-space: pre-wrap;
}

.msg.ai {
  background: #1b222c;
}

.msg.user {
  background: #2455bd;
}

.ai-box {
  padding: 9px;
  border-top: 1px solid #2a3039;
}

#aiPrompt {
  width: 100%;
  min-height: 76px;
  resize: none;
  padding: 9px;
  border: 1px solid #353d49;
  border-radius: 7px;
  background: #0b0f14;
  color: white;
  outline: none;
}

.ai-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  margin-top: 7px;
}

.ai-buttons button {
  min-height: 40px;
  border: 0;
  border-radius: 7px;
  background: #2563eb;
  color: white;
  font-weight: 700;
}

.ai-buttons .secondary {
  background: #29313d;
}

/* SEARCH */

.search-overlay {
  position: fixed;
  inset: 0;
  z-index: 5000;
  display: none;
  align-items: flex-start;
  justify-content: center;
  padding: 70px 15px 15px;
  background: rgba(0,0,0,.6);
}

.search-box {
  width: min(620px, 100%);
  background: #171d25;
  border: 1px solid #353d49;
  border-radius: 10px;
  overflow: hidden;
}

.search-box input {
  width: 100%;
  height: 50px;
  padding: 0 14px;
  border: 0;
  outline: none;
  background: #0c1016;
  color: white;
}

.search-results {
  max-height: 55vh;
  overflow: auto;
}

.search-result {
  width: 100%;
  display: block;
  padding: 11px 14px;
  text-align: left;
  border: 0;
  border-bottom: 1px solid #2c333e;
  background: transparent;
  color: #dce3ed;
}

.search-result small {
  display: block;
  margin-top: 3px;
  color: #7f8a9b;
}

/* STATUS */

.statusbar {
  display: flex;
  align-items: center;
  padding: 0 10px;
  background: #151b23;
  color: #8c96a5;
  font-size: 11px;
}

/* MOBILE */

@media (max-width: 1100px) {
  .main {
    grid-template-columns: 185px minmax(0,1fr);
  }

  .ai {
    display: none;
  }
}

@media (max-width: 700px) {
  .main {
    grid-template-columns: 1fr;
  }

  .explorer {
    display: none;
  }

  .center {
    grid-template-rows: 38px minmax(0,1fr) 170px;
  }

  .logo {
    padding-left: 3px;
  }
}
</style>
</head>

<body>

<div class="app">

  <header class="topbar">

    <div class="logo">
      NOVA <span>Code</span>
    </div>

    <button class="tool" id="explorerBtn">Explorer</button>
    <button class="tool" id="searchBtn">Search</button>
    <button class="tool" id="commandBtn">⌘ Commands</button>
    <button class="tool" id="saveBtn">Save</button>
    <button class="tool" id="downloadBtn">Download</button>
    <button class="tool primary" id="runBtn">▶ Run</button>

  </header>


  <main class="main">

    <!-- EXPLORER -->

    <aside class="explorer" id="explorer">

      <div class="panel-title">
        EXPLORER
      </div>

      <div class="explorer-actions">

        <button class="small-btn" id="newFileBtn">
          + File
        </button>

        <button class="small-btn" id="clearBtn">
          Clear
        </button>

      </div>

      <div id="fileList"></div>

    </aside>


    <!-- CENTER -->

    <section class="center">

      <div class="tabs" id="tabs"></div>

      <div class="editor" id="editorHost"></div>


      <section class="bottom">

        <div class="bottom-tabs">

          <button class="bottom-tab active" data-panel="preview">
            Preview
          </button>

          <button class="bottom-tab" data-panel="console">
            Console
          </button>

          <button class="bottom-tab" data-panel="problems">
            Problems
          </button>

        </div>

        <div class="bottom-content" id="bottomContent">

          <iframe
            id="preview"
            style="
              width:100%;
              height:100%;
              border:0;
              background:white;
              display:block;
            ">
          </iframe>

        </div>

      </section>

    </section>


    <!-- AI -->

    <aside class="ai">

      <div class="ai-header">
        🤖 NOVA AI
      </div>

      <div class="messages" id="messages">

        <div class="msg ai">
          I'm ready.

          Ask me to create features,
          fix code, explain code,
          or modify your project.
        </div>

      </div>

      <div class="ai-box">

        <textarea
          id="aiPrompt"
          placeholder="Ask NOVA AI to change your project..."></textarea>

        <div class="ai-buttons">

          <button id="askBtn">
            Ask AI
          </button>

          <button class="secondary" id="fixBtn">
            Fix Code
          </button>

        </div>

      </div>

    </aside>

  </main>


  <footer class="statusbar" id="status">
    Ready
  </footer>

</div>


<!-- SEARCH -->

<div class="search-overlay" id="searchOverlay">

  <div class="search-box">

    <input
      id="searchInput"
      placeholder="Search project...">

    <div
      class="search-results"
      id="searchResults"></div>

  </div>

</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.8/codemirror.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.8/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.8/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.8/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.8/mode/htmlmixed/htmlmixed.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.8/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.8/addon/edit/matchbrackets.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.8/addon/fold/foldcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.8/addon/fold/foldgutter.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.8/addon/fold/brace-fold.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.8/addon/fold/xml-fold.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.8/addon/fold/comment-fold.min.js"></script>

<script src="editor.js"></script>

</body>
</html>
