<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>General Chat — DavidCraft AI</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="chat.css">
</head>

<body>
  <header class="topbar">
    <a class="logo" href="index.html">
      DavidCraft <span>AI</span>
    </a>

    <div class="topbar-actions">
      <a class="back-link" href="index.html">
        ← All assistants
      </a>

      <button
        id="theme-button"
        aria-label="Change color theme"
      >
        ◐
      </button>
    </div>
  </header>

  <main class="chat-page">
    <section class="chat-shell">
      <div class="chat-header">
        <div class="chat-avatar general-avatar">●</div>

        <div>
          <h1>General Chat</h1>

          <p>
            Ask questions, brainstorm ideas, or have a conversation.
          </p>
        </div>
      </div>

      <div class="suggestions">
        <button type="button">
          Tell me an interesting science fact
        </button>

        <button type="button">
          Help me plan my day
        </button>

        <button type="button">
          Give me a creative project idea
        </button>

        <button type="button">
          Explain how the internet works
        </button>
      </div>

      <div
        id="messages"
        class="messages"
        aria-live="polite"
      >
        <div class="message assistant">
          <div class="message-name">
            General Assistant
          </div>

          <p>
            Hi! You can ask me about almost anything.
          </p>
        </div>
      </div>

      <form id="chat-form" class="chat-form">
        <label
          class="sr-only"
          for="message-input"
        >
          Type your message
        </label>

        <textarea
          id="message-input"
          rows="1"
          placeholder="Ask anything..."
          required
        ></textarea>

        <button type="submit">
          Send
        </button>
      </form>
    </section>
  </main>

  <script src="script.js"></script>
  <script src="general.js"></script>
</body>
</html>
