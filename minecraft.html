<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Minecraft Clone</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
            background-color: #78a7ff;
            font-family: sans-serif;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.7);
        }
        #crosshair::before { top: 4px; left: 0; width: 10px; height: 2px; }
        #crosshair::after { top: 0; left: 4px; width: 2px; height: 10px; }
        #instructions {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 15px;
            border-radius: 5px;
            pointer-events: none;
            font-size: 14px;
            line-height: 1.5;
            z-index: 10;
        }
    </style>
    <!-- Load Three.js and PointerLockControls from CDN -->
    <script src="https://cloudflare.com"></script>
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <div id="crosshair"></div>
    <div id="instructions">
        <strong>Three.js Minecraft Controls:</strong><br>
        • Click anywhere to lock mouse and play<br>
        • Move Mouse to look around<br>
        • W, A, S, D to move horizontally<br>
        • Space to fly up / Shift to fly down<br>
        • Left Click to break blocks<br>
        • Right Click to place blocks
    </div>

    <script>
        // 1. Setup Scene, Camera, and Renderer
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x78a7ff); // Sky color
        scene.fog = new THREE.FogExp2(0x78a7ff, 0.03);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // 2. Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
        directionalLight.position.set(20, 40, 20);
        scene.add(directionalLight);

        // 3. Controls (Pointer Lock for first-person view)
        const controls = new THREE.PointerLockControls(camera, document.body);
        
        document.body.addEventListener('click', () => {
            controls.lock();
        });

        controls.addEventListener('lock', () => {
            document.getElementById('instructions').style.display = 'none';
        });

        controls.addEventListener('unlock', () => {
            document.getElementById('instructions').style.display = 'block';
        });

        // 4. Block Materials and Geometry
        const cubeGeo = new THREE.BoxGeometry(1, 1, 1);
        
        // Colors representing basic block types
        const materials = {
            grass: new THREE.MeshLambertMaterial({ color: 0x557a2b }),
            dirt: new THREE.MeshLambertMaterial({ color: 0x866043 }),
            stone: new THREE.MeshLambertMaterial({ color: 0x808080 })
        };

        // Raycaster for block interactions (breaking/building)
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2(0, 0); // Center of the screen

        // 5. Generate World (16x16 chunk)
        const worldSize = 16;
        const blocksArray = [];

        function createBlock(x, y, z, type) {
            const mesh = new THREE.Mesh(cubeGeo, materials[type]);
            mesh.position.set(x, y, z);
            scene.add(mesh);
            blocksArray.push(mesh);
        }

        // Generate flat terrain with a few layers
        for (let x = -worldSize/2; x < worldSize/2; x++) {
            for (let z = -worldSize/2; z < worldSize/2; z++) {
                createBlock(x, 0, z, 'grass');
                createBlock(x, -1, z, 'dirt');
                createBlock(x, -2, z, 'stone');
            }
        }

        // Set initial player position
        camera.position.set(0, 2, 5);

        // 6. Input Movement Tracking
        const keys = { w: false, a: false, s: false, d: false, space: false, shift: false };
        
        window.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW') keys.w = true;
            if (e.code === 'KeyA') keys.a = true;
            if (e.code === 'KeyS') keys.s = true;
            if (e.code === 'KeyD') keys.d = true;
            if (e.code === 'Space') keys.space = true;
            if (e.code === 'ShiftLeft') keys.shift = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW') keys.w = false;
            if (e.code === 'KeyA') keys.a = false;
            if (e.code === 'KeyS') keys.s = false;
            if (e.code === 'KeyD') keys.d = false;
            if (e.code === 'Space') keys.space = false;
            if (e.code === 'ShiftLeft') keys.shift = false;
        });

        // 7. Mouse Interaction (Place and Break Blocks)
        window.addEventListener('mousedown', (e) => {
            if (!controls.isLocked) return;

            // Update the raycaster pointing from the center of the camera screen
            raycaster.setFromCamera(mouse, camera);
            // Limit interaction range to 6 blocks away
            raycaster.far = 6; 
            const intersects = raycaster.intersectObjects(blocksArray);

            if (intersects.length > 0) {
                const intersect = intersects[0];

                if (e.button === 0) { // Left Click: Destroy Block
                    scene.remove(intersect.object);
                    const index = blocksArray.indexOf(intersect.object);
                    if (index > -1) blocksArray.splice(index, 1);
                } 
                else if (e.button === 2) { // Right Click: Place Block
                    // Calculate the position of the new block based on the face that was hit
                    const position = new THREE.Vector3();
                    position.copy(intersect.point).add(intersect.face.normal);
                    
                    // Snap coordinates to integers grid
                    const targetX = Math.floor(position.x + 0.5);
                    const targetY = Math.floor(position.y + 0.5);
                    const targetZ = Math.floor(position.z + 0.5);

                    createBlock(targetX, targetY, targetZ, 'stone');
                }
            }
        });

        // Prevent right-click context menu popping up
        window.addEventListener('contextmenu', e => e.preventDefault());

        // 8. Game Animation Loop
        const moveSpeed = 0.1;
        
        function animate() {
            requestAnimationFrame(animate);

            if (controls.isLocked) {
                // Directional Vectors relative to camera orientation
                const direction = new THREE.Vector3();
                const frontVector = new THREE.Vector3();
                const sideVector = new THREE.Vector3();

                // Calculate forward/backward movement vector
                frontVector.set(0, 0, Number(keys.s) - Number(keys.w));
                // Calculate side-to-side strafing vector
                sideVector.set(Number(keys.d) - Number(keys.a), 0, 0);

                // Combine vectors, account for camera direction, and move
                direction.subVectors(frontVector, sideVector).normalize().multiplyScalar(moveSpeed);
                controls.moveRight(direction.x);
                controls.moveForward(direction.z);

                // Vertical flying controls
                if (keys.space) camera.position.y += moveSpeed;
                if (keys.shift) camera.position.y -= moveSpeed;
            }

            renderer.render(scene, camera);
        }

        // Handle browser window resizing dynamically
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
