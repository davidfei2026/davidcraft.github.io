<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Minecraft Voxel Engine</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
            background-color: #78a7ff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 12px;
            height: 12px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
        }
        #crosshair::before { top: 5px; left: 0; width: 12px; height: 2px; }
        #crosshair::after { top: 0; left: 5px; width: 2px; height: 12px; }
        
        #ui-container {
            position: absolute;
            top: 15px;
            left: 15px;
            color: white;
            background: rgba(16, 16, 20, 0.75);
            padding: 20px;
            border-radius: 8px;
            pointer-events: none;
            font-size: 14px;
            line-height: 1.6;
            z-index: 10;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 280px;
        }
        .highlight { color: #55ff55; font-weight: bold; }

        /* Hotbar Styles */
        #hotbar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            background: rgba(0, 0, 0, 0.6);
            padding: 4px;
            border-radius: 4px;
            border: 2px solid #3c3c3c;
            z-index: 10;
            pointer-events: auto;
        }
        .hotbar-slot {
            width: 50px;
            height: 50px;
            margin: 0 4px;
            border: 2px solid #555;
            background: rgba(50, 50, 50, 0.4);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            cursor: pointer;
            border-radius: 3px;
        }
        .hotbar-slot.active {
            border-color: #ffffff;
            background: rgba(150, 150, 150, 0.3);
            box-shadow: inset 0 0 10px rgba(255,255,255,0.5);
        }
        .block-preview {
            width: 24px;
            height: 24px;
            border-radius: 2px;
            box-shadow: 1px 1px 3px rgba(0,0,0,0.5);
        }
        .slot-num {
            position: absolute;
            top: 2px;
            left: 4px;
            font-size: 10px;
            color: #aaa;
            font-weight: bold;
        }
        .slot-label {
            font-size: 9px;
            color: #fff;
            margin-top: 3px;
            text-align: center;
            text-shadow: 1px 1px 1px #000;
        }
    </style>
    <script src="https://cloudflare.com"></script>
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <div id="crosshair"></div>
    <div id="ui-container" id="instructions">
        <span style="font-size: 16px; font-weight: bold; display: block; margin-bottom: 8px;">Voxel World Core</span>
        • <strong>Click screen</strong> to lock cursor & play<br>
        • <strong>W, A, S, D</strong> to walk / run around<br>
        • <strong>Spacebar</strong> to jump upwards<br>
        • <strong>Left-Click</strong> to break target block<br>
        • <strong>Right-Click</strong> to place selected block<br>
        • <strong>Keys 1 - 6</strong> to cycle through hotbar slots
    </div>

    <!-- Hotbar UI -->
    <div id="hotbar">
        <div class="hotbar-slot active" data-index="0" data-type="grass"><div class="slot-num">1</div><div class="block-preview" style="background:#557a2b;"></div><div class="slot-label">Grass</div></div>
        <div class="hotbar-slot" data-index="1" data-type="dirt"><div class="slot-num">2</div><div class="block-preview" style="background:#866043;"></div><div class="slot-label">Dirt</div></div>
        <div class="hotbar-slot" data-index="2" data-type="stone"><div class="slot-num">3</div><div class="block-preview" style="background:#808080;"></div><div class="slot-label">Stone</div></div>
        <div class="hotbar-slot" data-index="3" data-type="wood"><div class="slot-num">4</div><div class="block-preview" style="background:#a07040;"></div><div class="slot-label">Wood</div></div>
        <div class="hotbar-slot" data-index="4" data-type="leaves"><div class="slot-num">5</div><div class="block-preview" style="background:#3a5f25;"></div><div class="slot-label">Leaves</div></div>
        <div class="hotbar-slot" data-index="5" data-type="glass"><div class="slot-num">6</div><div class="block-preview" style="background:rgba(180,220,255,0.6); border:1px solid #fff;"></div><div class="slot-label">Glass</div></div>
    </div>

    <script>
        // 1. Core Engine Initialization
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x78a7ff);
        scene.fog = new THREE.FogExp2(0x78a7ff, 0.015);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Lights Setup
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        const sunLight = new THREE.DirectionalLight(0xffffff, 0.4);
        sunLight.position.set(40, 80, 40);
        scene.add(sunLight);

        // Controls Setup
        const controls = new THREE.PointerLockControls(camera, document.body);
        document.body.addEventListener('click', () => { if(!controls.isLocked) controls.lock(); });

        // 2. Texture & Procedural Generation Architecture
        function generateNoiseTex(baseHex, noiseAmt, size = 16) {
            const canvas = document.createElement('canvas'); canvas.width = size; canvas.height = size;
            const ctx = canvas.getContext('2d');
            const r = (baseHex >> 16) & 255, g = (baseHex >> 8) & 255, b = baseHex & 255;
            for (let x = 0; x < size; x++) {
                for (let y = 0; y < size; y++) {
                    let n = (Math.random() - 0.5) * noiseAmt;
                    ctx.fillStyle = `rgb(${Math.floor(Math.min(255,Math.max(0,r+n)))},${Math.floor(Math.min(255,Math.max(0,g+n)))},${Math.floor(Math.min(255,Math.max(0,b+n)))})`;
                    ctx.fillRect(x, y, 1, 1);
                }
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.NearestFilter;
            return tex;
        }

        function generateGrassSideTex() {
            const canvas = document.createElement('canvas'); canvas.width = 16; canvas.height = 16;
            const ctx = canvas.getContext('2d');
            for (let x = 0; x < 16; x++) {
                for (let y = 0; y < 16; y++) {
                    let isGrass = y < 4 + Math.sin(x * 1.5) * 1.2;
                    let r = isGrass ? 85 : 134, g = isGrass ? 122 : 96, b = isGrass ? 43 : 67;
                    let n = (Math.random() - 0.5) * 25;
                    ctx.fillStyle = `rgb(${Math.floor(r+n)},${Math.floor(g+n)},${Math.floor(b+n)})`;
                    ctx.fillRect(x, y, 1, 1);
                }
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.NearestFilter;
            return tex;
        }

        const texGrassTop = generateNoiseTex(0x557a2b, 20);
        const texDirt = generateNoiseTex(0x866043, 25);
        const texStone = generateNoiseTex(0x808080, 35);
        const texWood = generateNoiseTex(0xa07040, 20);
        const texLeaves = generateNoiseTex(0x3a5f25, 40);
        const texGrassSide = generateGrassSideTex();

        const materials = {
            grass: [
                new THREE.MeshLambertMaterial({ map: texGrassSide }), new THREE.MeshLambertMaterial({ map: texGrassSide }),
                new THREE.MeshLambertMaterial({ map: texGrassTop }), new THREE.MeshLambertMaterial({ map: texDirt }),
                new THREE.MeshLambertMaterial({ map: texGrassSide }), new THREE.MeshLambertMaterial({ map: texGrassSide })
            ],
            dirt: Array(6).fill(new THREE.MeshLambertMaterial({ map: texDirt })),
            stone: Array(6).fill(new THREE.MeshLambertMaterial({ map: texStone })),
            wood: Array(6).fill(new THREE.MeshLambertMaterial({ map: texWood })),
            leaves: Array(6).fill(new THREE.MeshLambertMaterial({ map: texLeaves, transparent: true, opacity: 0.95 })),
            glass: Array(6).fill(new THREE.MeshLambertMaterial({ color: 0xffffff, transparent: true, opacity: 0.4, wireframe: false }))
        };

        // 3. Grid Environment Management & Map Array Map Lookup Dictionary
        const cubeGeo = new THREE.BoxGeometry(1, 1, 1);
        const worldMap = {}; 
        const chunkRadius = 24;

        function getBlockKey(x, y, z) { return `${Math.floor(x)},${Math.floor(y)},${Math.floor(z)}`; }

        function createBlock(x, y, z, type) {
            const key = getBlockKey(x, y, z);
            if(worldMap[key]) return; 

            const mesh = new THREE.Mesh(cubeGeo, materials[type]);
            mesh.position.set(x, y, z);
