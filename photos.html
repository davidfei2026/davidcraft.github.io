<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photos — DavidCraft</title>
<link rel="stylesheet" href="davidcraft.css">
<style>
:root{--p1:#0ea5e9;--p2:#8b5cf6;--danger:#dc2626}
html[data-theme="dark"]{--p1:#38bdf8;--p2:#a78bfa;--danger:#f87171}
.page{width:min(100% - 24px,1380px);margin:auto;padding:26px 0 48px}
.hero{padding:32px;margin-bottom:22px;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;background:radial-gradient(circle at 95% 5%,color-mix(in srgb,var(--p2) 24%,transparent),transparent 22rem),radial-gradient(circle at 5% 100%,color-mix(in srgb,var(--p1) 22%,transparent),transparent 24rem),var(--dc-panel);border:1px solid var(--dc-border);border-radius:26px;box-shadow:0 14px 36px var(--dc-shadow)}
.hero h1{margin:0;font-size:clamp(42px,7vw,74px);line-height:1;letter-spacing:-.055em}
.hero p{max-width:720px;margin:16px 0 0;color:var(--dc-muted);font-size:17px;line-height:1.65}
.hero-icon{width:122px;height:122px;display:grid;place-items:center;border-radius:30px;background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;font-size:54px}
.workspace{display:grid;grid-template-columns:270px 1fr;gap:20px}
.panel{background:var(--dc-panel);border:1px solid var(--dc-border);border-radius:22px;box-shadow:0 14px 36px var(--dc-shadow)}
.sidebar{padding:18px;align-self:start;position:sticky;top:88px}
.side-title{margin:0 0 10px;color:var(--dc-muted);font-size:12px;font-weight:850;letter-spacing:.1em;text-transform:uppercase}
.view{width:100%;min-height:46px;padding:0 13px;display:flex;align-items:center;justify-content:space-between;border:0;border-radius:12px;background:transparent;color:var(--dc-text);font-weight:750;cursor:pointer}
.view:hover,.view.active{background:var(--dc-soft)}
.count{color:var(--dc-muted);font-size:12px}
.upload{width:100%;min-height:46px;margin-top:18px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;font-weight:850;cursor:pointer}
.library{overflow:hidden}
.library-head{padding:20px 22px;display:flex;justify-content:space-between;gap:14px;align-items:center;border-bottom:1px solid var(--dc-border)}
.library-head h2{margin:0}.library-head p{margin:4px 0 0;color:var(--dc-muted);font-size:13px}
.tools{display:flex;gap:9px}.search{min-height:42px;width:min(300px,38vw);padding:0 12px;border:1px solid var(--dc-border);border-radius:11px;background:var(--dc-page);color:var(--dc-text)}
.small{min-height:42px;padding:0 12px;border:1px solid var(--dc-border);border-radius:11px;background:var(--dc-panel);color:var(--dc-text);font-weight:750}
.drop{margin:20px;padding:38px 22px;display:grid;place-items:center;text-align:center;border:2px dashed var(--dc-border);border-radius:18px;background:var(--dc-soft);color:var(--dc-muted);cursor:pointer}
.drop.drag{border-color:var(--p1)}
.drop strong{display:block;margin-bottom:6px;color:var(--dc-text);font-size:18px}
.grid{padding:0 20px 20px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.card{position:relative;overflow:hidden;aspect-ratio:1;border:1px solid var(--dc-border);border-radius:16px;background:var(--dc-soft);cursor:pointer}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.overlay{position:absolute;inset:auto 0 0;padding:28px 10px 10px;display:flex;justify-content:space-between;gap:8px;color:#fff;background:linear-gradient(transparent,rgba(2,6,23,.78));opacity:0}
.card:hover .overlay{opacity:1}
.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:750}
.actions{display:flex;gap:5px}.icon{width:34px;height:34px;border:0;border-radius:9px;background:rgba(255,255,255,.16);color:#fff;font-size:17px}.icon.active{color:#fb7185}.icon.delete{color:#fecaca}
.empty{grid-column:1/-1;margin:20px;padding:46px 22px;text-align:center;color:var(--dc-muted);border:1px dashed var(--dc-border);border-radius:18px}
.viewer{position:fixed;inset:0;z-index:3000;display:none;place-items:center;padding:24px;background:rgba(2,6,23,.86)}
.viewer.open{display:grid}
.viewer-box{width:min(100%,1100px);max-height:92vh;display:grid;grid-template-rows:1fr auto;overflow:hidden;background:var(--dc-panel);border-radius:24px}
.stage{min-height:320px;display:grid;place-items:center;background:#05070d}.stage img{max-width:100%;max-height:75vh;object-fit:contain}
.viewer-foot{padding:16px 18px;display:flex;justify-content:space-between;gap:16px;align-items:center}.viewer-foot h3{margin:0}.viewer-foot p{margin:4px 0 0;color:var(--dc-muted);font-size:12px}
.viewer-actions{display:flex;gap:8px}.viewer-btn{min-height:42px;padding:0 13px;border:1px solid var(--dc-border);border-radius:11px;background:var(--dc-panel);color:var(--dc-text);font-weight:750}
#file{display:none}
@media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:820px){.workspace{grid-template-columns:1fr}.sidebar{position:static}.views{display:flex;overflow-x:auto}.view{width:auto;white-space:nowrap}.library-head{flex-direction:column;align-items:flex-start}.tools{width:100%}.search{width:100%;flex:1}}
@media(max-width:640px){.page{width:min(100% - 14px,1380px)}.hero{grid-template-columns:1fr}.hero-icon{display:none}.grid{grid-template-columns:repeat(2,1fr);padding:0 12px 12px}.drop{margin:12px}.viewer-foot{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body data-davidcraft-page="photos">
<div id="davidcraft-navbar"></div>
<main class="page">
<section class="hero"><div><h1>DavidCraft Photos</h1><p>Add photos from your computer, browse them in a gallery, mark favorites, search by filename, and open a full-screen viewer.</p></div><div class="hero-icon">📷</div></section>
<section class="workspace">
<aside class="panel sidebar">
<p class="side-title">Library</p>
<div class="views">
<button class="view active" data-view="all"><span>🖼 All Photos</span><span id="all-count" class="count">0</span></button>
<button class="view" data-view="favorites"><span>❤️ Favorites</span><span id="fav-count" class="count">0</span></button>
<button class="view" data-view="recent"><span>🕘 Recently Added</span><span id="recent-count" class="count">0</span></button>
</div>
<button id="upload" class="upload">＋ Add Photos</button>
</aside>
<section class="panel library">
<header class="library-head"><div><h2 id="title">All Photos</h2><p id="subtitle">Photos added during this browser session.</p></div><div class="tools"><input id="search" class="search" type="search" placeholder="Search filenames"><button id="slideshow" class="small">▶ Slideshow</button></div></header>
<div id="drop" class="drop"><div><strong>Drop photos here</strong><span>or press “Add Photos” to choose images.</span></div></div>
<div id="grid" class="grid"></div>
</section>
</section>
</main>
<footer class="dc-footer">DavidCraft Photos · V1</footer>
<input id="file" type="file" accept="image/*" multiple>
<div id="viewer" class="viewer"><section class="viewer-box"><div class="stage"><img id="viewer-img" alt=""></div><div class="viewer-foot"><div><h3 id="viewer-title">Photo</h3><p id="viewer-meta"></p></div><div class="viewer-actions"><button id="prev" class="viewer-btn">← Previous</button><button id="next" class="viewer-btn">Next →</button><button id="close" class="viewer-btn">Close</button></div></div></section></div>
<script>
const file=document.getElementById("file"),upload=document.getElementById("upload"),drop=document.getElementById("drop"),grid=document.getElementById("grid"),search=document.getElementById("search"),slideshow=document.getElementById("slideshow");
const viewer=document.getElementById("viewer"),viewerImg=document.getElementById("viewer-img"),viewerTitle=document.getElementById("viewer-title"),viewerMeta=document.getElementById("viewer-meta");
let photos=[],view="all",viewerIndex=-1,timer=null;
function addFiles(list){[...list].filter(f=>f.type.startsWith("image/")).forEach(f=>photos.unshift({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),name:f.name,size:f.size,type:f.type,url:URL.createObjectURL(f),favorite:false,addedAt:Date.now()}));render()}
function visible(){const q=search.value.trim().toLowerCase();return photos.filter(p=>(view==="all"||(view==="favorites"&&p.favorite)||(view==="recent"))&&(!q||p.name.toLowerCase().includes(q)))}
function size(b){if(b<1024)return b+" B";if(b<1048576)return (b/1024).toFixed(1)+" KB";return (b/1048576).toFixed(1)+" MB"}
function render(){const list=visible();document.getElementById("all-count").textContent=photos.length;document.getElementById("fav-count").textContent=photos.filter(p=>p.favorite).length;document.getElementById("recent-count").textContent=photos.length;drop.style.display=photos.length?"none":"grid";grid.innerHTML="";if(photos.length&&!list.length){grid.innerHTML='<div class="empty">No photos match this view.</div>';return}
list.forEach(p=>{const card=document.createElement("article");card.className="card";const img=document.createElement("img");img.src=p.url;img.alt=p.name;const over=document.createElement("div");over.className="overlay";const name=document.createElement("span");name.className="name";name.textContent=p.name;const actions=document.createElement("div");actions.className="actions";const fav=document.createElement("button");fav.className="icon"+(p.favorite?" active":"");fav.textContent=p.favorite?"♥":"♡";fav.onclick=e=>{e.stopPropagation();p.favorite=!p.favorite;render()};const del=document.createElement("button");del.className="icon delete";del.textContent="×";del.onclick=e=>{e.stopPropagation();URL.revokeObjectURL(p.url);photos=photos.filter(x=>x.id!==p.id);render()};actions.append(fav,del);over.append(name,actions);card.append(img,over);card.onclick=()=>openViewer(list.findIndex(x=>x.id===p.id));grid.appendChild(card)})}
function openViewer(i){const list=visible();if(i<0||i>=list.length)return;viewerIndex=i;const p=list[i];viewerImg.src=p.url;viewerTitle.textContent=p.name;viewerMeta.textContent=size(p.size)+" · "+(p.type||"Image");viewer.classList.add("open");document.body.classList.add("dc-no-scroll")}
function move(step){const list=visible();if(!list.length)return closeViewer();viewerIndex=(viewerIndex+step+list.length)%list.length;openViewer(viewerIndex)}
function closeViewer(){if(timer){clearInterval(timer);timer=null}viewer.classList.remove("open");document.body.classList.remove("dc-no-scroll")}
upload.onclick=()=>file.click();drop.onclick=()=>file.click();file.onchange=()=>{addFiles(file.files);file.value=""};
["dragenter","dragover"].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.add("drag")}));["dragleave","drop"].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.remove("drag")}));drop.addEventListener("drop",e=>addFiles(e.dataTransfer.files));
document.querySelectorAll(".view").forEach(b=>b.onclick=()=>{document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));b.classList.add("active");view=b.dataset.view;const labels={all:["All Photos","Photos added during this browser session."],favorites:["Favorites","Photos you marked with a heart."],recent:["Recently Added","Photos added during this session."]};document.getElementById("title").textContent=labels[view][0];document.getElementById("subtitle").textContent=labels[view][1];render()});
search.oninput=render;slideshow.onclick=()=>{if(!visible().length)return;openViewer(0);timer=setInterval(()=>move(1),3000)};
document.getElementById("prev").onclick=()=>move(-1);document.getElementById("next").onclick=()=>move(1);document.getElementById("close").onclick=closeViewer;viewer.onclick=e=>{if(e.target===viewer)closeViewer()};document.addEventListener("keydown",e=>{if(!viewer.classList.contains("open"))return;if(e.key==="Escape")closeViewer();if(e.key==="ArrowLeft")move(-1);if(e.key==="ArrowRight")move(1)});
render();
</script>
<script src="davidcraft.js"></script>
</body>
</html>
