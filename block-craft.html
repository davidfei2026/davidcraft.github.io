<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


/* =========================================================

renderer.setSize(

);

renderer.shadowMap.enabled = true;


/* =========================================================
   LIGHT
========================================================= */

const skyLight =
    new THREE.HemisphereLight(

    );

scene.add(skyLight);

/* =========================================================
   TEXTURE CREATION
========================================================= */

/*
   Instead of downloading texture files,
   we generate small pixel textures.

   This means the whole game stays inside
   one HTML file.
*/


function createTexture(
    baseColor,
    variations,
    pattern = "noise"
){

    const size = 16;

    const canvas =
        document.createElement("canvas");

    canvas.width = size;
    canvas.height = size;

    const ctx =
        canvas.getContext("2d");

    ctx.imageSmoothingEnabled = false;


    /* Base */

    ctx.fillStyle = baseColor;

    ctx.fillRect(
        0,
        0,
        size,
        size
    );


    /* Pixel variation */

    for(
        let y = 0;
        y < size;
        y++
    ){

        for(
            let x = 0;
            x < size;
            x++
        ){

            if(
                Math.random() > .72
            ){

                ctx.fillStyle =
                    variations[
                        Math.floor(
                            Math.random() *
                            variations.length
                        )
                    ];

                ctx.fillRect(
                    x,
                    y,
                    1,
                    1
                );

            }

        }

    }


    /* Special patterns */

    if(pattern === "grass"){

        for(
            let i=0;
            i<20;
            i++
        ){

            ctx.fillStyle =
                Math.random() > .5
                ? "#4c9d32"
                : "#6bbd43";

            const x =
                Math.floor(
                    Math.random()*16
                );

            const y =
                Math.floor(
                    Math.random()*16
                );

            ctx.fillRect(
                x,
                y,
                1,
                1
            );

        }

    }


    if(pattern === "wood"){

        for(
            let i=0;
            i<8;
            i++
        ){

            ctx.fillStyle =
                i%2
                ? "#6e421e"
                : "#b17a3d";

            const x =
                Math.floor(
                    Math.random()*16
                );

            ctx.fillRect(
                x,
                0,
                1,
                16
            );

        }

    }


    if(pattern === "leaves"){

        for(
            let i=0;
            i<35;
            i++
        ){

            ctx.fillStyle =
                Math.random() > .5
                ? "#287b31"
                : "#48a33c";

            const x =
                Math.floor(
                    Math.random()*16
                );

            const y =
                Math.floor(
                    Math.random()*16
                );

            ctx.fillRect(
                x,
                y,
                1,
                1
            );

        }

    }


    const texture =
        new THREE.CanvasTexture(
            canvas
        );

    texture.magFilter =
        THREE.NearestFilter;

    texture.minFilter =
        THREE.NearestFilter;

    texture.colorSpace =
        THREE.SRGBColorSpace;

    texture.wrapS =
        THREE.RepeatWrapping;

    texture.wrapT =
        THREE.RepeatWrapping;


    return texture;
}


/* =========================================================
   TEXTURES
========================================================= */

const grassTopTexture =
    createTexture(
        "#55a936",
        [
            "#4a962e",
            "#67b83e",
            "#3f882a"
        ],
        "grass"
    );


const grassSideTexture =
    createTexture(
        "#8a5a2d",
        [
            "#74481f",
            "#996536",
            "#6f431e"
        ]
    );


const dirtTexture =
    createTexture(
        "#8b5a2b",
        [
            "#70451f",
            "#9b6938",
            "#784a24"
        ]
    );


const stoneTexture =
    createTexture(
        "#858585",
        [
            "#707070",
            "#969696",
            "#626262",
            "#a0a0a0"
        ]
    );


const woodSideTexture =
    createTexture(
        "#8b5a2b",
        [
            "#70431d",
            "#a86f36",
            "#633b1b"
        ],
        "wood"
    );


const woodTopTexture =
    createTexture(
        "#a97943",
        [
            "#7d4f27",
            "#c18b50",
            "#633b1b"
        ]
    );


const leavesTexture =
    createTexture(
        "#368c38",
        [
            "#28732c",
            "#4ba747",
            "#246728",
            "#59b84c"
        ],
        "leaves"
    );


const sandTexture =
    createTexture(
        "#d9c27a",
        [
            "#c5aa60",
            "#ead58f",
            "#bda25b"
        ]
    );


/* =========================================================
   MATERIAL HELPERS
========================================================= */

function material(texture){

    return new THREE.MeshLambertMaterial({
        map:texture
    });

}


/* =========================================================
   BLOCK MATERIALS
========================================================= */


/* Grass */

const grassMaterials = [

    material(grassSideTexture),
    material(grassSideTexture),

    material(grassTopTexture),
    material(dirtTexture),

    material(grassSideTexture),
    material(grassSideTexture)

];


/* Dirt */

const dirtMaterial =
    material(dirtTexture);


/* Stone */

const stoneMaterial =
    material(stoneTexture);


/* Wood */

const woodMaterials = [

    material(woodSideTexture),
    material(woodSideTexture),

    material(woodTopTexture),
    material(woodTopTexture),

    material(woodSideTexture),
    material(woodSideTexture)

];


/* Leaves */

const leavesMaterial =
    new THREE.MeshLambertMaterial({

        map:leavesTexture,

        transparent:true,

        alphaTest:.45

    });


/* Sand */

const sandMaterial =
    material(sandTexture);


/* =========================================================
   BLOCK TYPES
========================================================= */

const blockTypes = [

    "grass",
    "dirt",
    "stone",
    "wood",
    "leaves",
    "sand"

];


function getMaterial(type){

    switch(type){

        case "grass":
            return grassMaterials;

        case "dirt":
            return dirtMaterial;

        case "stone":
            return stoneMaterial;

        case "wood":
            return woodMaterials;

        case "leaves":
            return leavesMaterial;

        case "sand":
            return sandMaterial;

        default:
            return dirtMaterial;

    }

}


/* =========================================================
   BLOCK STORAGE
========================================================= */

const blocks =
    new Map();


function blockKey(
    x,
    y,
    z
){

    return `${x},${y},${z}`;

}


/* =========================================================
   BLOCK GEOMETRY
========================================================= */

const cubeGeometry =
    new THREE.BoxGeometry(
        1,
        1,
        1
    );


/* =========================================================
   ADD BLOCK
========================================================= */

function addBlock(
    x,
    y,
    z,
    type
){

    const key =
        blockKey(
            x,
            y,
            z
        );


    if(
        blocks.has(key)
    ){

        return;

    }


    const block =
        new THREE.Mesh(
            cubeGeometry,
            getMaterial(type)
        );


    block.position.set(
        x+.5,
        y+.5,
        z+.5
    );


    block.castShadow = true;

    block.receiveShadow = true;


    block.userData = {

        x,
        y,
        z,
        type

    };


    scene.add(block);

    blocks.set(
        key,
        block
    );

}


/* =========================================================
   REMOVE BLOCK
========================================================= */

function removeBlock(
    x,
    y,
    z
){

    const key =
        blockKey(
            x,
            y,
            z
        );


    const block =
        blocks.get(key);


    if(!block)
        return;


    scene.remove(block);

    blocks.delete(key);

}


/* =========================================================
   TERRAIN
========================================================= */

function terrainHeight(
    x,
    z
){

    return Math.max(

        2,

        Math.floor(

            4

            + Math.sin(
                x*.23
            )*1.6

            + Math.cos(
                z*.19
            )*1.4

            + Math.sin(
                (x+z)*.11
            )*1.2

        )

    );

}


/* =========================================================
   GENERATE WORLD
========================================================= */

for(
    let x=-22;
    x<=22;
    x++
){

    for(
        let z=-22;
        z<=22;
        z++
    ){

        const height =
            terrainHeight(
                x,
                z
            );


        for(
            let y=0;
            y<=height;
            y++
        ){

            let type;


            if(
                y===height
            ){

                type="grass";

            }

            else if(
                y>height-3
            ){

                type="dirt";

            }

            else{

                type="stone";

            }


            addBlock(
                x,
                y,
                z,
                type
            );

        }

    }

}


/* =========================================================
   TREES
========================================================= */

function createTree(
    x,
    z
){

    const ground =
        terrainHeight(
            x,
            z
        );


    /* Trunk */

    for(
        let y=ground+1;
        y<ground+5;
        y++
    ){

        addBlock(
            x,
            y,
            z,
            "wood"
        );

    }


    /* Leaves */

    for(
        let dx=-2;
        dx<=2;
        dx++
    ){

        for(
            let dz=-2;
            dz<=2;
            dz++
        ){

            for(
                let dy=3;
                dy<=5;
                dy++
            ){

                if(
                    Math.abs(dx)
                    +
                    Math.abs(dz)
                    +
                    (dy===5?1:0)
                    <5
                ){

                    addBlock(
                        x+dx,
                        ground+dy,
                        z+dz,
                        "leaves"
                    );

                }

            }

        }

    }

}


/* Random trees */

for(
    let x=-18;
    x<=18;
    x+=6
){

    for(
        let z=-18;
        z<=18;
        z+=7
    ){

        if(
            Math.random()>.35
        ){

            createTree(

                x+
                Math.floor(
                    Math.random()*3
                )-1,

                z+
                Math.floor(
                    Math.random()*3
                )-1

            );

        }

    }

}


/* =========================================================
   PLAYER
========================================================= */

const player = {

    position:
        new THREE.Vector3(
            .5,
            terrainHeight(
                0,
                0
            )+1.05,
            .5
        ),

    velocity:
        new THREE.Vector3(),

    yaw:0,

    pitch:0,

    onGround:false

};


camera.position.copy(
    player.position
);


/* =========================================================
   KEYBOARD
========================================================= */

const keys = {};


window.addEventListener(
    "keydown",
    event => {

        keys[event.code]=true;


        if(
            /^Digit[1-6]$/
            .test(event.code)
        ){

            const number =
                Number(
                    event.code.slice(-1)
                );


            selectBlock(
                number-1
            );

        }

    }
);


window.addEventListener(
    "keyup",
    event => {

        keys[event.code]=false;

    }
);


/* =========================================================
   HOTBAR
========================================================= */

let selectedBlock=0;


const hotbar =
    document.querySelector(
        "#hotbar"
    );


function drawHotbar(){

    hotbar.innerHTML="";


    blockTypes.forEach(
        (type,index)=>{

            const slot =
                document.createElement(
                    "div"
                );


            slot.className="slot";


            if(
                index===selectedBlock
            ){

                slot.classList.add(
                    "selected"
                );

            }


            const texture =
                getMaterial(type);


            let preview;


            if(
                Array.isArray(texture)
            ){

                preview =
                    texture[0]
                    .map
                    .image;

            }

            else{

                preview =
                    texture.map.image;

            }


            const image =
                document.createElement(
                    "canvas"
                );


            image.width=16;
            image.height=16;


            const ctx =
                image.getContext(
                    "2d"
                );


            if(preview){

                ctx.drawImage(
                    preview,
                    0,
                    0
                );

            }


            image.className="swatch";


            slot.appendChild(
                image
            );


            const number =
                document.createElement(
                    "div"
                );


            number.className=
                "number";


            number.textContent=
                index+1;


            slot.appendChild(
                number
            );


            hotbar.appendChild(
                slot
            );

        }
    );

}


function selectBlock(
    index
){

    selectedBlock =
        Math.max(
            0,
            Math.min(
                blockTypes.length-1,
                index
            )
        );


    drawHotbar();

}


drawHotbar();


/* =========================================================
   RAYCASTING
========================================================= */

const raycaster =
    new THREE.Raycaster();


function getTargetBlock(){

    raycaster.setFromCamera(
        {
            x:0,
            y:0
        },
        camera
    );


    const objects =
        [...blocks.values()];


    const hits =
        raycaster.intersectObjects(
            objects
        );


    return hits[0] || null;

}


/* =========================================================
   MOUSE
========================================================= */

canvas.addEventListener(
    "contextmenu",
    event=>{
        event.preventDefault();
    }
);


canvas.addEventListener(
    "mousedown",
    event=>{

        if(
            document.pointerLockElement
            !==canvas
        ){

            return;

        }


        const hit =
            getTargetBlock();


        if(!hit)
            return;


        const data =
            hit.object.userData;


        /* Break */

        if(
            event.button===0
        ){

            if(
                data.y>0
            ){

                removeBlock(
                    data.x,
                    data.y,
                    data.z
                );

            }

        }


        /* Place */

        if(
            event.button===2
        ){

            const normal =
                hit.face.normal.clone();


            const position =
                hit.object.position
                .clone()
                .subScalar(.5)
                .add(normal);


            const x =
                Math.floor(
                    position.x
                );


            const y =
                Math.floor(
                    position.y
                );


            const z =
                Math.floor(
                    position.z
                );


            if(
                y>=0
                &&
                !blocks.has(
                    blockKey(
                        x,
                        y,
                        z
                    )
                )
            ){

                addBlock(
                    x,
                    y,
                    z,
                    blockTypes[
                        selectedBlock
                    ]
                );

            }

        }

    }
);


/* =========================================================
   POINTER LOCK
========================================================= */

canvas.addEventListener(
    "click",
    ()=>{

        canvas.requestPointerLock();

    }
);


window.addEventListener(
    "mousemove",
    event=>{

        if(
            document.pointerLockElement
            !==canvas
        ){

            return;

        }


        player.yaw -=
            event.movementX*.0025;


        player.pitch -=
            event.movementY*.0025;


        const limit =
            Math.PI/2-.05;


        player.pitch =
            Math.max(
                -limit,
                Math.min(
                    limit,
                    player.pitch
                )
            );

    }
);


/* =========================================================
   COLLISION
========================================================= */

function collides(
    position
){

    const radius=.28;

    const height=1.75;


    for(
        let x=Math.floor(
            position.x-radius
        );

        x<=Math.floor(
            position.x+radius
        );

        x++
    ){

        for(
            let y=Math.floor(
                position.y
            );

            y<=Math.floor(
                position.y+height
            );

            y++
        ){

            for(
                let z=Math.floor(
                    position.z-radius
                );

                z<=Math.floor(
                    position.z+radius
                );

                z++
            ){

                if(
                    blocks.has(
                        blockKey(
                            x,
                            y,
                            z
                        )
                    )
                ){

                    return true;

                }

            }

        }

    }


    return false;

}


/* =========================================================
   MOVE AXIS
========================================================= */

function moveAxis(
    axis,
    amount
){

    const test =
        player.position.clone();


    test[axis]+=amount;


    if(
        !collides(test)
    ){

        player.position[axis]+=
            amount;

        return true;

    }


    return false;

}


/* =========================================================
   GAME UPDATE
========================================================= */

const clock =
    new THREE.Clock();


const moveSpeed=5.5;

const gravity=18;

const jumpPower=7.2;


function update(
    delta
){

    let forward=0;

    let sideways=0;


    if(keys.KeyW)
        forward-=1;

    if(keys.KeyS)
        forward+=1;

    if(keys.KeyA)
        sideways-=1;

    if(keys.KeyD)
        sideways+=1;


    const length =
        Math.hypot(
            forward,
            sideways
        )||1;


    forward/=length;

    sideways/=length;


    const sin =
        Math.sin(
            player.yaw
        );


    const cos =
        Math.cos(
            player.yaw
        );


    const velocityX =
        (
            sideways*cos
            -
            forward*sin
        )
        *
        moveSpeed;


    const velocityZ =
        (
            sideways*sin
            +
            forward*cos
        )
        *
        moveSpeed;


    moveAxis(
        "x",
        velocityX*delta
    );


    moveAxis(
        "z",
        velocityZ*delta
    );


    /* Gravity */

    player.velocity.y -=
        gravity*delta;


    /* Jump */

    if(
        keys.Space
        &&
        player.onGround
    ){

        player.velocity.y=
            jumpPower;

        player.onGround=false;

    }


    /* Vertical */

    if(
        !moveAxis(
            "y",
            player.velocity.y*delta
        )
    ){

        if(
            player.velocity.y<0
        ){

            player.onGround=true;

        }


        player.velocity.y=0;

    }

    else{

        player.onGround=false;

    }


    /* Respawn */

    if(
        player.position.y<-10
    ){

        player.position.set(
            .5,
            12,
            .5
        );

        player.velocity.set(
            0,
            0,
            0
        );

    }


    /* Camera */

    camera.position.set(
        player.position.x,
        player.position.y+.72,
        player.position.z
    );


    camera.rotation.set(
        player.pitch,
        player.yaw,
        0
    );

}


/* =========================================================
   RENDER
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(
            clock.getDelta(),
            .05
        );


    update(delta);


    renderer.render(
        scene,
        camera
    );

}


animate();


/* =========================================================
   START
========================================================= */

document
.querySelector("#startButton")
.addEventListener(
    "click",
    ()=>{

        document
        .querySelector("#start")
        .style.display="none";


        canvas.requestPointerLock();

    }
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>
