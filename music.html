<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Music — DavidCraft</title>

  <link rel="stylesheet" href="davidcraft.css">

  <style>
    :root {
      --music-accent: #8b5cf6;
      --music-accent-2: #ec4899;
      --music-danger: #dc2626;
    }

    html[data-theme="dark"] {
      --music-accent: #a78bfa;
      --music-accent-2: #f472b6;
      --music-danger: #f87171;
    }

    .music-page {
      width: min(100% - 24px, 1320px);
      margin: 0 auto;
      padding: 26px 0 110px;
    }

    .music-hero {
      padding: 28px;
      margin-bottom: 20px;

      display: grid;
      grid-template-columns: 1fr auto;
      gap: 24px;
      align-items: center;

      background:
        radial-gradient(circle at 95% 0%, color-mix(in srgb, var(--music-accent-2) 24%, transparent), transparent 22rem),
        radial-gradient(circle at 0% 100%, color-mix(in srgb, var(--music-accent) 22%, transparent), transparent 24rem),
        var(--dc-panel);

      border: 1px solid var(--dc-border);
      border-radius: 24px;
      box-shadow: 0 14px 36px var(--dc-shadow);
    }

    .music-hero h1 {
      margin: 0;
      font-size: clamp(36px, 6vw, 64px);
      letter-spacing: -0.05em;
    }

    .music-hero p {
      max-width: 650px;
      margin: 14px 0 0;
      color: var(--dc-muted);
      font-size: 17px;
      line-height: 1.6;
    }

    .hero-art {
      width: 120px;
      height: 120px;

      display: grid;
      place-items: center;

      border-radius: 28px;

      background: linear-gradient(135deg, var(--music-accent), var(--music-accent-2));
      color: #ffffff;

      font-size: 52px;
      box-shadow: 0 18px 44px color-mix(in srgb, var(--music-accent) 26%, transparent);
    }

    .music-grid {
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      gap: 20px;
    }

    .music-panel {
      background: var(--dc-panel);
      border: 1px solid var(--dc-border);
      border-radius: 22px;
      box-shadow: 0 14px 36px var(--dc-shadow);
    }

    .library-panel {
      padding: 18px;
      align-self: start;
      position: sticky;
      top: 88px;
    }

    .library-title {
      margin: 0 0 12px;
      font-size: 14px;
      font-weight: 850;
      color: var(--dc-muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .library-button {
      width: 100%;
      min-height: 46px;
      padding: 0 13px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;

      border: 0;
      border-radius: 12px;

      background: transparent;
      color: var(--dc-text);

      font-weight: 750;
      text-align: left;
      cursor: pointer;
    }

    .library-button:hover,
    .library-button.active {
      background: var(--dc-soft);
    }

    .library-count {
      color: var(--dc-muted);
      font-size: 12px;
    }

    .search-box {
      margin-top: 18px;
    }

    .search-box label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 800;
    }

    .search-input {
      width: 100%;
      min-height: 46px;
      padding: 0 13px;

      border: 1px solid var(--dc-border);
      border-radius: 12px;

      background: var(--dc-page);
      color: var(--dc-text);
      outline: none;
    }

    .search-input:focus {
      border-color: var(--music-accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--music-accent) 18%, transparent);
    }

    .tracks-panel {
      overflow: hidden;
    }

    .tracks-header {
      padding: 20px 22px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;

      border-bottom: 1px solid var(--dc-border);
    }

    .tracks-header h2 {
      margin: 0;
      font-size: 22px;
    }

    .tracks-header p {
      margin: 4px 0 0;
      color: var(--dc-muted);
      font-size: 13px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .small-button {
      min-height: 40px;
      padding: 0 12px;

      border: 1px solid var(--dc-border);
      border-radius: 11px;

      background: var(--dc-panel);
      color: var(--dc-text);

      font-weight: 750;
      cursor: pointer;
    }

    .small-button:hover,
    .small-button.active {
      border-color: var(--music-accent);
      color: var(--music-accent);
    }

    .track-list {
      display: grid;
    }

    .track-row {
      padding: 13px 18px;

      display: grid;
      grid-template-columns: 48px minmax(0, 1.4fr) minmax(120px, 0.8fr) auto auto;
      gap: 14px;
      align-items: center;

      border-bottom: 1px solid var(--dc-border);
    }

    .track-row:last-child {
      border-bottom: 0;
    }

    .track-row:hover,
    .track-row.playing {
      background: var(--dc-soft);
    }

    .track-play {
      width: 42px;
      height: 42px;

      display: grid;
      place-items: center;

      border: 0;
      border-radius: 50%;

      background: linear-gradient(135deg, var(--music-accent), var(--music-accent-2));
      color: #ffffff;

      font-weight: 900;
      cursor: pointer;
    }

    .track-name {
      min-width: 0;
    }

    .track-name strong,
    .track-name span {
      display: block;
    }

    .track-name strong {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .track-name span,
    .track-style,
    .track-duration {
      color: var(--dc-muted);
      font-size: 12px;
    }

    .favorite-button {
      width: 38px;
      height: 38px;

      border: 0;
      border-radius: 10px;

      background: transparent;
      color: var(--dc-muted);

      font-size: 21px;
      cursor: pointer;
    }

    .favorite-button.active {
      color: #ef4444;
    }

    .empty-state {
      padding: 44px 22px;
      text-align: center;
      color: var(--dc-muted);
    }

    .player {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 1800;

      min-height: 88px;
      padding: 12px 18px;

      display: grid;
      grid-template-columns: minmax(180px, 1fr) auto minmax(220px, 1fr);
      gap: 18px;
      align-items: center;

      background: color-mix(in srgb, var(--dc-panel) 94%, transparent);
      border-top: 1px solid var(--dc-border);
      backdrop-filter: blur(16px);
    }

    .now-playing {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .now-art {
      width: 54px;
      height: 54px;

      display: grid;
      place-items: center;
      flex-shrink: 0;

      border-radius: 15px;

      background: linear-gradient(135deg, var(--music-accent), var(--music-accent-2));
      color: #ffffff;

      font-size: 24px;
    }

    .now-copy {
      min-width: 0;
    }

    .now-copy strong,
    .now-copy span {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .now-copy span {
      margin-top: 3px;
      color: var(--dc-muted);
      font-size: 12px;
    }

    .player-center {
      display: grid;
      gap: 7px;
      min-width: 360px;
    }

    .player-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    .control-button {
      width: 40px;
      height: 40px;

      display: grid;
      place-items: center;

      border: 0;
      border-radius: 50%;

      background: transparent;
      color: var(--dc-text);

      font-size: 19px;
      cursor: pointer;
    }

    .control-button:hover {
      background: var(--dc-soft);
    }

    .control-button.main {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--music-accent), var(--music-accent-2));
      color: #ffffff;
    }

    .progress-row {
      display: grid;
      grid-template-columns: 42px 1fr 42px;
      gap: 10px;
      align-items: center;

      color: var(--dc-muted);
      font-size: 11px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--music-accent);
    }

    .volume-row {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 9px;
    }

    .volume-row input {
      max-width: 150px;
    }

    @media (max-width: 940px) {
      .music-grid {
        grid-template-columns: 1fr;
      }

      .library-panel {
        position: static;
      }

      .library-buttons {
        display: flex;
        gap: 8px;
        overflow-x: auto;
      }

      .library-button {
        width: auto;
        white-space: nowrap;
      }

      .player {
        grid-template-columns: 1fr auto;
      }

      .player-center {
        grid-column: 1 / -1;
        grid-row: 2;
        min-width: 0;
      }

      .volume-row {
        justify-content: flex-end;
      }
    }

    @media (max-width: 680px) {
      .music-page {
        width: min(100% - 14px, 1320px);
        padding-bottom: 150px;
      }

      .music-hero {
        grid-template-columns: 1fr;
      }

      .hero-art {
        display: none;
      }

      .track-row {
        grid-template-columns: 46px minmax(0, 1fr) auto;
      }

      .track-style,
      .track-duration {
        display: none;
      }

      .player {
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .volume-row {
        display: none;
      }

      .player-center {
        grid-column: 1;
        grid-row: auto;
      }

      .now-playing {
        justify-content: center;
      }
    }
  </style>
</head>

<body data-davidcraft-page="music">
  <div id="davidcraft-navbar"></div>

  <main class="music-page">
    <section class="music-hero">
      <div>
        <h1>DavidCraft Music</h1>
        <p>
          Play original built-in demo tracks, create favorites, search your library,
          shuffle songs, and control playback without leaving DavidCraft.
        </p>
      </div>

      <div class="hero-art" aria-hidden="true">🎵</div>
    </section>

    <section class="music-grid">
      <aside class="music-panel library-panel">
        <p class="library-title">Your Library</p>

        <div class="library-buttons">
          <button class="library-button active" type="button" data-view="all">
            <span>🎶 All Tracks</span>
            <span id="all-count" class="library-count">0</span>
          </button>

          <button class="library-button" type="button" data-view="favorites">
            <span>❤️ Favorites</span>
            <span id="favorite-count" class="library-count">0</span>
          </button>

          <button class="library-button" type="button" data-view="calm">
            <span>🌙 Calm</span>
            <span class="library-count">3</span>
          </button>

          <button class="library-button" type="button" data-view="energy">
            <span>⚡ Energy</span>
            <span class="library-count">3</span>
          </button>
        </div>

        <div class="search-box">
          <label for="music-search">Search music</label>
          <input
            id="music-search"
            class="search-input"
            type="search"
            placeholder="Search title, artist, or style"
          >
        </div>
      </aside>

      <section class="music-panel tracks-panel">
        <header class="tracks-header">
          <div>
            <h2 id="view-title">All Tracks</h2>
            <p id="view-subtitle">Original DavidCraft demo music.</p>
          </div>

          <div class="header-actions">
            <button id="shuffle-button" class="small-button" type="button">
              🔀 Shuffle
            </button>

            <button id="play-all-button" class="small-button" type="button">
              ▶ Play All
            </button>
          </div>
        </header>

        <div id="track-list" class="track-list"></div>
      </section>
    </section>
  </main>

  <footer class="dc-footer">
    DavidCraft Music · v0.1
  </footer>

  <section class="player" aria-label="Music player">
    <div class="now-playing">
      <div id="now-art" class="now-art">♪</div>

      <div class="now-copy">
        <strong id="now-title">Choose a track</strong>
        <span id="now-artist">DavidCraft Music</span>
      </div>
    </div>

    <div class="player-center">
      <div class="player-controls">
        <button id="previous-button" class="control-button" type="button" aria-label="Previous track">
          ⏮
        </button>

        <button id="play-button" class="control-button main" type="button" aria-label="Play">
          ▶
        </button>

        <button id="next-button" class="control-button" type="button" aria-label="Next track">
          ⏭
        </button>

        <button id="repeat-button" class="control-button" type="button" aria-label="Repeat">
          🔁
        </button>
      </div>

      <div class="progress-row">
        <span id="current-time">0:00</span>

        <input
          id="progress"
          type="range"
          min="0"
          max="100"
          value="0"
          aria-label="Track progress"
        >

        <span id="total-time">0:00</span>
      </div>
    </div>

    <div class="volume-row">
      <span aria-hidden="true">🔊</span>

      <input
        id="volume"
        type="range"
        min="0"
        max="100"
        value="70"
        aria-label="Volume"
      >
    </div>
  </section>

  <script>
    const FAVORITES_KEY = "davidcraft-music-favorites";

    const tracks = [
      {
        id: "starlight",
        title: "Starlight Drive",
        artist: "DavidCraft Studio",
        style: "Synthwave",
        category: "energy",
        duration: 32,
        tempo: 116,
        notes: [261.63, 329.63, 392.00, 523.25, 392.00, 329.63, 293.66, 349.23],
        color: "linear-gradient(135deg, #8b5cf6, #ec4899)"
      },
      {
        id: "quiet-river",
        title: "Quiet River",
        artist: "DavidCraft Studio",
        style: "Ambient",
        category: "calm",
        duration: 36,
        tempo: 72,
        notes: [220.00, 261.63, 329.63, 293.66, 246.94, 220.00],
        color: "linear-gradient(135deg, #06b6d4, #3b82f6)"
      },
      {
        id: "pixel-run",
        title: "Pixel Run",
        artist: "DavidCraft Arcade",
        style: "Chiptune",
        category: "energy",
        duration: 28,
        tempo: 138,
        notes: [523.25, 659.25, 783.99, 659.25, 587.33, 698.46, 880.00, 698.46],
        color: "linear-gradient(135deg, #f97316, #ec4899)"
      },
      {
        id: "morning-clouds",
        title: "Morning Clouds",
        artist: "DavidCraft Studio",
        style: "Lo-fi",
        category: "calm",
        duration: 40,
        tempo: 78,
        notes: [196.00, 246.94, 293.66, 246.94, 220.00, 261.63],
        color: "linear-gradient(135deg, #22c55e, #14b8a6)"
      },
      {
        id: "neon-steps",
        title: "Neon Steps",
        artist: "DavidCraft Studio",
        style: "Electronic",
        category: "energy",
        duration: 34,
        tempo: 124,
        notes: [293.66, 369.99, 440.00, 587.33, 440.00, 369.99, 329.63, 415.30],
        color: "linear-gradient(135deg, #6366f1, #06b6d4)"
      },
      {
        id: "moon-garden",
        title: "Moon Garden",
        artist: "DavidCraft Studio",
        style: "Dreamscape",
        category: "calm",
        duration: 38,
        tempo: 68,
        notes: [174.61, 220.00, 261.63, 220.00, 196.00, 233.08],
        color: "linear-gradient(135deg, #64748b, #8b5cf6)"
      }
    ];

    const trackList = document.getElementById("track-list");
    const musicSearch = document.getElementById("music-search");
    const viewTitle = document.getElementById("view-title");
    const viewSubtitle = document.getElementById("view-subtitle");
    const favoriteCount = document.getElementById("favorite-count");
    const allCount = document.getElementById("all-count");

    const playButton = document.getElementById("play-button");
    const previousButton = document.getElementById("previous-button");
    const nextButton = document.getElementById("next-button");
    const repeatButton = document.getElementById("repeat-button");
    const shuffleButton = document.getElementById("shuffle-button");
    const playAllButton = document.getElementById("play-all-button");
    const progress = document.getElementById("progress");
    const volume = document.getElementById("volume");
    const currentTimeLabel = document.getElementById("current-time");
    const totalTimeLabel = document.getElementById("total-time");
    const nowTitle = document.getElementById("now-title");
    const nowArtist = document.getElementById("now-artist");
    const nowArt = document.getElementById("now-art");

    let favorites = loadFavorites();
    let currentView = "all";
    let currentTrackIndex = -1;
    let isPlaying = false;
    let repeatEnabled = false;
    let audioContext = null;
    let masterGain = null;
    let schedulerTimer = null;
    let progressTimer = null;
    let trackStartedAt = 0;
    let pausedAt = 0;
    let activeOscillators = [];

    function loadFavorites() {
      try {
        const saved = JSON.parse(localStorage.getItem(FAVORITES_KEY));
        return Array.isArray(saved) ? saved : [];
      } catch {
        return [];
      }
    }

    function saveFavorites() {
      localStorage.setItem(FAVORITES_KEY, JSON.stringify(favorites));
    }

    function formatTime(seconds) {
      const safe = Math.max(0, Math.floor(seconds));
      const minutes = Math.floor(safe / 60);
      const remaining = safe % 60;
      return `${minutes}:${String(remaining).padStart(2, "0")}`;
    }

    function getFilteredTracks() {
      const query = musicSearch.value.trim().toLowerCase();

      return tracks.filter((track) => {
        const matchesView =
          currentView === "all" ||
          currentView === track.category ||
          (currentView === "favorites" && favorites.includes(track.id));

        const matchesSearch =
          !query ||
          track.title.toLowerCase().includes(query) ||
          track.artist.toLowerCase().includes(query) ||
          track.style.toLowerCase().includes(query);

        return matchesView && matchesSearch;
      });
    }

    function updateCounts() {
      allCount.textContent = String(tracks.length);
      favoriteCount.textContent = String(favorites.length);
    }

    function renderTracks() {
      const filtered = getFilteredTracks();

      trackList.innerHTML = "";

      if (!filtered.length) {
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.textContent = "No tracks match this view.";
        trackList.appendChild(empty);
        updateCounts();
        return;
      }

      filtered.forEach((track) => {
        const actualIndex = tracks.findIndex((item) => item.id === track.id);

        const row = document.createElement("article");
        row.className = "track-row";

        if (actualIndex === currentTrackIndex) {
          row.classList.add("playing");
        }

        const play = document.createElement("button");
        play.className = "track-play";
        play.type = "button";
        play.textContent =
          actualIndex === currentTrackIndex && isPlaying ? "Ⅱ" : "▶";

        play.addEventListener("click", () => {
          if (actualIndex === currentTrackIndex) {
            togglePlayback();
          } else {
            playTrack(actualIndex);
          }
        });

        const name = document.createElement("div");
        name.className = "track-name";
        name.innerHTML =
          `<strong>${track.title}</strong>` +
          `<span>${track.artist}</span>`;

        const style = document.createElement("div");
        style.className = "track-style";
        style.textContent = track.style;

        const duration = document.createElement("div");
        duration.className = "track-duration";
        duration.textContent = formatTime(track.duration);

        const favorite = document.createElement("button");
        favorite.className = "favorite-button";
        favorite.type = "button";
        favorite.textContent = favorites.includes(track.id) ? "♥" : "♡";
        favorite.setAttribute("aria-label", `Favorite ${track.title}`);

        if (favorites.includes(track.id)) {
          favorite.classList.add("active");
        }

        favorite.addEventListener("click", () => {
          toggleFavorite(track.id);
        });

        row.append(play, name, style, duration, favorite);
        trackList.appendChild(row);
      });

      updateCounts();
    }

    function toggleFavorite(trackId) {
      if (favorites.includes(trackId)) {
        favorites = favorites.filter((id) => id !== trackId);
      } else {
        favorites.push(trackId);
      }

      saveFavorites();
      renderTracks();
    }

    function ensureAudio() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        masterGain = audioContext.createGain();
        masterGain.gain.value = Number(volume.value) / 100;
        masterGain.connect(audioContext.destination);
      }

      if (audioContext.state === "suspended") {
        audioContext.resume();
      }
    }

    function stopOscillators() {
      activeOscillators.forEach((oscillator) => {
        try {
          oscillator.stop();
        } catch {}
      });

      activeOscillators = [];
    }

    function scheduleTrack(track, startOffset = 0) {
      ensureAudio();
      stopOscillators();

      const beatLength = 60 / track.tempo;
      const totalBeats = Math.ceil(track.duration / beatLength);
      const now = audioContext.currentTime + 0.05;

      for (let beat = 0; beat < totalBeats; beat += 1) {
        const noteStart = beat * beatLength;

        if (noteStart < startOffset) {
          continue;
        }

        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();

        oscillator.type =
          track.style === "Chiptune"
            ? "square"
            : track.style === "Ambient" || track.style === "Dreamscape"
              ? "sine"
              : "triangle";

        oscillator.frequency.value =
          track.notes[beat % track.notes.length];

        const start = now + (noteStart - startOffset);
        const stop = Math.min(
          now + track.duration - startOffset,
          start + beatLength * 0.82
        );

        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(0.18, start + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.0001, stop);

        oscillator.connect(gain);
        gain.connect(masterGain);

        oscillator.start(start);
        oscillator.stop(stop + 0.02);

        activeOscillators.push(oscillator);
      }
    }

    function playTrack(index, startOffset = 0) {
      if (index < 0 || index >= tracks.length) {
        return;
      }

      stopPlaybackTimers();

      currentTrackIndex = index;
      const track = tracks[index];

      scheduleTrack(track, startOffset);

      pausedAt = startOffset;
      trackStartedAt = performance.now() - startOffset * 1000;
      isPlaying = true;

      updateNowPlaying();
      startProgressTimer();
      renderTracks();
    }

    function pauseTrack() {
      if (!isPlaying || currentTrackIndex < 0) {
        return;
      }

      pausedAt =
        (performance.now() - trackStartedAt) / 1000;

      pausedAt = Math.min(
        pausedAt,
        tracks[currentTrackIndex].duration
      );

      stopOscillators();
      stopPlaybackTimers();
      isPlaying = false;

      updateNowPlaying();
      renderTracks();
    }

    function resumeTrack() {
      if (currentTrackIndex < 0) {
        playTrack(0);
        return;
      }

      playTrack(currentTrackIndex, pausedAt);
    }

    function togglePlayback() {
      if (isPlaying) {
        pauseTrack();
      } else {
        resumeTrack();
      }
    }

    function stopPlaybackTimers() {
      if (progressTimer) {
        clearInterval(progressTimer);
        progressTimer = null;
      }

      if (schedulerTimer) {
        clearTimeout(schedulerTimer);
        schedulerTimer = null;
      }
    }

    function startProgressTimer() {
      const track = tracks[currentTrackIndex];

      totalTimeLabel.textContent =
        formatTime(track.duration);

      progressTimer = setInterval(() => {
        const elapsed =
          (performance.now() - trackStartedAt) / 1000;

        const percentage =
          Math.min(100, (elapsed / track.duration) * 100);

        progress.value = String(percentage);
        currentTimeLabel.textContent = formatTime(elapsed);

        if (elapsed >= track.duration) {
          if (repeatEnabled) {
            playTrack(currentTrackIndex);
          } else {
            playNext();
          }
        }
      }, 200);
    }

    function updateNowPlaying() {
      if (currentTrackIndex < 0) {
        playButton.textContent = "▶";
        return;
      }

      const track = tracks[currentTrackIndex];

      nowTitle.textContent = track.title;
      nowArtist.textContent = `${track.artist} · ${track.style}`;
      nowArt.style.background = track.color;
      nowArt.textContent = "♪";

      playButton.textContent = isPlaying ? "Ⅱ" : "▶";
      playButton.setAttribute("aria-label", isPlaying ? "Pause" : "Play");

      totalTimeLabel.textContent = formatTime(track.duration);
    }

    function playNext() {
      if (!tracks.length) return;

      const next =
        currentTrackIndex < 0
          ? 0
          : (currentTrackIndex + 1) % tracks.length;

      playTrack(next);
    }

    function playPrevious() {
      if (!tracks.length) return;

      const previous =
        currentTrackIndex <= 0
          ? tracks.length - 1
          : currentTrackIndex - 1;

      playTrack(previous);
    }

    playButton.addEventListener("click", togglePlayback);
    nextButton.addEventListener("click", playNext);
    previousButton.addEventListener("click", playPrevious);

    repeatButton.addEventListener("click", () => {
      repeatEnabled = !repeatEnabled;
      repeatButton.classList.toggle("active", repeatEnabled);
    });

    shuffleButton.addEventListener("click", () => {
      const randomIndex = Math.floor(Math.random() * tracks.length);
      playTrack(randomIndex);
    });

    playAllButton.addEventListener("click", () => {
      const filtered = getFilteredTracks();

      if (!filtered.length) {
        return;
      }

      const index = tracks.findIndex(
        (track) => track.id === filtered[0].id
      );

      playTrack(index);
    });

    progress.addEventListener("input", () => {
      if (currentTrackIndex < 0) {
        return;
      }

      const track = tracks[currentTrackIndex];
      const seekTo =
        (Number(progress.value) / 100) * track.duration;

      currentTimeLabel.textContent = formatTime(seekTo);
    });

    progress.addEventListener("change", () => {
      if (currentTrackIndex < 0) {
        return;
      }

      const track = tracks[currentTrackIndex];
      const seekTo =
        (Number(progress.value) / 100) * track.duration;

      playTrack(currentTrackIndex, seekTo);
    });

    volume.addEventListener("input", () => {
      if (masterGain) {
        masterGain.gain.value =
          Number(volume.value) / 100;
      }
    });

    musicSearch.addEventListener("input", renderTracks);

    document
      .querySelectorAll(".library-button")
      .forEach((button) => {
        button.addEventListener("click", () => {
          document
            .querySelectorAll(".library-button")
            .forEach((item) => {
              item.classList.remove("active");
            });

          button.classList.add("active");
          currentView = button.dataset.view;

          const titles = {
            all: ["All Tracks", "Original DavidCraft demo music."],
            favorites: ["Favorites", "Tracks you marked with a heart."],
            calm: ["Calm", "Relaxed ambient and lo-fi music."],
            energy: ["Energy", "Fast electronic and arcade-inspired music."]
          };

          viewTitle.textContent = titles[currentView][0];
          viewSubtitle.textContent = titles[currentView][1];

          renderTracks();
        });
      });

    updateCounts();
    renderTracks();
    updateNowPlaying();
  </script>

  <script src="davidcraft.js"></script>
</body>
</html>
