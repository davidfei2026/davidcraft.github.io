<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Shows V3 — DavidCraft</title>

  <link rel="stylesheet" href="davidcraft.css">

  <style>
    :root {
      --shows-accent: #f97316;
      --shows-accent-2: #ef4444;
      --shows-gold: #f59e0b;
      --shows-danger: #dc2626;
      --hero-overlay: rgba(2, 6, 23, 0.58);
    }

    html[data-theme="dark"] {
      --shows-accent: #fb923c;
      --shows-accent-2: #f87171;
      --shows-gold: #fbbf24;
      --shows-danger: #f87171;
      --hero-overlay: rgba(2, 6, 23, 0.68);
    }

    .shows-page {
      width: min(100% - 24px, 1380px);
      margin: 0 auto;
      padding: 24px 0 52px;
    }

    .hero {
      position: relative;
      min-height: 470px;
      margin-bottom: 24px;
      overflow: hidden;
      display: grid;
      align-items: end;
      border: 1px solid var(--dc-border);
      border-radius: 28px;
      box-shadow: 0 18px 48px var(--dc-shadow);
      background-size: cover;
      background-position: center;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, var(--hero-overlay) 0%, rgba(2,6,23,.36) 48%, rgba(2,6,23,.08) 100%),
        linear-gradient(0deg, rgba(2,6,23,.72) 0%, rgba(2,6,23,.08) 58%, transparent 100%);
    }

    .hero-content {
      position: relative;
      z-index: 1;
      max-width: 720px;
      padding: 42px;
      color: #ffffff;
    }

    .hero-badge {
      display: inline-flex;
      width: fit-content;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.14);
      font-size: 12px;
      font-weight: 850;
      letter-spacing: .08em;
      text-transform: uppercase;
      backdrop-filter: blur(8px);
    }

    .hero h1 {
      margin: 16px 0 0;
      font-size: clamp(42px, 7vw, 82px);
      line-height: .96;
      letter-spacing: -.055em;
    }

    .hero p {
      max-width: 680px;
      margin: 18px 0 0;
      font-size: 17px;
      line-height: 1.65;
      color: rgba(255,255,255,.86);
    }

    .hero-meta {
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      color: rgba(255,255,255,.82);
      font-size: 13px;
      font-weight: 700;
    }

    .hero-actions {
      margin-top: 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .primary-button,
    .secondary-button {
      min-height: 46px;
      padding: 0 16px;
      border-radius: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .primary-button {
      border: 0;
      background: #ffffff;
      color: #111827;
    }

    .secondary-button {
      border: 1px solid rgba(255,255,255,.28);
      background: rgba(255,255,255,.12);
      color: #ffffff;
      backdrop-filter: blur(8px);
    }

    .hero-dots {
      position: absolute;
      right: 24px;
      bottom: 22px;
      z-index: 2;
      display: flex;
      gap: 8px;
    }

    .hero-dot {
      width: 9px;
      height: 9px;
      padding: 0;
      border: 0;
      border-radius: 999px;
      background: rgba(255,255,255,.42);
      cursor: pointer;
    }

    .hero-dot.active {
      width: 28px;
      background: #ffffff;
    }

    .add-panel {
      margin-bottom: 24px;
      padding: 18px;
      background: var(--dc-panel);
      border: 1px solid var(--dc-border);
      border-radius: 20px;
      box-shadow: 0 12px 30px var(--dc-shadow);
    }

    .add-panel h2 {
      margin: 0;
      font-size: 20px;
    }

    .add-panel p {
      margin: 6px 0 14px;
      color: var(--dc-muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .add-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.5fr) minmax(180px, .8fr) minmax(130px, .55fr) auto;
      gap: 10px;
    }

    .form-input,
    .search-input {
      min-width: 0;
      min-height: 46px;
      padding: 0 13px;
      border: 1px solid var(--dc-border);
      border-radius: 12px;
      background: var(--dc-page);
      color: var(--dc-text);
      outline: none;
    }

    .form-input:focus,
    .search-input:focus {
      border-color: var(--shows-accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--shows-accent) 16%, transparent);
    }

    .add-button {
      min-height: 46px;
      padding: 0 16px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--shows-accent), var(--shows-accent-2));
      color: #ffffff;
      font-weight: 800;
      cursor: pointer;
    }

    .add-status {
      min-height: 20px;
      margin: 10px 0 0;
      color: var(--dc-muted);
      font-size: 13px;
    }

    .add-status.error {
      color: var(--shows-danger);
    }

    .toolbar {
      margin-bottom: 18px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
    }

    .category-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .category-button {
      min-height: 42px;
      padding: 0 13px;
      border: 1px solid var(--dc-border);
      border-radius: 999px;
      background: var(--dc-panel);
      color: var(--dc-text);
      font-weight: 750;
      cursor: pointer;
    }

    .category-button.active {
      border-color: var(--shows-accent);
      color: var(--shows-accent);
      background: color-mix(in srgb, var(--shows-accent) 10%, var(--dc-panel));
    }

    .row-section {
      margin-top: 28px;
    }

    .row-header {
      margin-bottom: 12px;
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 14px;
    }

    .row-header h2 {
      margin: 0;
      font-size: 24px;
    }

    .row-header p {
      margin: 4px 0 0;
      color: var(--dc-muted);
      font-size: 13px;
    }

    .row-controls {
      display: flex;
      gap: 8px;
    }

    .row-button {
      width: 40px;
      height: 40px;
      border: 1px solid var(--dc-border);
      border-radius: 12px;
      background: var(--dc-panel);
      color: var(--dc-text);
      cursor: pointer;
    }

    .horizontal-row {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(230px, 280px);
      gap: 16px;
      overflow-x: auto;
      padding-bottom: 8px;
      scroll-behavior: smooth;
      scrollbar-width: thin;
    }

    .show-card {
      overflow: hidden;
      background: var(--dc-panel);
      border: 1px solid var(--dc-border);
      border-radius: 20px;
      box-shadow: 0 12px 30px var(--dc-shadow);
      transition: transform .2s ease, border-color .2s ease;
    }

    .show-card:hover {
      transform: translateY(-4px) scale(1.01);
      border-color: var(--shows-accent);
    }

    .poster {
      position: relative;
      aspect-ratio: 16 / 10;
      display: grid;
      place-items: center;
      background-size: cover;
      background-position: center;
      color: #ffffff;
      font-size: 56px;
    }

    .poster-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 5px 8px;
      border-radius: 999px;
      background: rgba(15,23,42,.76);
      color: #ffffff;
      font-size: 11px;
      font-weight: 800;
      backdrop-filter: blur(8px);
    }

    .progress-track {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 12px;
      height: 7px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255,255,255,.28);
    }

    .progress-fill {
      height: 100%;
      background: #ffffff;
      border-radius: inherit;
    }

    .show-copy {
      padding: 15px;
    }

    .show-title-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .show-copy h3 {
      margin: 0;
      font-size: 17px;
    }

    .rating {
      flex-shrink: 0;
      color: var(--shows-gold);
      font-size: 12px;
      font-weight: 850;
    }

    .show-meta {
      margin: 5px 0 0;
      color: var(--dc-muted);
      font-size: 12px;
    }

    .show-description {
      margin: 10px 0 0;
      min-height: 38px;
      color: var(--dc-muted);
      font-size: 12px;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .show-actions {
      margin-top: 12px;
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 8px;
    }

    .watch-button {
      min-height: 40px;
      border: 0;
      border-radius: 11px;
      background: linear-gradient(135deg, var(--shows-accent), var(--shows-accent-2));
      color: #ffffff;
      font-weight: 800;
      cursor: pointer;
    }

    .icon-button {
      width: 42px;
      height: 40px;
      border: 1px solid var(--dc-border);
      border-radius: 11px;
      background: var(--dc-panel);
      color: var(--dc-muted);
      font-size: 19px;
      cursor: pointer;
    }

    .icon-button.active {
      color: #ef4444;
    }

    .icon-button.delete {
      color: var(--shows-danger);
    }

    .empty-state {
      min-height: 180px;
      display: grid;
      place-items: center;
      color: var(--dc-muted);
      background: var(--dc-panel);
      border: 1px dashed var(--dc-border);
      border-radius: 18px;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 3000;
      display: none;
      place-items: center;
      padding: 20px;
      background: rgba(2,6,23,.82);
      backdrop-filter: blur(7px);
    }

    .modal-overlay.open {
      display: grid;
    }

    .player-modal {
      width: min(100%, 980px);
      overflow: hidden;
      background: var(--dc-panel);
      border: 1px solid var(--dc-border);
      border-radius: 24px;
      box-shadow: 0 24px 70px rgba(0,0,0,.42);
    }

    .player-frame {
      aspect-ratio: 16 / 9;
      background: #000000;
    }

    #youtube-player,
    #video-player {
      display: none;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000000;
    }

    .player-info {
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: center;
    }

    .player-info h2 {
      margin: 0;
    }

    .player-info p {
      margin: 6px 0 0;
      color: var(--dc-muted);
    }

    .close-button {
      width: 44px;
      height: 44px;
      border: 1px solid var(--dc-border);
      border-radius: 12px;
      background: var(--dc-panel);
      color: var(--dc-text);
      font-size: 24px;
      cursor: pointer;
    }

    @media (max-width: 1040px) {
      .add-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 820px) {
      .toolbar {
        grid-template-columns: 1fr;
      }

      .hero {
        min-height: 420px;
      }

      .hero-content {
        padding: 30px;
      }

      .horizontal-row {
        grid-auto-columns: minmax(220px, 72vw);
      }
    }

    @media (max-width: 560px) {
      .shows-page {
        width: min(100% - 14px, 1380px);
      }

      .hero {
        min-height: 390px;
      }

      .hero-content {
        padding: 24px 20px;
      }

      .hero-dots {
        right: 16px;
        bottom: 16px;
      }

      .add-grid {
        grid-template-columns: 1fr;
      }

      .row-controls {
        display: none;
      }
    }
  </style>
</head>

<body data-davidcraft-page="shows">
  <div id="davidcraft-navbar"></div>

  <main class="shows-page">
    <section id="hero" class="hero">
      <div class="hero-content">
        <span id="hero-badge" class="hero-badge">Featured</span>
        <h1 id="hero-title">Beyond Orbit</h1>
        <div id="hero-meta" class="hero-meta"></div>
        <p id="hero-description"></p>

        <div class="hero-actions">
          <button id="hero-watch" class="primary-button" type="button">▶ Watch Now</button>
          <button id="hero-favorite" class="secondary-button" type="button">♡ Add to Favorites</button>
        </div>
      </div>

      <div id="hero-dots" class="hero-dots"></div>
    </section>

    <section class="add-panel">
      <h2>Add a YouTube video</h2>
      <p>
        Paste a YouTube link and it will be added to the same V3 streaming library.
      </p>

      <div class="add-grid">
        <input id="youtube-url" class="form-input" type="url" placeholder="YouTube link">
        <input id="youtube-title" class="form-input" type="text" placeholder="Video title" maxlength="100">
        <input id="youtube-category" class="form-input" type="text" value="Kids" placeholder="Category" maxlength="40">
        <button id="add-youtube" class="add-button" type="button">Add Video</button>
      </div>

      <p id="add-status" class="add-status" aria-live="polite"></p>
    </section>

    <section class="toolbar">
      <input id="show-search" class="search-input" type="search" placeholder="Search shows, categories, or descriptions">
      <div id="category-buttons" class="category-buttons"></div>
    </section>

    <div id="rows-container"></div>
  </main>

  <footer class="dc-footer">DavidCraft Shows · V3</footer>

  <div id="player-overlay" class="modal-overlay" role="dialog" aria-modal="true">
    <section class="player-modal">
      <div class="player-frame">
        <iframe
          id="youtube-player"
          title="YouTube video player"
          allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen
        ></iframe>

        <video id="video-player" controls playsinline preload="metadata"></video>
      </div>

      <div class="player-info">
        <div>
          <h2 id="player-title">Show title</h2>
          <p id="player-meta">DavidCraft Shows V3</p>
        </div>

        <button id="close-player" class="close-button" type="button" aria-label="Close player">×</button>
      </div>
    </section>
  </div>

  <script>
    const LIBRARY_KEY = "davidcraft-shows-v3-library";
    const FAVORITES_KEY = "davidcraft-shows-v3-favorites";
    const PROGRESS_KEY = "davidcraft-shows-v3-progress";

    const starterShows = [
      {
        id: "beyond-orbit",
        kind: "video",
        title: "Beyond Orbit",
        category: "Adventure",
        rating: 4.9,
        icon: "🚀",
        color: "linear-gradient(145deg,#0f172a,#7c2d12 58%,#ef4444)",
        description: "A young crew travels beyond the known solar system and discovers a mysterious signal.",
        video: "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",
        type: "video/mp4",
        progress: 62,
        trending: true,
        recentlyAdded: false,
        recommended: true
      },
      {
        id: "wild-missouri",
        kind: "video",
        title: "Wild Missouri",
        category: "Science",
        rating: 4.8,
        icon: "🦌",
        color: "linear-gradient(145deg,#064e3b,#166534 58%,#84cc16)",
        description: "Explore rivers, forests, caves, and wildlife across Missouri.",
        video: "https://media.w3.org/2010/05/sintel/trailer.mp4",
        type: "video/mp4",
        progress: 34,
        trending: true,
        recentlyAdded: true,
        recommended: true
      },
      {
        id: "pixel-pals",
        kind: "video",
        title: "Pixel Pals",
        category: "Kids",
        rating: 4.6,
        icon: "👾",
        color: "linear-gradient(145deg,#581c87,#7e22ce 58%,#ec4899)",
        description: "A team of game characters solves puzzles in a digital world.",
        video: "https://media.w3.org/2010/05/bunny/trailer.mp4",
        type: "video/mp4",
        progress: 78,
        trending: false,
        recentlyAdded: false,
        recommended: true
      },
      {
        id: "lab-42",
        kind: "video",
        title: "Lab 42",
        category: "Science",
        rating: 4.7,
        icon: "🧪",
        color: "linear-gradient(145deg,#172554,#1d4ed8 58%,#06b6d4)",
        description: "Curious students investigate experiments and surprising scientific mysteries.",
        video: "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",
        type: "video/mp4",
        progress: 0,
        trending: true,
        recentlyAdded: true,
        recommended: false
      },
      {
        id: "weekend-chaos",
        kind: "video",
        title: "Weekend Chaos",
        category: "Comedy",
        rating: 4.5,
        icon: "😂",
        color: "linear-gradient(145deg,#78350f,#ea580c 58%,#facc15)",
        description: "A family weekend turns into one hilarious problem after another.",
        video: "https://media.w3.org/2010/05/bunny/trailer.mp4",
        type: "video/mp4",
        progress: 15,
        trending: true,
        recentlyAdded: false,
        recommended: true
      },
      {
        id: "deep-blue",
        kind: "video",
        title: "Deep Blue",
        category: "Science",
        rating: 4.9,
        icon: "🐋",
        color: "linear-gradient(145deg,#082f49,#0369a1 58%,#22d3ee)",
        description: "Journey into the deepest parts of the ocean.",
        video: "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",
        type: "video/mp4",
        progress: 0,
        trending: false,
        recentlyAdded: true,
        recommended: true
      }
    ];

    const hero = document.getElementById("hero");
    const heroBadge = document.getElementById("hero-badge");
    const heroTitle = document.getElementById("hero-title");
    const heroMeta = document.getElementById("hero-meta");
    const heroDescription = document.getElementById("hero-description");
    const heroWatch = document.getElementById("hero-watch");
    const heroFavorite = document.getElementById("hero-favorite");
    const heroDots = document.getElementById("hero-dots");

    const youtubeUrl = document.getElementById("youtube-url");
    const youtubeTitle = document.getElementById("youtube-title");
    const youtubeCategory = document.getElementById("youtube-category");
    const addYoutube = document.getElementById("add-youtube");
    const addStatus = document.getElementById("add-status");

    const showSearch = document.getElementById("show-search");
    const categoryButtons = document.getElementById("category-buttons");
    const rowsContainer = document.getElementById("rows-container");

    const playerOverlay = document.getElementById("player-overlay");
    const youtubePlayer = document.getElementById("youtube-player");
    const videoPlayer = document.getElementById("video-player");
    const playerTitle = document.getElementById("player-title");
    const playerMeta = document.getElementById("player-meta");
    const closePlayer = document.getElementById("close-player");

    let customShows = loadArray(LIBRARY_KEY);
    let favorites = loadArray(FAVORITES_KEY);
    let progress = loadObject(PROGRESS_KEY);
    let activeCategory = "All";
    let heroIndex = 0;
    let heroTimer = null;

    function loadArray(key) {
      try {
        const value = JSON.parse(localStorage.getItem(key));
        return Array.isArray(value) ? value : [];
      } catch {
        return [];
      }
    }

    function loadObject(key) {
      try {
        const value = JSON.parse(localStorage.getItem(key));
        return value && typeof value === "object" && !Array.isArray(value) ? value : {};
      } catch {
        return {};
      }
    }

    function saveState() {
      localStorage.setItem(LIBRARY_KEY, JSON.stringify(customShows));
      localStorage.setItem(FAVORITES_KEY, JSON.stringify(favorites));
      localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress));
    }

    function allShows() {
      return [...starterShows, ...customShows];
    }

    function getProgress(show) {
      return Number(progress[show.id] ?? show.progress ?? 0);
    }

    function extractYouTubeId(value) {
      try {
        const url = new URL(value.trim());
        const host = url.hostname.replace(/^www\./, "");

        if (host === "youtu.be") {
          return url.pathname.split("/").filter(Boolean)[0] || "";
        }

        if (["youtube.com", "m.youtube.com", "music.youtube.com"].includes(host)) {
          if (url.pathname === "/watch") {
            return url.searchParams.get("v") || "";
          }

          const parts = url.pathname.split("/").filter(Boolean);

          if (["embed", "shorts", "live"].includes(parts[0]) && parts[1]) {
            return parts[1];
          }
        }
      } catch {}

      return "";
    }

    function validYouTubeId(id) {
      return /^[A-Za-z0-9_-]{11}$/.test(id);
    }

    function setAddStatus(message, error = false) {
      addStatus.textContent = message;
      addStatus.className = error ? "add-status error" : "add-status";
    }

    function addYouTubeVideo() {
      const youtubeId = extractYouTubeId(youtubeUrl.value);
      const title = youtubeTitle.value.trim();
      const category = youtubeCategory.value.trim() || "YouTube";

      if (!validYouTubeId(youtubeId)) {
        setAddStatus("Enter a valid YouTube link.", true);
        return;
      }

      if (!title) {
        setAddStatus("Enter a title.", true);
        youtubeTitle.focus();
        return;
      }

      if (customShows.some((show) => show.youtubeId === youtubeId)) {
        setAddStatus("That video is already in the library.", true);
        return;
      }

      customShows.unshift({
        id: `youtube-${youtubeId}`,
        kind: "youtube",
        youtubeId,
        title,
        category,
        rating: 5.0,
        description: "Added from YouTube.",
        thumbnail: `https://img.youtube.com/vi/${youtubeId}/hqdefault.jpg`,
        progress: 0,
        trending: false,
        recentlyAdded: true,
        recommended: true
      });

      saveState();

      youtubeUrl.value = "";
      youtubeTitle.value = "";
      setAddStatus(`Added “${title}”.`);

      renderEverything();
    }

    function featuredShows() {
      const source = allShows().filter((show) => show.trending || show.recommended);
      return source.length ? source.slice(0, 5) : allShows().slice(0, 5);
    }

    function renderHero() {
      const featured = featuredShows();

      if (!featured.length) {
        return;
      }

      heroIndex = heroIndex % featured.length;
      const show = featured[heroIndex];

      if (show.thumbnail) {
        hero.style.backgroundImage =
          `linear-gradient(rgba(0,0,0,.08),rgba(0,0,0,.08)),url("${show.thumbnail}")`;
      } else {
        hero.style.backgroundImage = show.color;
      }

      heroBadge.textContent = show.kind === "youtube" ? "YouTube Feature" : "Featured Today";
      heroTitle.textContent = show.title;
      heroMeta.innerHTML =
        `<span>★ ${show.rating || "5.0"}</span>` +
        `<span>${show.category}</span>` +
        `<span>${show.kind === "youtube" ? "YouTube" : "DavidCraft"}</span>`;
      heroDescription.textContent = show.description;

      heroFavorite.textContent =
        favorites.includes(show.id)
          ? "♥ Remove Favorite"
          : "♡ Add to Favorites";

      heroWatch.onclick = () => openPlayer(show);

      heroFavorite.onclick = () => {
        toggleFavorite(show.id);
        renderHero();
      };

      heroDots.innerHTML = "";

      featured.forEach((item, index) => {
        const dot = document.createElement("button");
        dot.className = "hero-dot";
        dot.type = "button";
        dot.setAttribute("aria-label", `Show ${item.title}`);

        if (index === heroIndex) {
          dot.classList.add("active");
        }

        dot.addEventListener("click", () => {
          heroIndex = index;
          restartHeroTimer();
          renderHero();
        });

        heroDots.appendChild(dot);
      });
    }

    function restartHeroTimer() {
      if (heroTimer) {
        clearInterval(heroTimer);
      }

      heroTimer = setInterval(() => {
        const featured = featuredShows();

        if (featured.length > 1) {
          heroIndex = (heroIndex + 1) % featured.length;
          renderHero();
        }
      }, 6000);
    }

    function renderCategories() {
      const categories = [
        "All",
        "Favorites",
        ...new Set(allShows().map((show) => show.category))
      ];

      categoryButtons.innerHTML = "";

      categories.forEach((category) => {
        const button = document.createElement("button");
        button.className = "category-button";
        button.type = "button";
        button.textContent = category;

        if (category === activeCategory) {
          button.classList.add("active");
        }

        button.addEventListener("click", () => {
          activeCategory = category;
          renderCategories();
          renderRows();
        });

        categoryButtons.appendChild(button);
      });
    }

    function baseFilteredShows() {
      const query = showSearch.value.trim().toLowerCase();

      return allShows().filter((show) => {
        const categoryMatch =
          activeCategory === "All" ||
          show.category === activeCategory ||
          (activeCategory === "Favorites" && favorites.includes(show.id));

        const searchMatch =
          !query ||
          show.title.toLowerCase().includes(query) ||
          show.category.toLowerCase().includes(query) ||
          show.description.toLowerCase().includes(query);

        return categoryMatch && searchMatch;
      });
    }

    function createCard(show) {
      const card = document.createElement("article");
      card.className = "show-card";

      const poster = document.createElement("div");
      poster.className = "poster";

      if (show.thumbnail) {
        poster.style.backgroundImage =
          `linear-gradient(rgba(0,0,0,.08),rgba(0,0,0,.08)),url("${show.thumbnail}")`;
      } else {
        poster.style.background = show.color;
        poster.textContent = show.icon;
      }

      const badge = document.createElement("span");
      badge.className = "poster-badge";
      badge.textContent = show.kind === "youtube" ? "YouTube" : show.category;
      poster.appendChild(badge);

      const watched = getProgress(show);

      if (watched > 0 && watched < 100) {
        const track = document.createElement("div");
        track.className = "progress-track";

        const fill = document.createElement("div");
        fill.className = "progress-fill";
        fill.style.width = `${watched}%`;

        track.appendChild(fill);
        poster.appendChild(track);
      }

      const copy = document.createElement("div");
      copy.className = "show-copy";

      const titleRow = document.createElement("div");
      titleRow.className = "show-title-row";

      const title = document.createElement("h3");
      title.textContent = show.title;

      const rating = document.createElement("span");
      rating.className = "rating";
      rating.textContent = `★ ${show.rating || "5.0"}`;

      titleRow.append(title, rating);

      const meta = document.createElement("p");
      meta.className = "show-meta";
      meta.textContent =
        `${show.category}` +
        (watched > 0 ? ` · ${watched}% watched` : "");

      const description = document.createElement("p");
      description.className = "show-description";
      description.textContent = show.description;

      const actions = document.createElement("div");
      actions.className = "show-actions";

      const watch = document.createElement("button");
      watch.className = "watch-button";
      watch.type = "button";
      watch.textContent = watched > 0 ? "Continue" : "▶ Watch";
      watch.addEventListener("click", () => openPlayer(show));

      const favorite = document.createElement("button");
      favorite.className = "icon-button";
      favorite.type = "button";
      favorite.textContent = favorites.includes(show.id) ? "♥" : "♡";

      if (favorites.includes(show.id)) {
        favorite.classList.add("active");
      }

      favorite.addEventListener("click", () => toggleFavorite(show.id));

      actions.append(watch, favorite);

      if (show.kind === "youtube") {
        const remove = document.createElement("button");
        remove.className = "icon-button delete";
        remove.type = "button";
        remove.textContent = "×";
        remove.setAttribute("aria-label", `Delete ${show.title}`);

        remove.addEventListener("click", () => {
          customShows = customShows.filter((item) => item.id !== show.id);
          favorites = favorites.filter((id) => id !== show.id);
          delete progress[show.id];
          saveState();
          renderEverything();
        });

        actions.appendChild(remove);
      }

      copy.append(titleRow, meta, description, actions);
      card.append(poster, copy);

      return card;
    }

    function createRow(title, subtitle, items) {
      if (!items.length) {
        return null;
      }

      const section = document.createElement("section");
      section.className = "row-section";

      const header = document.createElement("div");
      header.className = "row-header";

      const copy = document.createElement("div");

      const heading = document.createElement("h2");
      heading.textContent = title;

      const description = document.createElement("p");
      description.textContent = subtitle;

      copy.append(heading, description);

      const controls = document.createElement("div");
      controls.className = "row-controls";

      const previous = document.createElement("button");
      previous.className = "row-button";
      previous.type = "button";
      previous.textContent = "←";

      const next = document.createElement("button");
      next.className = "row-button";
      next.type = "button";
      next.textContent = "→";

      controls.append(previous, next);
      header.append(copy, controls);

      const row = document.createElement("div");
      row.className = "horizontal-row";

      items.forEach((show) => {
        row.appendChild(createCard(show));
      });

      previous.addEventListener("click", () => {
        row.scrollBy({ left: -520, behavior: "smooth" });
      });

      next.addEventListener("click", () => {
        row.scrollBy({ left: 520, behavior: "smooth" });
      });

      section.append(header, row);
      return section;
    }

    function renderRows() {
      rowsContainer.innerHTML = "";

      const filtered = baseFilteredShows();

      if (!filtered.length) {
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.textContent = "No shows match this search or category.";
        rowsContainer.appendChild(empty);
        return;
      }

      const rows =
        activeCategory !== "All" || showSearch.value.trim()
          ? [
              createRow(
                activeCategory === "All" ? "Search Results" : activeCategory,
                "Shows matching the current view.",
                filtered
              )
            ]
          : [
              createRow(
                "Continue Watching",
                "Pick up where you left off.",
                filtered.filter((show) => {
                  const watched = getProgress(show);
                  return watched > 0 && watched < 100;
                })
              ),
              createRow(
                "Trending Now",
                "Popular across DavidCraft.",
                filtered.filter((show) => show.trending)
              ),
              createRow(
                "Recently Added",
                "New to the library.",
                filtered.filter((show) => show.recentlyAdded)
              ),
              createRow(
                "Recommended for You",
                "A personalized DavidCraft selection.",
                filtered.filter((show) => show.recommended)
              ),
              createRow(
                "All Shows",
                "Explore the full library.",
                filtered
              )
            ];

      rows.filter(Boolean).forEach((row) => {
        rowsContainer.appendChild(row);
      });
    }

    function toggleFavorite(showId) {
      favorites = favorites.includes(showId)
        ? favorites.filter((id) => id !== showId)
        : [...favorites, showId];

      saveState();
      renderRows();
      renderHero();
    }

    function openPlayer(show) {
      youtubePlayer.style.display = "none";
      videoPlayer.style.display = "none";
      youtubePlayer.src = "";
      videoPlayer.pause();
      videoPlayer.innerHTML = "";

      if (show.kind === "youtube") {
        youtubePlayer.src =
          `https://www.youtube-nocookie.com/embed/${show.youtubeId}?autoplay=1&rel=0`;
        youtubePlayer.style.display = "block";
      } else {
        const source = document.createElement("source");
        source.src = show.video;
        source.type = show.type || "video/mp4";
        videoPlayer.appendChild(source);
        videoPlayer.load();
        videoPlayer.style.display = "block";
        videoPlayer.play().catch(() => {});
      }

      playerTitle.textContent = show.title;
      playerMeta.textContent =
        show.kind === "youtube"
          ? `${show.category} · YouTube`
          : `${show.category} · DavidCraft player`;

      playerOverlay.classList.add("open");
      document.body.classList.add("dc-no-scroll");

      const current = getProgress(show);
      progress[show.id] = Math.min(100, Math.max(current + 10, 10));
      saveState();
      renderRows();
    }

    function closePlayerModal() {
      youtubePlayer.src = "";
      youtubePlayer.style.display = "none";

      videoPlayer.pause();
      videoPlayer.innerHTML = "";
      videoPlayer.load();
      videoPlayer.style.display = "none";

      playerOverlay.classList.remove("open");
      document.body.classList.remove("dc-no-scroll");
    }

    function renderEverything() {
      renderCategories();
      renderHero();
      renderRows();
      restartHeroTimer();
    }

    addYoutube.addEventListener("click", addYouTubeVideo);

    [youtubeUrl, youtubeTitle].forEach((input) => {
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          addYouTubeVideo();
        }
      });
    });

    showSearch.addEventListener("input", renderRows);

    closePlayer.addEventListener("click", closePlayerModal);

    playerOverlay.addEventListener("click", (event) => {
      if (event.target === playerOverlay) {
        closePlayerModal();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        closePlayerModal();
      }
    });

    renderEverything();
  </script>

  <script src="davidcraft.js"></script>
</body>
</html>
