<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Offline BookShelf</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      height: 100vh;
      overflow: hidden;
    }

    header {
      height: 64px;
      background: #1f2937;
      display: flex;
      align-items: center;
      padding: 0 20px;
      border-bottom: 1px solid #374151;
    }

    header h1 {
      margin: 0;
      font-size: 20px;
    }

    main {
      height: calc(100vh - 64px);
      display: grid;
      grid-template-columns: 250px 1fr;
    }

    /* SIDEBAR */

    aside {
      background: #0f172a;
      border-right: 1px solid #334155;
      padding: 15px;
      overflow-y: auto;
    }

    .section-title {
      color: #94a3b8;
      font-size: 12px;
      font-weight: bold;
      margin: 10px 8px;
      text-transform: uppercase;
    }

    .side-button {
      display: block;
      width: 100%;
      padding: 12px;
      margin-bottom: 8px;

      background: #1e293b;
      color: white;

      border: none;
      border-radius: 9px;

      text-align: left;
      text-decoration: none;

      font-weight: bold;
      cursor: pointer;
    }

    .side-button:hover {
      background: #334155;
    }

    .add-button {
      background: #2563eb;
      text-align: center;
    }

    .add-button:hover {
      background: #1d4ed8;
    }

    input[type="file"] {
      display: none;
    }

    /* BOOKS */

    .book {
      background: #1e293b;
      border: 1px solid #334155;

      border-radius: 9px;

      padding: 11px;

      margin-top: 8px;

      cursor: pointer;
    }

    .book:hover {
      background: #273449;
    }

    .book-title {
      font-weight: bold;
    }

    .book-author {
      color: #94a3b8;
      font-size: 12px;
      margin-top: 4px;
    }

    /* PDF AREA */

    .viewer {
      background: #475569;

      display: flex;
      flex-direction: column;

      min-width: 0;
    }

    .toolbar {
      height: 52px;

      background: #1e293b;

      display: flex;
      align-items: center;

      gap: 8px;

      padding: 8px 12px;
    }

    .toolbar button {
      border: none;
      border-radius: 7px;

      padding: 8px 12px;

      background: #475569;
      color: white;

      cursor: pointer;

      font-weight: bold;
    }

    .toolbar button:hover {
      background: #64748b;
    }

    #status {
      color: #cbd5e1;
      font-size: 12px;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #pdf {
      width: 100%;
      height: calc(100% - 52px);

      border: none;

      background: white;
    }

    .drop-zone {
      border: 2px dashed #475569;

      border-radius: 10px;

      padding: 12px;

      margin-top: 10px;

      text-align: center;

      color: #94a3b8;

      font-size: 12px;
    }

    .note {
      color: #64748b;

      font-size: 11px;

      line-height: 1.5;

      margin-top: 15px;
    }

    @media (max-width: 700px) {
      main {
        grid-template-columns: 190px 1fr;
      }

      aside {
        padding: 9px;
      }

      header h1 {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>📚 Offline BookShelf</h1>
</header>

<main>

  <!-- SIDEBAR -->

  <aside>

    <div class="section-title">
      Apps
    </div>

    <!-- THESE LINKS CONNECT TO YOUR OTHER GITHUB FILES -->

    <a
      class="side-button"
      href="browser.html"
    >
      🌐 Browser
    </a>

    <a
      class="side-button"
      href="shows-v3.html"
    >
      📺 Shows
    </a>

    <a
      class="side-button"
      href="dictionary.html"
    >
      📖 Dictionary
    </a>


    <div class="section-title" style="margin-top:22px;">
      PDF Library
    </div>

    <label class="side-button add-button">

      ＋ Add PDF files

      <input
        id="pdfFiles"
        type="file"
        accept="application/pdf"
        multiple
      >

    </label>


    <div id="books"></div>


    <div
      id="dropZone"
      class="drop-zone"
    >
      Drop PDF files here
    </div>


    <div class="note">

      Your PDFs are stored locally
      in your browser.

      <br><br>

      Suggested books:

      <br>

      Skylark

      <br>

      Caleb's Story

      <br>

      Sarah, Plain and Tall

      <br><br>

      You need to add your own
      authorized PDF copies.

    </div>

  </aside>


  <!-- PDF VIEWER -->

  <section class="viewer">

    <div class="toolbar">

      <button id="zoomOut">
        −
      </button>

      <button id="zoomIn">
        ＋
      </button>

      <button id="openPDF">
        Open
      </button>

      <span id="status">
        No PDF selected
      </span>

    </div>


    <iframe
      id="pdf"
      title="PDF Reader"
    ></iframe>

  </section>

</main>


<script>

const DATABASE_NAME = "OfflineBookShelf";

const STORE_NAME = "pdfs";

let database;

let currentPDF = null;

let currentURL = null;

let zoom = 1;


/* =========================
   DATABASE
========================= */

function openDatabase() {

  return new Promise((resolve, reject) => {

    const request =
      indexedDB.open(
        DATABASE_NAME,
        1
      );


    request.onupgradeneeded = function(event) {

      const db = event.target.result;

      if (!db.objectStoreNames.contains(STORE_NAME)) {

        db.createObjectStore(
          STORE_NAME,
          {
            keyPath: "id",
            autoIncrement: true
          }
        );

      }

    };


    request.onsuccess = function(event) {

      database = event.target.result;

      resolve();

    };


    request.onerror = function() {

      reject(request.error);

    };

  });

}


/* =========================
   GET BOOKS
========================= */

function getBooks() {

  return new Promise((resolve, reject) => {

    const transaction =
      database.transaction(
        STORE_NAME,
        "readonly"
      );

    const store =
      transaction.objectStore(
        STORE_NAME
      );

    const request =
      store.getAll();


    request.onsuccess = function() {

      resolve(request.result);

    };


    request.onerror = function() {

      reject(request.error);

    };

  });

}


/* =========================
   ADD PDF
========================= */

function addPDF(file) {

  return new Promise((resolve, reject) => {

    const transaction =
      database.transaction(
        STORE_NAME,
        "readwrite"
      );

    const store =
      transaction.objectStore(
        STORE_NAME
      );


    const request =
      store.add({

        name: file.name,

        data: file

      });


    request.onsuccess = function() {

      resolve();

    };


    request.onerror = function() {

      reject(request.error);

    };

  });

}


/* =========================
   ESCAPE TEXT
========================= */

function escapeHTML(text) {

  return text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================
   DISPLAY BOOKS
========================= */

async function displayBooks() {

  const container =
    document.getElementById("books");

  container.innerHTML = "";


  const books =
    await getBooks();


  books.forEach(function(book) {

    const element =
      document.createElement("div");

    element.className = "book";


    element.innerHTML = `

      <div class="book-title">
        📄 ${escapeHTML(book.name)}
      </div>

      <div class="book-author">
        Stored offline
      </div>

    `;


    element.onclick = function() {

      openBook(book);

    };


    container.appendChild(element);

  });

}


/* =========================
   OPEN BOOK
========================= */

function openBook(book) {

  currentPDF = book;


  if (currentURL) {

    URL.revokeObjectURL(
      currentURL
    );

  }


  currentURL =
    URL.createObjectURL(
      book.data
    );


  document.getElementById("pdf").src =
    currentURL;


  document.getElementById("status")
    .textContent =
    book.name;

}


/* =========================
   IMPORT FILES
========================= */

async function importFiles(files) {

  for (const file of files) {

    if (
      file.type === "application/pdf" ||
      file.name
        .toLowerCase()
        .endsWith(".pdf")
    ) {

      await addPDF(file);

    }

  }


  await displayBooks();


  const books =
    await getBooks();


  if (
    !currentPDF &&
    books.length > 0
  ) {

    openBook(
      books[0]
    );

  }

}


/* =========================
   FILE BUTTON
========================= */

document
  .getElementById("pdfFiles")
  .addEventListener(
    "change",
    function(event) {

      importFiles(
        Array.from(
          event.target.files
        )
      );

    }
  );


/* =========================
   DRAG & DROP
========================= */

const dropZone =
  document.getElementById(
    "dropZone"
  );


dropZone.addEventListener(
  "dragover",
  function(event) {

    event.preventDefault();

    dropZone.style.borderColor =
      "#60a5fa";

  }
);


dropZone.addEventListener(
  "dragleave",
  function() {

    dropZone.style.borderColor =
      "#475569";

  }
);


dropZone.addEventListener(
  "drop",
  function(event) {

    event.preventDefault();

    dropZone.style.borderColor =
      "#475569";


    importFiles(
      Array.from(
        event.dataTransfer.files
      )
    );

  }
);


/* =========================
   ZOOM
========================= */

document
  .getElementById("zoomIn")
  .onclick = function() {

    zoom =
      Math.min(
        2.5,
        zoom + 0.1
      );


    const frame =
      document.getElementById(
        "pdf"
      );


    frame.style.transform =
      "scale(" +
      zoom +
      ")";

    frame.style.transformOrigin =
      "top left";

  };


document
  .getElementById("zoomOut")
  .onclick = function() {

    zoom =
      Math.max(
        0.5,
        zoom - 0.1
      );


    const frame =
      document.getElementById(
        "pdf"
      );


    frame.style.transform =
      "scale(" +
      zoom +
      ")";

    frame.style.transformOrigin =
      "top left";

  };


/* =========================
   OPEN PDF IN NEW TAB
========================= */

document
  .getElementById("openPDF")
  .onclick = function() {

    if (currentURL) {

      window.open(
        currentURL,
        "_blank"
      );

    }

  };


/* =========================
   START APP
========================= */

async function startApp() {

  try {

    await openDatabase();

    await displayBooks();

  }

  catch (error) {

    console.error(error);

    alert(
      "The PDF library could not start."
    );

  }

}


startApp();

</script>

</body>
</html>
