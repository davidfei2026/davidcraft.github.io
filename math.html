<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Math Assistant — DavidCraft AI</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="chat.css">
</head>

<body>
  <header class="topbar">
    <a class="logo" href="index.html">
      DavidCraft <span>AI</span>
    </a>

    <div class="topbar-actions">
      <a class="back-link" href="index.html">← All assistants</a>
      <button id="theme-button" aria-label="Change color theme">◐</button>
    </div>
  </header>

  <main class="chat-page">
    <section class="chat-shell">
      <div class="chat-header">
        <div class="chat-avatar math-avatar">π</div>

        <div>
          <h1>Math Assistant</h1>
          <p>
            Ask about arithmetic, algebra, geometry, statistics,
            trigonometry, or calculus.
          </p>
        </div>
      </div>

      <div class="suggestions">
        <button type="button">Explain fractions</button>
        <button type="button">Solve 3x + 5 = 20</button>
        <button type="button">What is the Pythagorean theorem?</button>
        <button type="button">Explain derivatives simply</button>
      </div>

      <div id="messages" class="messages" aria-live="polite">
        <div class="message assistant">
          <div class="message-name">Math Assistant</div>
          <p>
            Hi! Send me a math problem and I’ll explain the steps clearly.
          </p>
        </div>
      </div>

      <form id="chat-form" class="chat-form">
        <label class="sr-only" for="message-input">
          Type your math question
        </label>

        <textarea
          id="message-input"
          rows="1"
          placeholder="Ask a math question..."
          required
        ></textarea>

        <button type="submit">Send</button>
      </form>
    </section>
  </main>

  <script src="script.js"></script>
  <script src="math.js"></script>
</body>
</html>
