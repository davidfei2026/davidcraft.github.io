<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Shows V1 — DavidCraft</title>

  <link rel="stylesheet" href="davidcraft.css">

  <style>
    :root {
      --shows-accent: #f97316;
      --shows-accent-2: #ef4444;
      --shows-gold: #f59e0b;
    }

    html[data-theme="dark"] {
      --shows-accent: #fb923c;
      --shows-accent-2: #f87171;
      --shows-gold: #fbbf24;
    }

    .shows-page {
      width: min(100% - 24px, 1320px);
      margin: 0 auto;
      padding: 26px 0 48px;
    }

    .hero {
      min-height: 320px;
      padding: 34px;
      margin-bottom: 22px;

      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 30px;
      align-items: center;

      overflow: hidden;

      background:
        radial-gradient(circle at 95% 10%, color-mix(in srgb, var(--shows-accent-2) 30%, transparent), transparent 20rem),
        radial-gradient(circle at 10% 100%, color-mix(in srgb, var(--shows-accent) 24%, transparent), transparent 26rem),
        var(--dc-panel);

      border: 1px solid var(--dc-border);
      border-radius: 26px;
      box-shadow: 0 14px 36px var(--dc-shadow);
    }

    .hero-badge {
      display: inline-flex;
      width: fit-content;
      padding: 7px 10px;

      border-radius: 999px;

      background: color-mix(in srgb, var(--shows-accent) 14%, var(--dc-panel));
      color: var(--shows-accent);

      font-size: 12px;
      font-weight: 850;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .hero h1 {
      margin: 16px 0 0;
      font-size: clamp(42px, 7vw, 76px);
      line-height: 1;
      letter-spacing: -0.055em;
    }

    .hero p {
      max-width: 680px;
      margin: 18px 0 0;

      color: var(--dc-muted);
      font-size: 17px;
      line-height: 1.65;
    }

    .hero-actions {
      margin-top: 24px;

      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .primary-button,
    .secondary-button {
      min-height: 46px;
      padding: 0 16px;

      border-radius: 12px;

      font-weight: 800;
      cursor: pointer;
    }

    .primary-button {
      border: 0;
      background: linear-gradient(135deg, var(--shows-accent), var(--shows-accent-2));
      color: #ffffff;
    }

    .secondary-button {
      border: 1px solid var(--dc-border);
      background: var(--dc-panel);
      color: var(--dc-text);
    }

    .hero-poster {
      width: 100%;
      aspect-ratio: 4 / 5;

      display: grid;
      place-items: center;

      border-radius: 24px;

      background: linear-gradient(145deg, #0f172a, #7c2d12 60%, #ef4444);
      color: #ffffff;

      font-size: 90px;
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.28);
    }

    .toolbar {
      margin-bottom: 18px;

      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
    }

    .search-input {
      width: 100%;
      min-height: 48px;
      padding: 0 14px;

      border: 1px solid var(--dc-border);
      border-radius: 13px;

      background: var(--dc-panel);
      color: var(--dc-text);
      outline: none;
    }

    .search-input:focus {
      border-color: var(--shows-accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--shows-accent) 16%, transparent);
    }

    .category-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .category-button {
      min-height: 42px;
      padding: 0 13px;

      border: 1px solid var(--dc-border);
      border-radius: 999px;

      background: var(--dc-panel);
      color: var(--dc-text);

      font-weight: 750;
      cursor: pointer;
    }

    .category-button:hover,
    .category-button.active {
      border-color: var(--shows-accent);
      color: var(--shows-accent);
      background: color-mix(in srgb, var(--shows-accent) 10%, var(--dc-panel));
    }

    .section {
      margin-top: 24px;
    }

    .section-header {
      margin-bottom: 13px;

      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: end;
    }

    .section-header h2 {
      margin: 0;
      font-size: 24px;
    }

    .section-header p {
      margin: 4px 0 0;
      color: var(--dc-muted);
      font-size: 13px;
    }

    .section-count {
      color: var(--dc-muted);
      font-size: 13px;
      font-weight: 750;
    }

    .shows-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
    }

    .show-card {
      overflow: hidden;

      background: var(--dc-panel);
      border: 1px solid var(--dc-border);
      border-radius: 20px;

      box-shadow: 0 12px 30px var(--dc-shadow);

      transition:
        transform 0.2s ease,
        border-color 0.2s ease;
    }

    .show-card:hover {
      transform: translateY(-4px);
      border-color: var(--shows-accent);
    }

    .poster {
      position: relative;

      aspect-ratio: 4 / 5;

      display: grid;
      place-items: center;

      color: #ffffff;
      font-size: 58px;
    }

    .poster-badge {
      position: absolute;
      top: 12px;
      left: 12px;

      padding: 6px 9px;

      border-radius: 999px;

      background: rgba(15, 23, 42, 0.72);
      color: #ffffff;

      font-size: 11px;
      font-weight: 800;
      backdrop-filter: blur(8px);
    }

    .progress-track {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 12px;

      height: 7px;

      overflow: hidden;
      border-radius: 999px;

      background: rgba(255, 255, 255, 0.28);
    }

    .progress-fill {
      height: 100%;
      border-radius: inherit;
      background: #ffffff;
    }

    .show-copy {
      padding: 16px;
    }

    .show-title-row {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      justify-content: space-between;
    }

    .show-copy h3 {
      margin: 0;
      font-size: 18px;
    }

    .rating {
      flex-shrink: 0;

      color: var(--shows-gold);
      font-size: 12px;
      font-weight: 850;
    }

    .show-meta {
      margin: 6px 0 0;
      color: var(--dc-muted);
      font-size: 12px;
    }

    .show-description {
      margin: 12px 0 0;

      color: var(--dc-muted);
      font-size: 13px;
      line-height: 1.5;

      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .show-actions {
      margin-top: 14px;

      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }

    .watch-button {
      min-height: 40px;

      border: 0;
      border-radius: 11px;

      background: linear-gradient(135deg, var(--shows-accent), var(--shows-accent-2));
      color: #ffffff;

      font-weight: 800;
      cursor: pointer;
    }

    .favorite-button {
      width: 42px;
      height: 40px;

      border: 1px solid var(--dc-border);
      border-radius: 11px;

      background: var(--dc-panel);
      color: var(--dc-muted);

      font-size: 20px;
      cursor: pointer;
    }

    .favorite-button.active {
      color: #ef4444;
    }

    .empty-state {
      padding: 48px 20px;

      grid-column: 1 / -1;

      text-align: center;
      color: var(--dc-muted);

      background: var(--dc-panel);
      border: 1px dashed var(--dc-border);
      border-radius: 18px;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 3000;

      display: none;
      place-items: center;
      padding: 20px;

      background: rgba(2, 6, 23, 0.72);
      backdrop-filter: blur(7px);
    }

    .modal-overlay.open {
      display: grid;
    }

    .player-modal {
      width: min(100%, 900px);
      overflow: hidden;

      background: var(--dc-panel);
      border: 1px solid var(--dc-border);
      border-radius: 24px;

      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.36);
    }

    .player-screen {
      min-height: 430px;

      display: grid;
      place-items: center;

      color: #ffffff;
      font-size: 110px;
    }

    .player-info {
      padding: 20px;

      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: center;
    }

    .player-info h2 {
      margin: 0;
    }

    .player-info p {
      margin: 6px 0 0;
      color: var(--dc-muted);
    }

    .close-button {
      width: 44px;
      height: 44px;

      border: 1px solid var(--dc-border);
      border-radius: 12px;

      background: var(--dc-panel);
      color: var(--dc-text);

      font-size: 24px;
      cursor: pointer;
    }

    @media (max-width: 1020px) {
      .shows-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 820px) {
      .hero {
        grid-template-columns: 1fr;
      }

      .hero-poster {
        display: none;
      }

      .toolbar {
        grid-template-columns: 1fr;
      }

      .shows-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 560px) {
      .shows-page {
        width: min(100% - 14px, 1320px);
      }

      .hero {
        padding: 24px 20px;
      }

      .shows-grid {
        grid-template-columns: 1fr;
      }

      .player-screen {
        min-height: 290px;
      }

      .player-info {
        align-items: flex-start;
      }
    }
  </style>
</head>

<body data-davidcraft-page="shows">
  <div id="davidcraft-navbar"></div>

  <main class="shows-page">
    <section class="hero">
      <div>
        <span class="hero-badge">Featured Today</span>

        <h1>Stories worth watching.</h1>

        <p>
          Browse original DavidCraft demo shows, save favorites, continue where
          you left off, search the library, and explore categories.
        </p>

        <div class="hero-actions">
          <button id="featured-watch" class="primary-button" type="button">
            ▶ Watch Featured
          </button>

          <button id="featured-favorite" class="secondary-button" type="button">
            ♡ Add to Favorites
          </button>
        </div>
      </div>

      <div class="hero-poster" aria-hidden="true">🚀</div>
    </section>

    <section class="toolbar">
      <input
        id="show-search"
        class="search-input"
        type="search"
        placeholder="Search shows, genres, or descriptions"
      >

      <div class="category-buttons">
        <button class="category-button active" type="button" data-category="all">All</button>
        <button class="category-button" type="button" data-category="favorites">Favorites</button>
        <button class="category-button" type="button" data-category="continue">Continue Watching</button>
        <button class="category-button" type="button" data-category="adventure">Adventure</button>
        <button class="category-button" type="button" data-category="science">Science</button>
        <button class="category-button" type="button" data-category="comedy">Comedy</button>
        <button class="category-button" type="button" data-category="kids">Kids</button>
      </div>
    </section>

    <section class="section">
      <div class="section-header">
        <div>
          <h2 id="section-title">All Shows</h2>
          <p id="section-subtitle">Explore the DavidCraft library.</p>
        </div>

        <span id="show-count" class="section-count">0 shows</span>
      </div>

      <div id="shows-grid" class="shows-grid"></div>
    </section>
  </main>

  <footer class="dc-footer">
    DavidCraft Shows · V1
  </footer>

  <div id="player-overlay" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="player-title">
    <section class="player-modal">
      <div id="player-screen" class="player-screen">▶</div>

      <div class="player-info">
        <div>
          <h2 id="player-title">Show title</h2>
          <p id="player-meta">Demo player</p>
        </div>

        <button id="close-player" class="close-button" type="button" aria-label="Close player">
          ×
        </button>
      </div>
    </section>
  </div>

  <script>
    const FAVORITES_KEY = "davidcraft-show-favorites-v1";
    const PROGRESS_KEY = "davidcraft-show-progress-v1";

    const shows = [
      {
        id: "beyond-orbit",
        title: "Beyond Orbit",
        genre: "adventure",
        genreLabel: "Adventure",
        year: 2026,
        rating: 4.9,
        icon: "🚀",
        color: "linear-gradient(145deg, #0f172a, #7c2d12 58%, #ef4444)",
        description: "A young crew travels beyond the known solar system and discovers a mysterious signal.",
        progress: 62
      },
      {
        id: "wild-missouri",
        title: "Wild Missouri",
        genre: "science",
        genreLabel: "Nature",
        year: 2026,
        rating: 4.8,
        icon: "🦌",
        color: "linear-gradient(145deg, #064e3b, #166534 58%, #84cc16)",
        description: "Explore rivers, forests, caves, and wildlife across Missouri through every season.",
        progress: 34
      },
      {
        id: "lab-42",
        title: "Lab 42",
        genre: "science",
        genreLabel: "Science",
        year: 2026,
        rating: 4.7,
        icon: "🧪",
        color: "linear-gradient(145deg, #172554, #1d4ed8 58%, #06b6d4)",
        description: "Curious students investigate unusual experiments and learn how science really works.",
        progress: 0
      },
      {
        id: "pixel-pals",
        title: "Pixel Pals",
        genre: "kids",
        genreLabel: "Kids",
        year: 2026,
        rating: 4.6,
        icon: "👾",
        color: "linear-gradient(145deg, #581c87, #7e22ce 58%, #ec4899)",
        description: "A team of game characters solves puzzles inside an ever-changing digital world.",
        progress: 78
      },
      {
        id: "weekend-chaos",
        title: "Weekend Chaos",
        genre: "comedy",
        genreLabel: "Comedy",
        year: 2026,
        rating: 4.5,
        icon: "😂",
        color: "linear-gradient(145deg, #78350f, #ea580c 58%, #facc15)",
        description: "One family, one weekend, and an endless chain of hilariously unexpected problems.",
        progress: 15
      },
      {
        id: "deep-blue",
        title: "Deep Blue",
        genre: "science",
        genreLabel: "Ocean",
        year: 2026,
        rating: 4.9,
        icon: "🐋",
        color: "linear-gradient(145deg, #082f49, #0369a1 58%, #22d3ee)",
        description: "Journey into the deepest parts of the ocean and meet creatures rarely seen by humans.",
        progress: 0
      },
      {
        id: "trail-seekers",
        title: "Trail Seekers",
        genre: "adventure",
        genreLabel: "Adventure",
        year: 2026,
        rating: 4.7,
        icon: "🥾",
        color: "linear-gradient(145deg, #422006, #92400e 58%, #22c55e)",
        description: "Friends travel across national parks, tackling trails and learning outdoor skills.",
        progress: 47
      },
      {
        id: "tiny-inventors",
        title: "Tiny Inventors",
        genre: "kids",
        genreLabel: "Kids",
        year: 2026,
        rating: 4.8,
        icon: "⚙️",
        color: "linear-gradient(145deg, #312e81, #4f46e5 58%, #a78bfa)",
        description: "Young inventors build creative machines to solve everyday problems in surprising ways.",
        progress: 0
      }
    ];

    const showsGrid = document.getElementById("shows-grid");
    const showSearch = document.getElementById("show-search");
    const sectionTitle = document.getElementById("section-title");
    const sectionSubtitle = document.getElementById("section-subtitle");
    const showCount = document.getElementById("show-count");

    const playerOverlay = document.getElementById("player-overlay");
    const playerScreen = document.getElementById("player-screen");
    const playerTitle = document.getElementById("player-title");
    const playerMeta = document.getElementById("player-meta");
    const closePlayer = document.getElementById("close-player");

    const featuredWatch = document.getElementById("featured-watch");
    const featuredFavorite = document.getElementById("featured-favorite");

    let activeCategory = "all";
    let favorites = loadArray(FAVORITES_KEY);
    let progress = loadObject(PROGRESS_KEY);

    function loadArray(key) {
      try {
        const value = JSON.parse(localStorage.getItem(key));
        return Array.isArray(value) ? value : [];
      } catch {
        return [];
      }
    }

    function loadObject(key) {
      try {
        const value = JSON.parse(localStorage.getItem(key));
        return value && typeof value === "object" && !Array.isArray(value)
          ? value
          : {};
      } catch {
        return {};
      }
    }

    function saveState() {
      localStorage.setItem(FAVORITES_KEY, JSON.stringify(favorites));
      localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress));
    }

    function getProgress(show) {
      return Number(progress[show.id] ?? show.progress ?? 0);
    }

    function toggleFavorite(showId) {
      if (favorites.includes(showId)) {
        favorites = favorites.filter((id) => id !== showId);
      } else {
        favorites.push(showId);
      }

      saveState();
      renderShows();
      updateFeaturedFavorite();
    }

    function filteredShows() {
      const query = showSearch.value.trim().toLowerCase();

      return shows.filter((show) => {
        const showProgress = getProgress(show);

        const matchesCategory =
          activeCategory === "all" ||
          activeCategory === show.genre ||
          (activeCategory === "favorites" && favorites.includes(show.id)) ||
          (activeCategory === "continue" && showProgress > 0 && showProgress < 100);

        const matchesSearch =
          !query ||
          show.title.toLowerCase().includes(query) ||
          show.genreLabel.toLowerCase().includes(query) ||
          show.description.toLowerCase().includes(query);

        return matchesCategory && matchesSearch;
      });
    }

    function renderShows() {
      const visibleShows = filteredShows();

      showsGrid.innerHTML = "";
      showCount.textContent =
        `${visibleShows.length} ${visibleShows.length === 1 ? "show" : "shows"}`;

      if (!visibleShows.length) {
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.textContent = "No shows match this search or category.";
        showsGrid.appendChild(empty);
        return;
      }

      visibleShows.forEach((show) => {
        const card = document.createElement("article");
        card.className = "show-card";

        const poster = document.createElement("div");
        poster.className = "poster";
        poster.style.background = show.color;
        poster.textContent = show.icon;

        const badge = document.createElement("span");
        badge.className = "poster-badge";
        badge.textContent = show.genreLabel;
        poster.appendChild(badge);

        const showProgress = getProgress(show);

        if (showProgress > 0 && showProgress < 100) {
          const track = document.createElement("div");
          track.className = "progress-track";

          const fill = document.createElement("div");
          fill.className = "progress-fill";
          fill.style.width = `${showProgress}%`;

          track.appendChild(fill);
          poster.appendChild(track);
        }

        const copy = document.createElement("div");
        copy.className = "show-copy";

        const titleRow = document.createElement("div");
        titleRow.className = "show-title-row";

        const title = document.createElement("h3");
        title.textContent = show.title;

        const rating = document.createElement("span");
        rating.className = "rating";
        rating.textContent = `★ ${show.rating}`;

        titleRow.append(title, rating);

        const meta = document.createElement("p");
        meta.className = "show-meta";
        meta.textContent =
          `${show.genreLabel} · ${show.year}` +
          (showProgress > 0 ? ` · ${showProgress}% watched` : "");

        const description = document.createElement("p");
        description.className = "show-description";
        description.textContent = show.description;

        const actions = document.createElement("div");
        actions.className = "show-actions";

        const watch = document.createElement("button");
        watch.className = "watch-button";
        watch.type = "button";
        watch.textContent = showProgress > 0 ? "Continue" : "Watch";

        watch.addEventListener("click", () => {
          openPlayer(show);
        });

        const favorite = document.createElement("button");
        favorite.className = "favorite-button";
        favorite.type = "button";
        favorite.textContent = favorites.includes(show.id) ? "♥" : "♡";

        if (favorites.includes(show.id)) {
          favorite.classList.add("active");
        }

        favorite.addEventListener("click", () => {
          toggleFavorite(show.id);
        });

        actions.append(watch, favorite);
        copy.append(titleRow, meta, description, actions);
        card.append(poster, copy);
        showsGrid.appendChild(card);
      });
    }

    function openPlayer(show) {
      const current = getProgress(show);

      playerScreen.style.background = show.color;
      playerScreen.textContent = show.icon;
      playerTitle.textContent = show.title;
      playerMeta.textContent =
        `${show.genreLabel} · Demo player · Starting at ${current}%`;

      playerOverlay.classList.add("open");
      document.body.classList.add("dc-no-scroll");

      progress[show.id] = Math.min(100, Math.max(current, current + 10));
      saveState();
      renderShows();
    }

    function closePlayerModal() {
      playerOverlay.classList.remove("open");
      document.body.classList.remove("dc-no-scroll");
    }

    function updateFeaturedFavorite() {
      const featured = shows[0];
      const active = favorites.includes(featured.id);

      featuredFavorite.textContent =
        active ? "♥ Remove Favorite" : "♡ Add to Favorites";
    }

    const categoryText = {
      all: ["All Shows", "Explore the DavidCraft library."],
      favorites: ["Favorites", "Shows you saved."],
      continue: ["Continue Watching", "Pick up where you left off."],
      adventure: ["Adventure", "Explore exciting worlds and journeys."],
      science: ["Science", "Discover nature, experiments, and the universe."],
      comedy: ["Comedy", "Lighthearted shows for a good laugh."],
      kids: ["Kids", "Fun and family-friendly shows."]
    };

    document
      .querySelectorAll(".category-button")
      .forEach((button) => {
        button.addEventListener("click", () => {
          document
            .querySelectorAll(".category-button")
            .forEach((item) => item.classList.remove("active"));

          button.classList.add("active");
          activeCategory = button.dataset.category;

          sectionTitle.textContent = categoryText[activeCategory][0];
          sectionSubtitle.textContent = categoryText[activeCategory][1];

          renderShows();
        });
      });

    showSearch.addEventListener("input", renderShows);

    featuredWatch.addEventListener("click", () => {
      openPlayer(shows[0]);
    });

    featuredFavorite.addEventListener("click", () => {
      toggleFavorite(shows[0].id);
    });

    closePlayer.addEventListener("click", closePlayerModal);

    playerOverlay.addEventListener("click", (event) => {
      if (event.target === playerOverlay) {
        closePlayerModal();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        closePlayerModal();
      }
    });

    updateFeaturedFavorite();
    renderShows();
  </script>
