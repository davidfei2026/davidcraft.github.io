<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Weather Platform</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #eef6ff;
    color: #172033;
}

header {
    background: linear-gradient(135deg, #1976d2, #42a5f5);
    color: white;
    padding: 30px 20px;
    text-align: center;
}

header h1 {
    margin: 0 0 20px;
    font-size: 32px;
}

.search {
    display: flex;
    max-width: 650px;
    margin: auto;
    gap: 10px;
}

.search input {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    outline: none;
}

.search button {
    padding: 14px 22px;
    border: none;
    border-radius: 10px;
    background: white;
    color: #1976d2;
    font-weight: bold;
    cursor: pointer;
}

.search button:hover {
    background: #e3f2fd;
}

main {
    max-width: 1100px;
    margin: 30px auto;
    padding: 0 20px;
}

section {
    margin-bottom: 35px;
}

.current-weather {
    background: white;
    border-radius: 22px;
    padding: 30px;
    text-align: center;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

.current-weather h2 {
    margin-top: 0;
    font-size: 28px;
}

.temperature {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
}

#temperature {
    font-size: 75px;
    font-weight: bold;
}

#weatherIcon {
    font-size: 60px;
}

#condition {
    font-size: 21px;
    font-weight: bold;
}

#feelsLike {
    color: #667085;
}

.weather-details {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-top: 25px;
}

.weather-details div {
    background: #f3f8ff;
    padding: 20px;
    border-radius: 15px;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.weather-details strong {
    font-size: 28px;
}

.weather-details span {
    color: #667085;
}

.weather-details b {
    font-size: 19px;
}

section > h2 {
    margin-bottom: 15px;
}

.forecast {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
}

.forecast-card {
    background: white;
    padding: 18px;
    border-radius: 16px;
    text-align: center;
    box-shadow: 0 3px 12px rgba(0,0,0,0.06);
    transition: transform 0.2s;
}

.forecast-card:hover {
    transform: translateY(-4px);
}

.forecast-card .day {
    font-size: 18px;
    font-weight: bold;
}

.forecast-card small {
    color: #667085;
}

.forecast-card .icon {
    font-size: 38px;
    margin: 12px 0;
}

.forecast-card .temps {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 8px;
}

#radarMap {
    width: 100%;
    height: 500px;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 5px 20px rgba(0,0,0,0.12);
}

.status {
    text-align: center;
    padding: 20px;
    color: #667085;
}

footer {
    text-align: center;
    padding: 30px;
    color: #667085;
}

@media (max-width: 600px) {

    header h1 {
        font-size: 25px;
    }

    .search {
        flex-direction: column;
    }

    .search button {
        width: 100%;
    }

    .weather-details {
        grid-template-columns: 1fr;
    }

    #temperature {
        font-size: 55px;
    }

    #radarMap {
        height: 400px;
    }

}

</style>
</head>

<body>

<header>

    <h1>🌦️ Weather Platform</h1>

    <div class="search">

        <input
            id="locationInput"
            type="text"
            placeholder="Search for a city..."
        >

        <button onclick="searchWeather()">
            Search
        </button>

    </div>

</header>


<main>

<section class="current-weather">

    <h2 id="location">
        Loading...
    </h2>

    <div class="temperature">

        <span id="temperature">
            --°
        </span>

        <span id="weatherIcon">
            🌤️
        </span>

    </div>

    <p id="condition">
        Loading weather...
    </p>

    <p id="feelsLike">
        Feels like --°
    </p>


    <div class="weather-details">

        <div>

            <strong>💧</strong>

            <span>
                Humidity
            </span>

            <b id="humidity">
                --%
            </b>

        </div>


        <div>

            <strong>💨</strong>

            <span>
                Wind
            </span>

            <b id="wind">
                -- mph
            </b>

        </div>


        <div>

            <strong>🌧️</strong>

            <span>
                Precipitation
            </span>

            <b id="rain">
                -- mm
            </b>

        </div>

    </div>

</section>


<section>

    <h2>
        📅 Forecast
    </h2>

    <div id="forecast" class="forecast">

        <div class="status">
            Loading forecast...
        </div>

    </div>

</section>


<section>

    <h2>
        🗺️ Weather Radar
    </h2>

    <div id="radarMap"></div>

</section>

</main>


<footer>

    <p>
        Weather Platform
    </p>

</footer>


<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

let radarMap;
let locationMarker;


/* =========================
   WEATHER
========================= */

async function searchWeather() {

    const input =
        document.getElementById("locationInput");

    const city =
        input.value.trim();

    if (!city) {

        alert("Please enter a city.");

        return;

    }


    const forecast =
        document.getElementById("forecast");

    forecast.innerHTML = `
        <div class="status">
            Loading weather...
        </div>
    `;


    try {

        /*
         Find city coordinates
        */

        const geoResponse =
            await fetch(
                "https://geocoding-api.open-meteo.com/v1/search" +
                "?name=" +
                encodeURIComponent(city) +
                "&count=1" +
                "&language=en" +
                "&format=json"
            );


        if (!geoResponse.ok) {

            throw new Error(
                "Location search failed"
            );

        }


        const geoData =
            await geoResponse.json();


        if (
            !geoData.results ||
            geoData.results.length === 0
        ) {

            throw new Error(
                "City not found"
            );

        }


        const place =
            geoData.results[0];


        const latitude =
            place.latitude;

        const longitude =
            place.longitude;


        document.getElementById(
            "location"
        ).textContent =
            `${place.name}, ${place.country}`;


        /*
         Weather API
        */

        const weatherURL =
            "https://api.open-meteo.com/v1/forecast" +

            `?latitude=${latitude}` +

            `&longitude=${longitude}` +

            "&current=" +
            "temperature_2m," +
            "relative_humidity_2m," +
            "apparent_temperature," +
            "precipitation," +
            "weather_code," +
            "wind_speed_10m" +

            "&daily=" +
            "weather_code," +
            "temperature_2m_max," +
            "temperature_2m_min," +
            "precipitation_probability_max" +

            "&temperature_unit=fahrenheit" +

            "&wind_speed_unit=mph" +

            "&forecast_days=16" +

            "&timezone=auto";


        const weatherResponse =
            await fetch(weatherURL);


        if (!weatherResponse.ok) {

            throw new Error(
                "Weather request failed"
            );

        }


        const weather =
            await weatherResponse.json();


        /*
         Current weather
        */

        const current =
            weather.current;


        document.getElementById(
            "temperature"
        ).textContent =
            `${Math.round(
                current.temperature_2m
            )}°`;


        document.getElementById(
            "feelsLike"
        ).textContent =
            `Feels like ${Math.round(
                current.apparent_temperature
            )}°`;


        document.getElementById(
            "humidity"
        ).textContent =
            `${current.relative_humidity_2m}%`;


        document.getElementById(
            "wind"
        ).textContent =
            `${Math.round(
                current.wind_speed_10m
            )} mph`;


        document.getElementById(
            "rain"
        ).textContent =
            `${current.precipitation} mm`;


        document.getElementById(
            "condition"
        ).textContent =
            getWeatherDescription(
                current.weather_code
            );


        document.getElementById(
            "weatherIcon"
        ).textContent =
            getWeatherIcon(
                current.weather_code
            );


        /*
         Forecast
        */

        forecast.innerHTML = "";


        for (
            let i = 0;
            i < weather.daily.time.length;
            i++
        ) {

            const date =
                new Date(
                    weather.daily.time[i] +
                    "T12:00:00"
                );


            const dayName =
                date.toLocaleDateString(
                    "en-US",
                    {
                        weekday: "short"
                    }
                );


            const monthDay =
                date.toLocaleDateString(
                    "en-US",
                    {
                        month: "short",
                        day: "numeric"
                    }
                );


            const maxTemp =
                Math.round(
                    weather.daily
                    .temperature_2m_max[i]
                );


            const minTemp =
                Math.round(
                    weather.daily
                    .temperature_2m_min[i]
                );


            const rainChance =
                weather.daily
                .precipitation_probability_max[i]
                ?? 0;


            const icon =
                getWeatherIcon(
                    weather.daily
                    .weather_code[i]
                );


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "forecast-card";


            card.innerHTML = `

                <div class="day">
                    ${dayName}
                </div>

                <small>
                    ${monthDay}
                </small>

                <div class="icon">
                    ${icon}
                </div>

                <div class="temps">
                    ${maxTemp}° / ${minTemp}°
                </div>

                <div>
                    🌧️ ${rainChance}%
                </div>

            `;


            forecast.appendChild(card);

        }


        /*
         Move radar to location
        */

        if (radarMap) {

            radarMap.setView(
                [latitude, longitude],
                7
            );


            if (locationMarker) {

                locationMarker.remove();

            }


            locationMarker =
                L.marker([
                    latitude,
                    longitude
                ])
                .addTo(radarMap)
                .bindPopup(
                    `<b>${place.name}</b>`
                )
                .openPopup();

        }


    } catch (error) {

        console.error(error);


        document.getElementById(
            "location"
        ).textContent =
            "Weather Platform";


        forecast.innerHTML = `

            <div class="status">

                ❌ Unable to load weather.

                <br><br>

                Try searching for another city.

            </div>

        `;

    }

}


/* =========================
   WEATHER DESCRIPTIONS
========================= */

function getWeatherDescription(code) {

    if (code === 0)
        return "Clear sky";

    if (code <= 3)
        return "Partly cloudy";

    if (code <= 48)
        return "Foggy";

    if (code <= 57)
        return "Drizzle";

    if (code <= 67)
        return "Rain";

    if (code <= 77)
        return "Snow";

    if (code <= 82)
        return "Rain showers";

    if (code <= 86)
        return "Snow showers";

    if (code >= 95)
        return "Thunderstorm";

    return "Unknown";

}


/* =========================
   WEATHER ICONS
========================= */

function getWeatherIcon(code) {

    if (code === 0)
        return "☀️";

    if (code <= 3)
        return "🌤️";

    if (code <= 48)
        return "🌫️";

    if (code <= 57)
        return "🌦️";

    if (code <= 67)
        return "🌧️";

    if (code <= 77)
        return "❄️";

    if (code <= 82)
        return "🌦️";

    if (code <= 86)
        return "🌨️";

    if (code >= 95)
        return "⛈️";

    return "🌡️";

}


/* =========================
   RADAR MAP
========================= */

function createRadar() {

    radarMap =
        L.map(
            "radarMap"
        ).setView(
            [25.7617, -80.1918],
            7
        );


    /*
     OpenStreetMap base map
    */

    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom: 19,

            attribution:
                "&copy; OpenStreetMap contributors"
        }
    ).addTo(radarMap);


    /*
     Miami marker
    */

    locationMarker =
        L.marker([
            25.7617,
            -80.1918
        ])
        .addTo(radarMap)
        .bindPopup(
            "<b>Miami, Florida</b>"
        );


}


/* =========================
   START WEBSITE
========================= */

createRadar();


window.addEventListener(
    "load",
    function() {

        document.getElementById(
            "locationInput"
        ).value = "Miami";

        searchWeather();

    }
);

</script>

</body>
</html>
