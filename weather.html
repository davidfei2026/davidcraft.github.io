<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather Platform</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef6ff;
            color: #172033;
        }

        header {
            background: linear-gradient(135deg, #1976d2, #42a5f5);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 20px;
            font-size: 32px;
        }

        .search {
            display: flex;
            max-width: 600px;
            margin: auto;
            gap: 10px;
        }

        .search input {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        .search button {
            padding: 14px 20px;
            border: none;
            border-radius: 10px;
            background: white;
            color: #1976d2;
            font-weight: bold;
            cursor: pointer;
        }

        .search button:hover {
            background: #e3f2fd;
        }

        main {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }

        section {
            margin-bottom: 30px;
        }

        .current-weather {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .current-weather h2 {
            margin-top: 0;
            font-size: 26px;
        }

        .temperature {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        #temperature {
            font-size: 70px;
            font-weight: bold;
        }

        #weatherIcon {
            font-size: 55px;
        }

        #condition {
            font-size: 20px;
        }

        .weather-details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 25px;
        }

        .weather-details div {
            background: #f3f8ff;
            padding: 18px;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .weather-details strong {
            font-size: 25px;
        }

        .weather-details span {
            color: #667085;
        }

        .weather-details b {
            font-size: 18px;
        }

        section > h2 {
            margin-bottom: 15px;
        }

        .forecast {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
        }

        .forecast-card {
            background: white;
            padding: 18px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
        }

        .forecast-card .day {
            font-weight: bold;
        }

        .forecast-card .icon {
            font-size: 35px;
            margin: 10px 0;
        }

        .forecast-card .temps {
            font-weight: bold;
        }

        .radar {
            height: 450px;
            background: #172033;
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .radar-placeholder {
            text-align: center;
        }

        .radar-circle {
            font-size: 70px;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #667085;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 25px;
            }

            .search {
                flex-direction: column;
            }

            .search button {
                width: 100%;
            }

            .weather-details {
                grid-template-columns: 1fr;
            }

            #temperature {
                font-size: 55px;
            }

            .radar {
                height: 350px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>🌦️ Weather Platform</h1>

        <div class="search">
            <input
                id="locationInput"
                type="text"
                placeholder="Search for a city..."
            >

            <button onclick="searchWeather()">
                Search
            </button>
        </div>
    </header>

    <main>

        <section class="current-weather">

            <h2 id="location">Miami, FL</h2>

            <div class="temperature">
                <span id="temperature">--°</span>
                <span id="weatherIcon">☀️</span>
            </div>

            <p id="condition">Weather Platform</p>
            <p id="feelsLike">Feels like --°</p>

            <div class="weather-details">

                <div>
                    <strong>💧</strong>
                    <span>Humidity</span>
                    <b id="humidity">--%</b>
                </div>

                <div>
                    <strong>💨</strong>
                    <span>Wind</span>
                    <b id="wind">-- mph</b>
                </div>

                <div>
                    <strong>🌧️</strong>
                    <span>Rain</span>
                    <b id="rain">--%</b>
                </div>

            </div>

        </section>


        <section>

            <h2>📅 20-Day Forecast</h2>

            <div id="forecast" class="forecast">

                <div class="forecast-card">
                    <div class="day">Today</div>
                    <div class="icon">☀️</div>
                    <div class="temps">--° / --°</div>
                </div>

                <div class="forecast-card">
                    <div class="day">Tomorrow</div>
                    <div class="icon">🌤️</div>
                    <div class="temps">--° / --°</div>
                </div>

                <div class="forecast-card">
                    <div class="day">Day 3</div>
                    <div class="icon">🌧️</div>
                    <div class="temps">--° / --°</div>
                </div>

            </div>

        </section>


        <section>

            <h2>🗺️ Weather Radar</h2>

            <div class="radar">

                <div class="radar-placeholder">

                    <div class="radar-circle">
                        📡
                    </div>

                    <h3>Radar</h3>

                    <p>
                        Interactive radar coming next!
                    </p>

                </div>

            </div>

        </section>

    </main>


    <footer>
        <p>Weather Platform</p>
    </footer>


  <script>

async function searchWeather() {

    const input = document.getElementById("locationInput");
    const city = input.value.trim();

    if (city === "") {
        alert("Please enter a city.");
        return;
    }

    try {

        // Find the city's coordinates
        const geoResponse = await fetch(
            `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`
        );

        const geoData = await geoResponse.json();

        if (!geoData.results || geoData.results.length === 0) {
            alert("City not found.");
            return;
        }

        const place = geoData.results[0];

        const latitude = place.latitude;
        const longitude = place.longitude;

        document.getElementById("location").textContent =
            `${place.name}, ${place.country}`;

        // Get weather
        const weatherResponse = await fetch(
            `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&temperature_unit=fahrenheit&wind_speed_unit=mph&forecast_days=16&timezone=auto`
        );

        const weather = await weatherResponse.json();

        // Current weather
        const current = weather.current;

        document.getElementById("temperature").textContent =
            `${Math.round(current.temperature_2m)}°`;

        document.getElementById("feelsLike").textContent =
            `Feels like ${Math.round(current.apparent_temperature)}°`;

        document.getElementById("humidity").textContent =
            `${current.relative_humidity_2m}%`;

        document.getElementById("wind").textContent =
            `${Math.round(current.wind_speed_10m)} mph`;

        document.getElementById("rain").textContent =
            `${current.precipitation}%`;

        document.getElementById("condition").textContent =
            weatherDescription(current.weather_code);

        document.getElementById("weatherIcon").textContent =
            weatherIcon(current.weather_code);

        // Forecast
        const forecast = document.getElementById("forecast");

        forecast.innerHTML = "";

        const days = weather.daily.time;

        days.forEach((date, index) => {

            const card = document.createElement("div");

            card.className = "forecast-card";

            const dayName = new Date(date + "T12:00:00")
                .toLocaleDateString("en-US", {
                    weekday: "short"
                });

            card.innerHTML = `
                <div class="day">${dayName}</div>

                <div class="icon">
                    ${weatherIcon(weather.daily.weather_code[index])}
                </div>

                <div class="temps">
                    ${Math.round(weather.daily.temperature_2m_max[index])}°
                    /
                    ${Math.round(weather.daily.temperature_2m_min[index])}°
                </div>

                <div>
                    🌧️
                    ${weather.daily.precipitation_probability_max[index] ?? 0}%
                </div>
            `;

            forecast.appendChild(card);

        });

    } catch (error) {

        console.error(error);

        alert(
            "Something went wrong while getting the weather."
        );

    }

}


// Weather descriptions
function weatherDescription(code) {

    if (code === 0) return "Clear sky";
    if (code <= 3) return "Partly cloudy";
    if (code <= 48) return "Foggy";
    if (code <= 57) return "Drizzle";
    if (code <= 67) return "Rain";
    if (code <= 77) return "Snow";
    if (code <= 82) return "Rain showers";
    if (code <= 86) return "Snow showers";
    if (code >= 95) return "Thunderstorm";

    return "Unknown";
}


// Weather icons
function weatherIcon(code) {

    if (code === 0) return "☀️";
    if (code <= 3) return "🌤️";
    if (code <= 48) return "🌫️";
    if (code <= 57) return "🌦️";
    if (code <= 67) return "🌧️";
    if (code <= 77) return "❄️";
    if (code <= 82) return "🌦️";
    if (code <= 86) return "🌨️";
    if (code >= 95) return "⛈️";

    return "🌡️";
}

</script>

</body>
</html>
