====================================================
REMOVE DUPLICATES
====================================================
*/

const uniqueWords = new Map();

for (const item of words) {
  uniqueWords.set(item[0].toLowerCase(), {
    word: item[0],
    definition: item[1]
  });
}

const dictionaryWords = Array.from(uniqueWords.values())
  .sort((a,b) => a.word.localeCompare(b.word));

/*
====================================================
DISPLAY
====================================================
*/

const dictionary = document.getElementById("dictionary");
const search = document.getElementById("search");
const count = document.getElementById("count");

function escapeHTML(text) {
  return String(text)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function displayWords(list) {

  dictionary.innerHTML = "";

  if (list.length === 0) {

    dictionary.innerHTML = `
      <div class="no-results">
        🔎 No words found.
        <br><br>
        Try another search.
      </div>
    `;

    count.textContent = "0 words found";
    return;
  }

  let currentLetter = "";

  for (const item of list) {

    const firstLetter =
      item.word.charAt(0).toUpperCase();

    if (firstLetter !== currentLetter) {

      currentLetter = firstLetter;

      const letter = document.createElement("div");

      letter.className = "letter";

      letter.textContent = currentLetter;

      dictionary.appendChild(letter);
    }

    const card = document.createElement("div");

    card.className = "word-card";

    card.innerHTML = `
      <div class="word">
        ${escapeHTML(item.word)}
      </div>

      <div class="definition">
        ${escapeHTML(item.definition)}
      </div>
    `;

    dictionary.appendChild(card);
  }

  count.textContent =
    list.length +
    " word" +
    (list.length === 1 ? "" : "s") +
    " shown";
}

/*
====================================================
SEARCH
====================================================
*/

function searchDictionary() {

  const query =
    search.value.trim().toLowerCase();

  if (query === "") {

    displayWords(dictionaryWords);

    return;
  }

  const results =
    dictionaryWords.filter(item => {

      return (
        item.word
          .toLowerCase()
          .includes(query) ||

        item.definition
          .toLowerCase()
          .includes(query)
      );

    });

  displayWords(results);
}

search.addEventListener(
  "input",
  searchDictionary
);

/*

*/

displayWords(dictionaryWords);
