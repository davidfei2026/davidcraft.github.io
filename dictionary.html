/* DISPLAY */

const container =
  document.getElementById(
    "dictionary"
  );


function displayWords(list) {

  container.innerHTML = "";


  list.forEach(function(item) {

    const div =
      document.createElement(
        "div"
      );


    div.className =
      "word";


    div.innerHTML = `

      <div class="term">
        ${item.word}
      </div>

      <div class="definition">
        ${item.definition}
      </div>

    `;


    container.appendChild(
      div
    );

  });


  document.getElementById(
    "count"
  ).textContent =
    list.length +
    " words shown";

}


displayWords(words);


/* SEARCH */

document
  .getElementById("search")
  .addEventListener(
    "input",
    function() {

      const query =
        this.value
          .toLowerCase()
          .trim();


      const results =
        words.filter(
          function(item) {

            return (

              item.word
                .toLowerCase()
                .includes(query)

              ||

              item.definition
                .toLowerCase()
                .includes(query)

            );

          }
        );


      displayWords(
        results
      );

    }
  );
